# vLLM 서빙 기동 파라미터 (W1-W2 TASK-02)
# "latest" 금지 — 검증된 태그·다이제스트만 기록한다 (ADR-0004).

# ★ 검증 통과 이미지 — 다이제스트로 고정 (태그 "nightly"는 움직이므로 다이제스트가 기준)
image: vllm/vllm-openai@sha256:df6c5814eadd5b5c9e388e7093dfd811f900539619fcf07c65bb637f607898ff
platform: linux/arm64  # DGX Spark (aarch64, GB10 sm_121)

# 탈락: v0.11.0 릴리스 (digest 014a95f2…) — 동봉 triton ptxas가 sm_121a 미지원
# ("ptxas fatal: Value 'sm_121a' is not defined for option 'gpu-name'"). ADR-0004 참조.

model: Qwen/Qwen3.5-35B-A3B  # 주 서빙 (리서치 1안, MoE 활성 3B — 실측 30.8 tok/s)
smoke_model: Qwen/Qwen3-4B  # Extract 베이스 1안 — 배치 추출용 후보

# 기동 전 필수: 페이지 캐시 정리 (통합 메모리 — 아래 notes 참조)
pre_start: sudo sysctl vm.drop_caches=3

run: |
  docker run -d --name vllm-smoke \
    --gpus all --shm-size=16g \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    -p 127.0.0.1:8000:8000 \
    vllm/vllm-openai@sha256:df6c5814eadd5b5c9e388e7093dfd811f900539619fcf07c65bb637f607898ff \
    --model Qwen/Qwen3.5-35B-A3B \
    --max-model-len 16384 \
    --gpu-memory-utilization 0.85

notes:
  - "보안 (실측 2026-09-01): 공인 IP 장비라 -p 8000:8000은 인증 없는 LLM 엔드포인트를
    인터넷에 노출시켰다 (외부 접속 실측 확인 후 차단). 반드시 127.0.0.1 바인딩.
    외부 접근이 필요해지면 SSH 터널 또는 --api-key + 방화벽으로만"
  - "--ipc=host 대신 --shm-size=16g 사용 — 호스트 IPC 네임스페이스 공유 회피"
  - "통합 메모리 함정 (실측 2026-09-01): 파일 캐시가 차 있으면 vLLM이 보는 여유
    메모리가 급감해 기동 실패 (관측: 6.56/119.67 GiB free < 요구 107.7 GiB).
    기본 gpu-memory-utilization 0.9는 이 장비에서 다른 워크로드와 공존 불가 —
    기동 전 drop_caches + utilization 명시가 규칙"
  - "이 장비에 Ollama 서버 상주 중 (타 사용자) — 메모리 계획 시 고려"
  - LoRA 동적 로딩(--enable-lora)은 P5에서 검증 예정
  - 처리량 측정: scripts/21_serving_smoke.py (조건 명시 필수)
