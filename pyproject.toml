[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zzaimy"
version = "0.1.0"
description = "영남이공대학교 국고사업 계획서 작성 지원 시스템"
readme = "README.md"
# Spark 실기 확인값: Python 3.12.3 (spark-1397, 2026-09-01)
requires-python = ">=3.12"
dependencies = [
    "presidio-analyzer>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
# 파서 bake-off (TASK-04) — 무겁다. Spark에서만 설치해도 된다
parsers = [
    "mineru[core]>=2.0",
    "python-hwpx==6.3.0",
    "pyhwp>=0.1b15",   # .hwp(HWP 5.0 바이너리) 텍스트 추출 (ADR-0014 읽기 경로)
    "six",             # pyhwp 런타임 의존 — 없으면 import 실패
    "reportlab>=4.0",  # 합성 표본 생성
]
# 접수·검토 플랫폼 (대시보드)
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-docx>=1.1",  # 추출 결과 전자 문서(.docx) 복원
    "markdown-it-py>=3.0",  # 마크다운 → docx(독스) 변환(md_docx)
    "pypdf>=4.0",        # 검색 가능 PDF — 원본에 OCR 텍스트 레이어 합성
    "reportlab>=4.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openai>=1.40",
    "rdflib>=7.1,<8",   # 온톨로지 OWL·RDF 내보내기(ADR-0056)
    "pyshacl>=0.30",    # SHACL 검사
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",  # fastapi TestClient
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# 느슨하게 시작한다 (W1-W2 TASK-01). 필요해지면 규칙을 추가한다.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
packages = ["zzaimy"]
mypy_path = "src"
# 느슨하게 시작한다. 파이프라인 타입 강제(PII 등)가 들어오는 시점에 조인다.
ignore_missing_imports = true
