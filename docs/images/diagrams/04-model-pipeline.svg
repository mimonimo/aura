<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>모델 학습과 비교</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="566" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">모델 학습과 비교</text><rect x="14.0" y="50.0" width="213.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">학습 후보</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">실문서 양식과 완성본으로</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">만든 문답 쌍</text><rect x="253.3" y="50.0" width="213.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="265.3" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사람 검수</text><text x="265.3" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거와 개인정보를 확인해</text><text x="265.3" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">승인된 데이터만 쓴다</text><rect x="492.7" y="50.0" width="213.3" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="504.7" y="78.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">LoRA SFT</text><text x="504.7" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">DGX 에서 4,434쌍으로</text><text x="504.7" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">학습한다</text><rect x="492.7" y="166.0" width="213.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="504.7" y="194.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">병합과 양자화</text><text x="504.7" y="216.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">어댑터를 병합한 뒤 4비트로</text><text x="504.7" y="237.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">줄인다</text><rect x="253.3" y="166.0" width="213.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="265.3" y="194.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">토르 02 후보 서빙</text><text x="265.3" y="216.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">운영 모델과 같은 장비에서</text><text x="265.3" y="237.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 질문으로 비교한다</text><path d="M227.3,93.0 L253.3,93.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M466.7,93.0 L492.7,93.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M599.3,136.0 L599.3,166.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M492.7,209.0 L466.7,209.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="383.0" y="286.0" width="323.0" height="212.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="395.0" y="314.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">비교 평가와 미채택</text><text x="395.0" y="336.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">시험 220문항에서 chrF 는 27.9에서</text><text x="395.0" y="357.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">36.6으로 오르고, 질문에 없는 수치는</text><text x="395.0" y="378.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">4.1%에서 0%로 줄었다</text><text x="395.0" y="399.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">그러나 문서 작성 시나리오에서는 작업 문서</text><text x="395.0" y="420.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">생성이 2건 중 2건에서 0건으로 떨어졌다</text><text x="395.0" y="441.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">학습 데이터 형식이 에이전트 출력에 섞여</text><text x="395.0" y="462.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">동작이 멈췄기 때문이며, 운영에는 공개 27B</text><text x="395.0" y="483.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">모델을 그대로 쓴다</text><rect x="14.0" y="286.0" width="323.0" height="212.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="314.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Writer v2 학습 데이터셋 (계획)</text><text x="26.0" y="336.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">플랫폼이 실제로 보내는 입력 형식으로</text><text x="26.0" y="357.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">에이전트 단계, 작업 메모, 채팅 답변, 절</text><text x="26.0" y="378.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">작성을 담는다</text><text x="26.0" y="399.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사실과 수치는 검색으로 얻고, 모델은 맥락을</text><text x="26.0" y="420.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">구성하는 능력만 학습한다</text><path d="M360.0,252.0 L360.0,272.0 L544.5,272.0 L544.5,286.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M383.0,392.0 L337.0,392.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="341.0" y="414.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">다시</text><text x="341.0" y="435.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">학습</text><path d="M120.7,286.0 L120.7,136.0" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="14.0" y="526.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">비교 평가에서는 모델만 바꾸고 질문, 플랫폼 코드, 설정, 채점 모델은 그대로 둔다. 먼저 정답 로그확률로</text><text x="14.0" y="547.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">학습 결과가 서빙 모델에 반영되었는지 확인한다.</text></svg>
