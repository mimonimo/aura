<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>모델 학습과 서빙</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">모델 학습과 서빙</text><rect x="28" y="76" width="168" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">학습 후보</text><text x="44" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">실문서 양식 × 완성본</text><text x="44" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">서빙 프롬프트 꼴 문답</text><path d="M196,126 L222,126" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="222" y="76" width="168" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="238" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">사람 검수</text><text x="238" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">근거 일치 · 개인정보</text><text x="238" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">승인본만 학습</text><path d="M390,126 L416,126" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="416" y="76" width="168" height="100" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="432" y="102" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">LoRA SFT</text><text x="432" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">DGX · bf16</text><text x="432" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">writer-v1 학습셋</text><path d="M584,126 L610,126" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="610" y="76" width="168" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="626" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">병합 · NVFP4</text><text x="626" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">어댑터 병합 뒤</text><text x="626" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">4비트 양자화</text><path d="M778,126 L804,126" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="804" y="76" width="168" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="820" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">토르 02 서빙</text><text x="820" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">운영 모델과</text><text x="820" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">같은 장비에서 후보로</text><rect x="570" y="230" width="402" height="118" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="586" y="256" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">비교 평가 (진행 중)</text><text x="586" y="278" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">같은 문항으로 운영 모델 · 어댑터 · 병합본을 견줌</text><text x="586" y="297" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">눈가림 쌍대 채점 · 지어낸 숫자 · 응답 속도</text><text x="586" y="316" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 나으면 운영 교체, 아니면 학습셋 보강</text><path d="M870,176 L870,230" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="230" width="470" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="256" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">writer-v1 학습셋</text><text x="44" y="278" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">학습 4,434 · 검증 346 · 시험 220 (승인본)</text><text x="44" y="297" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">LoRA 학습은 10-22 마침, 결과 수치는 비교가 끝난 뒤 적는다</text><text x="44" y="316" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 사실·수치는 검색으로 공급, 모델에는 맥락 구성 능력만</text><path d="M570,300 L498,300" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="534.0" y="292" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">보강</text></svg>
