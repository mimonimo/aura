<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>모델 학습과 비교</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">모델 학습과 비교</text><rect x="28" y="76" width="168" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">학습 후보</text><text x="44" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">실문서 양식 × 완성본</text><text x="44" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">서빙 프롬프트 꼴 문답</text><path d="M196,126 L222,126" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="222" y="76" width="168" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="238" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">사람 검수</text><text x="238" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">근거 일치 · 개인정보</text><text x="238" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">승인본만 학습</text><path d="M390,126 L416,126" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="416" y="76" width="168" height="100" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="432" y="102" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">LoRA SFT</text><text x="432" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">DGX · bf16</text><text x="432" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">writer-v1 4,434쌍</text><path d="M584,126 L610,126" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="610" y="76" width="168" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="626" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">병합 · NVFP4</text><text x="626" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">어댑터 병합 뒤</text><text x="626" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">4비트 양자화</text><path d="M778,126 L804,126" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="804" y="76" width="168" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="820" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">토르 02 후보 서빙</text><text x="820" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">운영 모델과 같은 장비</text><text x="820" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">같은 질문으로 나란히</text><rect x="546" y="230" width="426" height="136" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="562" y="256" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">비교 평가 (10-24, 채택하지 않음)</text><text x="562" y="278" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">시험 220문항 chrF 27.9 → 36.6, 질문에 없는 숫자 4.1% → 0%</text><text x="562" y="297" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">문서 작성 시나리오 작업본 2/2 → 0/2</text><text x="562" y="316" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 학습셋 틀이 에이전트 출력에 새어 동작이 멈춤</text><text x="562" y="335" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 운영은 오픈 27B(NVFP4)를 그대로 쓴다</text><path d="M870,176 L870,230" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="230" width="446" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/><text x="44" y="256" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">Writer v2 학습 데이터 (계획)</text><text x="44" y="278" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">플랫폼이 실제로 보내는 꼴로 만든다</text><text x="44" y="297" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">에이전트 단계 JSON · 작업 메모 · 채팅 답 · 절 쓰기</text><text x="44" y="316" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 넘기기 전 점검: 틀 0/45, 작업본 2/2, chrF v1 이상</text><text x="44" y="335" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 사실·수치는 검색으로, 모델에는 맥락 구성 능력만</text><path d="M546,300 L474,300" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="510.0" y="292" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">다시 학습</text><path d="M112,230 L112,176" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="28" y="404" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">비교는 모델 하나만 바꾸고 질문·플랫폼 코드·설정·채점 모델은 그대로 둔다. 먼저 정답 로그확률로 학습이 서빙에 들어갔는지 본다(ADR-0069).</text></svg>
