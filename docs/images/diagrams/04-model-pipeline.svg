<svg xmlns="http://www.w3.org/2000/svg" width="720" height="545" viewBox="0 0 720 545" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>모델 학습과 비교</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="545" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">모델 학습과 비교</text><rect x="14.0" y="50.0" width="213.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">학습 후보</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">실문서 양식 × 완성본</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서빙 프롬프트 꼴 문답</text><rect x="253.3" y="50.0" width="213.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="265.3" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사람 검수</text><text x="265.3" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거 일치 · 개인정보</text><text x="265.3" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">승인본만 학습</text><rect x="492.7" y="50.0" width="213.3" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="504.7" y="78.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">LoRA SFT</text><text x="504.7" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">DGX · bf16</text><text x="504.7" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">writer-v1 4,434쌍</text><rect x="492.7" y="166.0" width="213.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="504.7" y="194.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">병합 · NVFP4</text><text x="504.7" y="216.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">어댑터 병합 뒤</text><text x="504.7" y="237.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">4비트 양자화</text><rect x="253.3" y="166.0" width="213.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="265.3" y="194.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">토르 02 후보 서빙</text><text x="265.3" y="216.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">운영 모델과 같은 장비</text><text x="265.3" y="237.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 질문으로 나란히</text><path d="M227.3,93.0 L253.3,93.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M466.7,93.0 L492.7,93.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M599.3,136.0 L599.3,166.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M492.7,209.0 L466.7,209.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="383.0" y="286.0" width="323.0" height="191.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="395.0" y="314.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">비교 평가 (10-24, 채택하지 않음)</text><text x="395.0" y="336.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">시험 220문항 chrF 27.9 → 36.6, 질문에</text><text x="395.0" y="357.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">없는 숫자 4.1% → 0%</text><text x="395.0" y="378.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">문서 작성 시나리오 작업본 2/2 → 0/2</text><text x="395.0" y="399.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 학습셋 틀이 에이전트 출력에 새어 동작이</text><text x="395.0" y="420.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">멈춤</text><text x="395.0" y="441.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 운영은 오픈 27B(NVFP4)를 그대로 쓴다</text><rect x="14.0" y="286.0" width="323.0" height="191.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="314.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Writer v2 학습 데이터 (계획)</text><text x="26.0" y="336.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">플랫폼이 실제로 보내는 꼴로 만든다</text><text x="26.0" y="357.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">에이전트 단계 JSON · 작업 메모 · 채팅 답 ·</text><text x="26.0" y="378.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">절 쓰기</text><text x="26.0" y="399.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 넘기기 전 점검: 틀 0/45, 작업본 2/2, chrF</text><text x="26.0" y="420.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">v1 이상</text><text x="26.0" y="441.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 사실·수치는 검색으로, 모델에는 맥락 구성</text><text x="26.0" y="462.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">능력만</text><path d="M360.0,252.0 L360.0,272.0 L544.5,272.0 L544.5,286.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M383.0,381.5 L337.0,381.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="341.0" y="403.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">다시</text><text x="341.0" y="424.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">학습</text><path d="M120.7,286.0 L120.7,136.0" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="14.0" y="505.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">비교는 모델 하나만 바꾸고 질문·플랫폼 코드·설정·채점 모델은 그대로 둔다. 먼저 정답 로그확률로 학습이</text><text x="14.0" y="526.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">서빙에 들어갔는지 본다(ADR-0069).</text></svg>
