<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>AURA 전체 처리 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="424" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 전체 처리 흐름</text><rect x="14.0" y="50.0" width="208.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">원본</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">PDF · HWP/HWPX</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">오피스 · 이미지</text><path d="M222.0,93.0 L256.0,93.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="256.0" y="50.0" width="208.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="268.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">읽기</text><text x="268.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">텍스트 레이어 추출</text><text x="268.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">OCR과 한글 문서 변환</text><path d="M464.0,93.0 L498.0,93.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="498.0" y="50.0" width="208.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="510.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">등록·분류</text><text x="510.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서류 종류와 사업 분류</text><text x="510.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">부서와 열람 권한 지정</text><rect x="14.0" y="170.0" width="208.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="198.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">색인·그래프</text><text x="26.0" y="220.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">어휘·의미 검색 색인</text><text x="26.0" y="241.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업·문서·절 관계 그래프</text><path d="M222.0,213.0 L256.0,213.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="256.0" y="170.0" width="208.0" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="268.0" y="198.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">에이전트</text><text x="268.0" y="220.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Writer 27B</text><text x="268.0" y="241.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거 검색, 초안 작성, 검토</text><path d="M464.0,213.0 L498.0,213.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="498.0" y="170.0" width="208.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="510.0" y="198.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">결과</text><text x="510.0" y="220.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">출처를 단 답변</text><text x="510.0" y="241.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">한글 작업 문서와 HWPX</text><path d="M602.0,136.0 L602.0,153.0 L118.0,153.0 L118.0,170.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="276.0" width="692.0" height="134.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="298.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">코드로 수행하는 검증 단계</text><text x="26.0" y="324.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">열람 범위</text><text x="26.0" y="345.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">검색 단계에서 열람 권한 밖 문서를 제외한다</text><text x="368.0" y="324.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">수치 근거 대조</text><text x="368.0" y="345.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">근거에 없는 수치는 「○○」로 마스킹한다</text><text x="26.0" y="374.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">양식 모양</text><text x="26.0" y="395.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">원본 서식은 유지하고 내용만 채운다</text><text x="368.0" y="374.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">사람 확인</text><text x="368.0" y="395.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">확인되지 않은 값은 담당자에게 확인을 요청한다</text></svg>
