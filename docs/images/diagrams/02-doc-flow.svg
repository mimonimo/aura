<svg xmlns="http://www.w3.org/2000/svg" width="982" height="330" viewBox="0 0 982 330" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>문서가 답과 초안이 되기까지</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="982" height="330" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">문서가 답과 초안이 되기까지</text><rect x="28" y="76" width="136" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">원본</text><text x="44" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">PDF · HWP/HWPX</text><text x="44" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">오피스 · 이미지</text><path d="M164,128 L186,128" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="186" y="76" width="136" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="202" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">읽기</text><text x="202" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">글자층 직독</text><text x="202" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">OCR · 한글 변환</text><path d="M322,128 L344,128" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="344" y="76" width="136" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="360" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">등록·분류</text><text x="360" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">서류 갈래 · 사업</text><text x="360" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">부서 · 열람 권한</text><path d="M480,128 L502,128" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="502" y="76" width="136" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="518" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">색인·그래프</text><text x="518" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">어휘 + 의미 검색</text><text x="518" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">사업·문서·절 관계</text><path d="M638,128 L660,128" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="660" y="76" width="136" height="104" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="676" y="102" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">에이전트</text><text x="676" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Writer 27B</text><text x="676" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">찾기 · 쓰기 · 검토</text><path d="M796,128 L818,128" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="818" y="76" width="136" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="834" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">결과</text><text x="834" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">출처 단 답</text><text x="834" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">한글 작업본 · HWPX</text><rect x="28" y="206" width="926" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="42" y="226" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">코드가 지키는 관문</text><text x="46" y="252" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">열람 범위</text><text x="46" y="274" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">검색 단계에서 권한 밖 문서를 뺀다</text><text x="274" y="252" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">수치 근거 대조</text><text x="274" y="274" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">근거에 없는 숫자는 「○○」로 가린다</text><text x="502" y="252" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">양식 모양</text><text x="502" y="274" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">원본 서식은 두고 내용만 채운다</text><text x="730" y="252" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">사람 확인</text><text x="730" y="274" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">모르는 값은 담당자에게 묻는다</text></svg>
