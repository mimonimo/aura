<svg xmlns="http://www.w3.org/2000/svg" width="980" height="630" viewBox="0 0 980 630" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>문서 작업 에이전트의 단계 구조와 관문</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="630" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">문서 작업 에이전트 — 모델이 고르고 코드 관문이 지킨다</text><rect x="28" y="62" width="640" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="84" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">자료 구분 기호 &lt;&lt;&lt; &gt;&gt;&gt; 안에만 넣음</text><text x="44" y="106" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">상태</text><text x="44" y="128" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">요청 · 작업 메모 · 최근 대화 · 프로젝트 문서 목록</text><text x="44" y="147" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">작업본 절 목록과 빈 절 · 받지 못한 값 · 지금까지 한 단계</text><rect x="28" y="192" width="640" height="64" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="218" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">Writer 27B</text><text x="44" y="240" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">{생각, 도구, 인자} 를 JSON 으로</text><rect x="28" y="288" width="640" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="314" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">코드 관문</text><text x="44" y="336" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">단계 14번 · 문서 쓰기 4번까지 · 같은 단계 세 번 잇달으면 멈춤</text><text x="44" y="355" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">되돌리기 어려운 도구는 담당자 요청 글에 그 뜻이 부정 없이 있을 때만</text><text x="44" y="374" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">찾기 전 사실 답 금지(먼저 찾기) · 열람 범위 · 수치 근거 대조 · 양식 모양</text><rect x="28" y="424" width="640" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="450" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">도구 실행</text><text x="44" y="472" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">찾기 · 읽기 · 양식 · 쓰기 · 고치기 · 묻기 · 내보내기 …</text><text x="44" y="491" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 결과는 자료로만 돌려줌(자료 속 구분 기호 · 머리말은 전각으로)</text><rect x="28" y="540" width="640" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="566" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">모든 단계 기록 (doc_agent_episodes)</text><text x="44" y="588" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">리즈닝 학습 재료</text><path d="M348,160 L348,192" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M348,256 L348,288" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M348,392 L348,424" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M348,508 L348,540" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M668,466 L704,466 L704,111 L668,111" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="714" y="460" font-size="12.5" font-weight="600" fill="#64748b" text-anchor="start">다음 단계</text><rect x="734" y="176" width="218" height="96" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="750" y="204" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">한도에 닿았는데 찾은</text><text x="750" y="224" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">근거가 있으면 「답하기만</text><text x="750" y="244" font-size="12" font-weight="400" fill="#1f2937" text-anchor="start">고를 수 있는 마지막 단계」</text><path d="M734,224 L668,224" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/></svg>
