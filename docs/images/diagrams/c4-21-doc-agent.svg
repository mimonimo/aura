<svg xmlns="http://www.w3.org/2000/svg" width="720" height="706" viewBox="0 0 720 706" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>문서 작업 에이전트의 단계 구조와 관문</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="706" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">문서 작업 에이전트 구조</text><rect x="14.0" y="50.0" width="576.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="578.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">자료는 구분 기호 안에만 넣는다</text><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">상태</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">요청, 작업 메모, 최근 대화, 프로젝트 문서 목록</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">작업 문서의 절 목록, 빈 절, 받지 못한 값, 지금까지 수행한 단계</text><rect x="14.0" y="154.0" width="330.0" height="104.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="191.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">Writer 27B</text><text x="26.0" y="213.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">생각과 쓸 도구, 그 인자를 정해진</text><text x="26.0" y="234.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">형식(JSON)으로 출력한다</text><rect x="364.0" y="154.0" width="226.0" height="104.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="376.0" y="180.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">단계 한도에 이르렀을 때 찾은</text><text x="376.0" y="201.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거가 있으면, 답변만 할 수</text><text x="376.0" y="222.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">있는 마지막 단계를 한 번 더</text><text x="376.0" y="243.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">실행한다</text><path d="M344.0,206.0 L364.0,206.0" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4"/><path d="M179.0,136.0 L179.0,154.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="276.0" width="576.0" height="128.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="304.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">코드 검증 단계</text><text x="26.0" y="326.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">최대 14단계, 문서 쓰기는 4회까지 허용하고 같은 단계가 세 번 이어지면 멈춘다</text><text x="26.0" y="347.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">되돌리기 어려운 도구는 담당자 요청에 그 의도가 분명히 드러날 때만 허용한다</text><text x="26.0" y="368.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">검색하기 전에는 사실을 답하지 못하게 하고, 열람 범위와 수치 근거, 양식 형태를</text><text x="26.0" y="389.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">확인한다</text><path d="M179.0,258.0 L179.0,276.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="422.0" width="350.0" height="128.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="450.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">도구 실행</text><text x="26.0" y="472.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">검색, 읽기, 양식 선택, 작성, 수정, 질문,</text><text x="26.0" y="493.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">내보내기 등</text><text x="26.0" y="514.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">결과는 자료로만 돌려주며, 자료 안의 구분 기호는</text><text x="26.0" y="535.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">다른 글자로 바꾼다</text><rect x="394.0" y="422.0" width="196.0" height="128.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="406.0" y="450.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">모든 단계 기록</text><text x="406.0" y="472.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">단계마다 판단과 결과를</text><text x="406.0" y="493.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">남겨 추론 학습 데이터로</text><text x="406.0" y="514.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">활용한다</text><path d="M179.0,404.0 L179.0,422.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M364.0,486.0 L394.0,486.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M239.0,550.0 L239.0,564.0 L630.0,564.0 L630.0,93.0 L590.0,93.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="638.0" y="162.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">다음 단계</text><rect x="14.0" y="590.0" width="576.0" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="578.0" y="617.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">마무리 직전 한 번</text><text x="26.0" y="618.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">마무리 전 다시 읽기</text><text x="26.0" y="640.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">문서를 쓴 요청은 끝내기 전에 작업 문서를 다시 읽는다</text><text x="26.0" y="661.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">빈 표, 빈칸, 다른 절에 들어간 표 같은 문제를 모델이 찾아 고친 뒤 끝낸다</text><path d="M119.0,550.0 L119.0,590.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/></svg>
