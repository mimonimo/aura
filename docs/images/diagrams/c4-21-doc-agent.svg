<svg xmlns="http://www.w3.org/2000/svg" width="720" height="538" viewBox="0 0 720 538" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>문서 작업 에이전트의 단계 구조와 관문</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="538" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">문서 작업 에이전트: 모델이 고르고 코드 검증 단계가 지킨다</text><rect x="14.0" y="50.0" width="576.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="578.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">자료 구분 기호 &lt;&lt;&lt; &gt;&gt;&gt; 안에만 넣음</text><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">상태</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">요청 · 작업 메모 · 최근 대화 · 프로젝트 문서 목록</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">작업본 절 목록과 빈 절 · 받지 못한 값 · 지금까지 한 단계</text><rect x="14.0" y="154.0" width="330.0" height="83.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="191.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">Writer 27B</text><text x="26.0" y="213.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">{생각, 도구, 인자} 를 JSON 으로</text><rect x="364.0" y="154.0" width="226.0" height="83.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="376.0" y="180.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">한도에 닿았는데 찾은 근거가</text><text x="376.0" y="201.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">있으면 「답하기만 고를 수 있는</text><text x="376.0" y="222.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">마지막 단계」</text><path d="M344.0,195.5 L364.0,195.5" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4"/><path d="M179.0,136.0 L179.0,154.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="255.0" width="576.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="283.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">코드 검증 단계</text><text x="26.0" y="305.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">단계 14번 · 문서 쓰기 4번까지 · 같은 단계 세 번 잇달으면 멈춤</text><text x="26.0" y="326.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">되돌리기 어려운 도구는 담당자 요청 글에 그 뜻이 부정 없이 있을 때만</text><text x="26.0" y="347.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">찾기 전 사실 답 금지(먼저 찾기) · 열람 범위 · 수치 근거 대조 · 양식 모양</text><path d="M179.0,237.0 L179.0,255.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="380.0" width="350.0" height="128.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="408.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">도구 실행</text><text x="26.0" y="430.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">찾기 · 읽기 · 양식 · 쓰기 · 고치기 · 묻기 ·</text><text x="26.0" y="451.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">내보내기 …</text><text x="26.0" y="472.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 결과는 자료로만 돌려줌(자료 속 구분 기호 ·</text><text x="26.0" y="493.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">머리말은 전각으로)</text><rect x="394.0" y="380.0" width="196.0" height="128.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="406.0" y="408.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">모든 단계 기록</text><text x="406.0" y="432.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">(doc_agent_episodes)</text><text x="406.0" y="454.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">리즈닝 학습 재료</text><path d="M179.0,362.0 L179.0,380.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M364.0,444.0 L394.0,444.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M239.0,508.0 L239.0,522.0 L630.0,522.0 L630.0,93.0 L590.0,93.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="638.0" y="162.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">다음 단계</text></svg>
