<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>웹 한글 기안기 편집 영역 단위 공동 편집</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="630" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">웹 한글 기안기 — 편집 영역 단위 공동 편집</text><rect x="14.0" y="46.0" width="222.7" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="224.7" y="73.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">편집</text><text x="26.0" y="74.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사용자 A</text><text x="26.0" y="96.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">「요약」 편집 영역을 쥐고 쓰는</text><text x="26.0" y="117.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">중</text><text x="26.0" y="138.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 300ms 마다 바뀐 부분만</text><rect x="248.7" y="46.0" width="222.7" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="459.3" y="73.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">편집</text><text x="260.7" y="74.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사용자 B</text><text x="260.7" y="96.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">다른 편집 영역을 동시에 씀</text><text x="260.7" y="117.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· A 가 쥔 편집 영역은</text><text x="260.7" y="138.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">이름표만 흔들림</text><rect x="483.3" y="46.0" width="222.7" height="107.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="73.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">참여자</text><text x="495.3" y="74.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 에이전트</text><text x="495.3" y="96.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">대화 요청으로 절을 씀(27B)</text><text x="495.3" y="117.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 흘려 씀, 쥔 편집 영역은</text><text x="495.3" y="138.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">건너뜀</text><rect x="14.0" y="183.0" width="310.0" height="170.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="312.0" y="210.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">브라우저마다</text><text x="26.0" y="211.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">편집 화면</text><text x="26.0" y="233.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">어댑터: 기안기 API 를 부르는 유일한</text><text x="26.0" y="254.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">곳(편집 영역 읽기·쓰기·잠그기)</text><text x="26.0" y="275.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">공동 편집 층: 편집 잠금·버전 번호, 보낼</text><text x="26.0" y="296.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">줄·충돌 사본, 이름 깃발</text><text x="26.0" y="317.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 보낼 줄은 IndexedDB 에도 둠</text><text x="26.0" y="338.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 한글 조합 중에는 읽지 않음</text><rect x="394.0" y="183.0" width="312.0" height="254.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="210.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">정답을 쥔 곳</text><text x="406.0" y="211.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 서버 (운영 서버)</text><text x="406.0" y="233.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">편집 잠금: 먼저 잡은 사람만 씀</text><text x="406.0" y="254.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 입력·커서로 늘고, 옮기면 풀림</text><text x="406.0" y="275.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 기본 300초, 기다리면 120초</text><text x="406.0" y="296.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">버전 번호: 같은 변경은 한 번만</text><text x="406.0" y="317.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 버전이 어긋나면 충돌 사본으로 둠</text><text x="406.0" y="338.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서식: 편집 영역째 JSON 블록, 검사 뒤 전달</text><text x="406.0" y="359.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">구조 고침(표·그림): 저절로 잠금</text><text x="406.0" y="380.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">알림 줄 → SSE 로 다른 화면에</text><text x="406.0" y="401.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">AURA 절도 같은 편집 영역 길로 조금씩</text><text x="406.0" y="422.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 열린 화면에 바로 써 내려감</text><path d="M125.3,153.0 L125.3,183.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)" marker-start="url(#tail)"/><path d="M360.0,153.0 L360.0,168.0 L284.0,168.0 L284.0,183.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)" marker-start="url(#tail)"/><path d="M594.7,153.0 L594.7,183.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="586.7" y="176.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">절 쓰기 요청</text><path d="M324.0,223.0 L394.0,223.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="327.0" y="245.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">편집 잠금</text><text x="327.0" y="266.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">·변경</text><path d="M394.0,333.0 L324.0,333.0" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="328.0" y="355.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">SSE 알림</text><rect x="14.0" y="369.0" width="310.0" height="149.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="312.0" y="396.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">파일</text><text x="26.0" y="397.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">한글 파일 (hwpx)</text><text x="26.0" y="419.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">편집 영역 글: 3초 뒤(이어지면 20초마다)</text><text x="26.0" y="440.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">바뀐 글자만</text><text x="26.0" y="461.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">AURA 절: 다 쓴 뒤 그 편집 영역만</text><text x="26.0" y="482.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 앞 버전은 .판/ 에 남김</text><text x="26.0" y="503.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 부서 문서함에 저장</text><rect x="394.0" y="461.0" width="312.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="406.0" y="489.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">기안기 서버 (웹 한글 편집 엔진)</text><text x="406.0" y="511.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">내부: 운영 서버 안에서만 열림</text><text x="406.0" y="532.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 밖에서 직접 접속 불가</text><path d="M434.0,437.0 L434.0,461.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="446.0" y="455.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">프록시</text><path d="M394.0,409.0 L324.0,409.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="328.0" y="431.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">써 넣기</text><text x="14.0" y="569.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">문서를 열 때 편집 영역 밖 문단을 편집 영역(「문단:n」)으로 감싸 제목·표 셀까지 편집 영역으로 고친다. 한</text><text x="14.0" y="590.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">편집 영역은 먼저 잡은 사람만, 표·그림·용지 고침만 한 사람씩 문서 전체로. 글이 겹치면 버리지 않고 충돌</text><text x="14.0" y="611.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">사본으로 둔다. 시간 값(편집 잠금·보내기 간격·써 넣기)은 모두 설정으로 바꾼다(ADR-0070).</text></svg>
