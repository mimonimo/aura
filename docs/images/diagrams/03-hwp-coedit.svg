<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="540" viewBox="0 0 1140 540" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>웹 한글 기안기 칸 단위 공동 편집</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1140" height="540" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">웹 한글 기안기 — 칸 단위 공동 편집</text><rect x="28" y="74" width="196" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="96" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">편집</text><text x="44" y="118" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">사용자 A</text><text x="44" y="140" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">「요약」 칸을 쥐고 쓰는 중</text><text x="44" y="159" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 300ms 마다 바뀐 부분만</text><rect x="28" y="190" width="196" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="212" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">편집</text><text x="44" y="234" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">사용자 B</text><text x="44" y="256" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">다른 칸을 동시에 씀</text><text x="44" y="275" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· A 가 쥔 칸은 이름표만 흔들림</text><rect x="28" y="330" width="196" height="100" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="352" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">참여자</text><text x="44" y="374" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 에이전트</text><text x="44" y="396" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">대화 요청으로 절을 씀(27B)</text><text x="44" y="415" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 흘려 씀, 쥔 칸은 건너뜀</text><rect x="280" y="74" width="252" height="216" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="296" y="96" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">브라우저마다</text><text x="296" y="118" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">편집 화면</text><text x="296" y="140" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">어댑터 — 기안기 API 를 부르는</text><text x="296" y="159" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">유일한 곳(칸 읽기·쓰기·잠그기)</text><text x="296" y="178" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">공동 편집 층 — 임대·판 번호,</text><text x="296" y="197" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">보낼 줄·충돌 사본, 이름 깃발</text><text x="296" y="216" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 보낼 줄은 IndexedDB 에도 둠</text><text x="296" y="235" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 한글 조합 중에는 읽지 않음</text><rect x="590" y="74" width="272" height="356" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="606" y="96" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">정답을 쥔 곳</text><text x="606" y="118" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 서버 (운영 서버)</text><text x="606" y="140" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">칸 임대 — 먼저 잡은 사람만 씀</text><text x="606" y="159" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 입력·커서로 늘고, 옮기면 풀림</text><text x="606" y="178" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 기본 300초, 기다리면 120초</text><text x="606" y="197" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start"></text><text x="606" y="216" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">판 번호 — 같은 변경은 한 번만</text><text x="606" y="235" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 판이 어긋나면 충돌 사본으로 둠</text><text x="606" y="254" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start"></text><text x="606" y="273" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">서식 — 칸째 JSON 블록, 검사 뒤 전달</text><text x="606" y="292" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">구조 고침(표·그림) — 저절로 잠금</text><text x="606" y="311" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start"></text><text x="606" y="330" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">알림 줄 → SSE 로 다른 화면에</text><text x="606" y="349" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">AURA 절도 같은 칸 길로 조금씩</text><text x="606" y="368" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 열린 화면에 바로 써 내려감</text><rect x="916" y="74" width="196" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="932" y="96" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">내부</text><text x="932" y="118" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">기안기 서버</text><text x="932" y="140" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">웹 한글 편집 엔진</text><text x="932" y="159" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">운영 서버 안에서만 열림</text><text x="932" y="178" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 밖에서 직접 접속 불가</text><rect x="916" y="250" width="196" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="932" y="272" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">파일</text><text x="932" y="294" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">한글 파일 (hwpx)</text><text x="932" y="316" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">칸 글: 3초 뒤(이어지면</text><text x="932" y="335" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">20초마다) 바뀐 글자만</text><text x="932" y="354" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">AURA 절: 다 쓴 뒤 그 칸만</text><text x="932" y="373" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 앞 판은 .판/ 에 남김</text><text x="932" y="392" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 부서 문서함에 저장</text><path d="M224,124 L280,124" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><path d="M224,240 L280,240" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><path d="M532,126 L590,126" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="561.0" y="118" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">임대·변경</text><path d="M590,230 L532,230" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="561.0" y="222" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">SSE 알림</text><path d="M224,380 L590,380" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="407.0" y="372" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">절 쓰기 요청</text><path d="M862,134 L916,134" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="889.0" y="126" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">프록시</text><path d="M862,340 L916,340" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="889.0" y="332" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">써 넣기</text><text x="28" y="486" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">문서를 열 때 칸 밖 문단을 칸(「문단:n」)으로 감싸 제목·표 칸까지 칸으로 고친다. 한 칸은 먼저 잡은 사람만, 표·그림·용지 고침만 한 사람씩 문서 전체로.</text><text x="28" y="506" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">글이 겹치면 버리지 않고 충돌 사본으로 둔다. 시간 값(임대·보내기 간격·써 넣기)은 모두 설정으로 바꾼다(ADR-0070).</text></svg>
