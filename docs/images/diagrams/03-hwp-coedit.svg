<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>한글 웹 기안기 동시 열기</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">한글 웹 기안기 — 같은 문서를 여럿이 열 때</text><rect x="28" y="74" width="220" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="96" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">편집</text><text x="44" y="118" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">사용자 A</text><text x="44" y="140" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">먼저 연 사람 — 편집 잠금</text><text x="44" y="159" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">고치면 2초 뒤 자동 저장</text><rect x="28" y="186" width="220" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="208" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">대기</text><text x="44" y="230" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">사용자 B</text><text x="44" y="252" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">「A 님이 편집 중 — 보기 전용」</text><text x="44" y="271" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">A 가 닫으면 잠금을 이어받음</text><rect x="28" y="298" width="220" height="96" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="320" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">채팅</text><text x="44" y="342" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 에이전트</text><text x="44" y="364" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">대화 요청으로 칸·절을 씀</text><text x="44" y="383" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">편집 중인 화면에 바로 반영</text><rect x="330" y="74" width="330" height="320" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="346" y="100" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 플랫폼 (운영 서버)</text><text x="346" y="122" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">로그인·열람 범위 확인 뒤 기안기로 넘김</text><text x="346" y="141" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start"></text><text x="346" y="160" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">편집 잠금 — 한 문서에 한 사람</text><text x="346" y="179" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 45초마다 늘리고, 끊기면 2분 뒤 풀림</text><text x="346" y="198" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 잠금 없는 저장은 거절(409)</text><text x="346" y="217" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start"></text><text x="346" y="236" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">칸 글 실시간 전달 — AURA 가 쓴 칸</text><text x="346" y="255" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 편집 화면 머리줄 「AURA 작성 중 · 절」</text><text x="346" y="274" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start"></text><text x="346" y="293" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">저장 — 앞 판은 10분에 하나, 30개까지</text><text x="346" y="312" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">에이전트 쓰기도 같은 판 기록(고친 사람 AURA)</text><rect x="742" y="74" width="230" height="132" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="96" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">내부</text><text x="758" y="118" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">기안기 서버</text><text x="758" y="140" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">웹 한글 편집 엔진</text><text x="758" y="159" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">운영 서버 안에서만 열림</text><text x="758" y="178" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 밖에서 직접 접속 불가</text><rect x="742" y="262" width="230" height="132" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="758" y="284" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">파일</text><text x="758" y="306" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">한글 문서함</text><text x="758" y="328" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">부서 폴더 · 내 폴더</text><text x="758" y="347" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">공통 양식 · 지난 사업 문서</text><text x="758" y="366" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 앞 판 · 휴지통</text><path d="M248,122 L330,122" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><path d="M248,234 L330,234" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><path d="M248,346 L330,346" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="289.0" y="338" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">칸·절 쓰기</text><path d="M660,140 L742,140" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="701.0" y="132" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">프록시</text><path d="M660,328 L742,328" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="701.0" y="320" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">저장·판</text><text x="28" y="440" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">지금은 한 번에 한 사람이 고치고, 다른 사람은 보기 전용으로 기다린다. 기다리는 화면은 다시 열 때 최신 판을 받는다.</text></svg>
