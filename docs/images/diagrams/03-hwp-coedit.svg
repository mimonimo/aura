<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>웹 한글 기안기 편집 영역 단위 공동 편집</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="546" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">웹 한글 기안기의 영역 단위 공동 편집</text><rect x="14.0" y="46.0" width="222.7" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="224.7" y="73.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">편집</text><text x="26.0" y="74.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사용자 A</text><text x="26.0" y="96.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">「요약」 영역을 잠그고 쓰며</text><text x="26.0" y="117.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">0.3초마다 변경을 보낸다</text><rect x="248.7" y="46.0" width="222.7" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="459.3" y="73.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">편집</text><text x="260.7" y="74.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사용자 B</text><text x="260.7" y="96.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">다른 영역을 동시에 쓰며 A 의</text><text x="260.7" y="117.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이름표를 본다</text><rect x="483.3" y="46.0" width="222.7" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="73.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">참여자</text><text x="495.3" y="74.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 에이전트</text><text x="495.3" y="96.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">요청받은 절을 27B 가 쓰고</text><text x="495.3" y="117.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">잠긴 영역은 건너뛴다</text><rect x="14.0" y="162.0" width="310.0" height="170.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="312.0" y="189.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">브라우저마다</text><text x="26.0" y="190.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">편집 화면</text><text x="26.0" y="212.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">연결 모듈 하나가 편집 영역을 읽고 쓰고</text><text x="26.0" y="233.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">잠근다</text><text x="26.0" y="254.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">편집 잠금과 버전 번호, 보낼 변경, 이름표를</text><text x="26.0" y="275.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">관리한다</text><text x="26.0" y="296.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">보낼 변경은 브라우저에도 보관한다</text><text x="26.0" y="317.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">한글을 조합하는 동안에는 읽지 않는다</text><rect x="394.0" y="162.0" width="312.0" height="212.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="406.0" y="188.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">기준 데이터 보관</text><text x="406.0" y="211.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 서버 (운영 서버)</text><text x="406.0" y="233.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">편집 잠금은 먼저 요청한 사용자에게 주고</text><text x="406.0" y="254.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">입력하는 동안 연장한다</text><text x="406.0" y="275.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">버전 번호가 맞지 않는 변경은 충돌 사본으로</text><text x="406.0" y="296.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">보관한다</text><text x="406.0" y="317.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">표나 그림을 바꾸면 문서 전체를 잠근다</text><text x="406.0" y="338.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">변경은 SSE 알림으로 다른 화면에 전달한다</text><text x="406.0" y="359.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">AURA 가 쓴 절도 같은 경로로 나누어 보낸다</text><path d="M125.3,132.0 L125.3,162.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)" marker-start="url(#tail)"/><path d="M360.0,132.0 L360.0,147.0 L284.0,147.0 L284.0,162.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)" marker-start="url(#tail)"/><path d="M594.7,132.0 L594.7,162.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="586.7" y="155.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">절 작성 요청</text><path d="M324.0,202.0 L394.0,202.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="327.0" y="224.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">잠금·변경</text><path d="M394.0,312.0 L324.0,312.0" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="328.0" y="334.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">SSE 알림</text><rect x="14.0" y="348.0" width="310.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="312.0" y="375.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">파일</text><text x="26.0" y="376.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">한글 파일 (hwpx)</text><text x="26.0" y="398.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">입력이 3초 멈추면 바뀐 부분만 반영한다</text><text x="26.0" y="419.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">AURA 가 쓴 절은 다 쓴 뒤에 반영한다</text><text x="26.0" y="440.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이전 버전은 따로 보관한다</text><rect x="394.0" y="398.0" width="312.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="406.0" y="426.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">기안기 서버 (웹 한글 편집 엔진)</text><text x="406.0" y="448.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">운영 서버 안에서만 접근할 수 있다</text><path d="M434.0,374.0 L434.0,398.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="446.0" y="392.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">중계</text><path d="M394.0,354.0 L324.0,354.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="328.0" y="376.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">파일 기록</text><text x="14.0" y="485.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">문서를 열 때 편집 영역이 없는 문단도 편집 영역으로 감싸, 제목과 표 셀까지 모두 편집 영역이 되게 한다.</text><text x="14.0" y="506.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">한 편집 영역은 편집 잠금을 얻은 사용자만 고치며, 표·그림·용지 변경은 문서 전체를 한 사람씩 고친다.</text><text x="14.0" y="527.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">충돌한 글은 지우지 않고 충돌 사본으로 보관하며, 잠금 대기 같은 시간 값은 모두 설정에서 바꿀 수 있다.</text></svg>
