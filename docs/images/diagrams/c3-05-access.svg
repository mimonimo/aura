<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>검색 단계의 권한 적용</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="660" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">검색 단계의 권한 적용 — 답을 만들기 전에 SQL 조건으로</text><rect x="28" y="62" width="924" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">로그인 계정</text><text x="44" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">역할(교직원 · 학생 · 관리자) · 소속 부서 · 추가 권한 부서 · 등급</text><rect x="380" y="166" width="572" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="396" y="192" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">rag_spaces.resolve — 검색 공간</text><text x="396" y="214" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">student / dept:&lt;부서&gt; / staff / dev</text><rect x="380" y="278" width="572" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="396" y="304" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">access_policy.doc_sql — 검색 SQL 의 WHERE</text><text x="396" y="326" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">열람 등급 · 부서 · 종류 제외</text><path d="M666,126 L666,166" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M666,238 L666,278" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="380" y="394" width="230" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="396" y="420" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">규정 검색</text><text x="396" y="442" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">열람 등급</text><rect x="634" y="394" width="318" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="650" y="420" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">사업 문서 검색</text><text x="650" y="442" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">그래프 범위 · 절 축 조각</text><text x="650" y="461" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 공간 부서 · 증빙 종류 제외 · 다시 거름</text><path d="M666,350 L666,372 L495,372 L495,394" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M666,350 L666,372 L793,372 L793,394" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="380" y="518" width="572" height="64" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="396" y="544" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">모델에 건넨 근거 = 화면 출처</text><text x="396" y="566" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">같은 목록에서 만든다</text><path d="M495,476 L495,518" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M793,476 L793,518" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="288" width="300" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/><text x="44" y="314" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">질문이 범위 밖 부서를 가리킴</text><rect x="28" y="394" width="300" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="420" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">「열람 권한 없음」 안내</text><text x="44" y="442" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">+ 감사 기록</text><text x="44" y="461" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 부서 이름만 싣고 제목 · 건수는 말하지 않음</text><path d="M178,126 L178,288" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M178,340 L178,394" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="28" y="620" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">모르는 역할은 가장 좁은 학생 범위로 본다. 같은 규칙을 화면 판정 함수와 SQL 조건 두 꼴로 내고, 모든 화면과 검색이 이것을 쓴다.</text></svg>
