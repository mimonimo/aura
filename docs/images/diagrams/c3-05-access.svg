<svg xmlns="http://www.w3.org/2000/svg" width="720" height="545" viewBox="0 0 720 545" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>검색 단계의 권한 적용</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="545" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">검색 단계의 권한 적용</text><rect x="328.0" y="50.0" width="378.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="340.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">로그인한 사용자</text><text x="340.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">역할, 소속 부서, 등급</text><rect x="328.0" y="137.0" width="378.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="340.0" y="165.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">볼 수 있는 문서 범위 결정</text><text x="340.0" y="187.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">역할과 부서로 검색할 문서 묶음을 정한다.</text><path d="M517.0,115.0 L517.0,137.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="328.0" y="224.0" width="378.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="340.0" y="252.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">검색 조건에 열람 제한 추가</text><text x="340.0" y="274.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">범위 밖 문서를 빼는 조건을 검색에 넣는다.</text><path d="M517.0,202.0 L517.0,224.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="328.0" y="319.0" width="182.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="340.0" y="347.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">규정 검색</text><text x="340.0" y="369.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 열람 제한 적용</text><rect x="524.0" y="319.0" width="182.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="536.0" y="347.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사업 문서 검색</text><text x="536.0" y="369.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 열람 제한 적용</text><path d="M517.0,289.0 L517.0,304.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M419.0,304.0 L615.0,304.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M419.0,304.0 L419.0,319.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M615.0,304.0 L615.0,319.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="328.0" y="414.0" width="378.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="340.0" y="442.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">모델에 전달한 근거 = 화면 출처</text><text x="340.0" y="464.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">출처는 전달한 근거 목록에서만 만든다.</text><path d="M419.0,384.0 L419.0,399.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M615.0,384.0 L615.0,399.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M419.0,399.0 L615.0,399.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M517.0,399.0 L517.0,414.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="147.5" width="280.0" height="44.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="175.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">다른 부서 문서를 묻는 질문</text><path d="M328.0,169.5 L294.0,169.5" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><rect x="14.0" y="230.0" width="280.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="258.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">열람 권한 없음 안내</text><text x="26.0" y="280.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">권한이 없다는 것만 알린다.</text><text x="26.0" y="301.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">문서 제목과 건수는 밝히지 않는다.</text><text x="26.0" y="322.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문은 감사 기록에 남긴다.</text><path d="M154.0,191.5 L154.0,230.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="505.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">역할을 알 수 없는 계정에는 가장 좁은 범위인 학생 범위를 적용한다. 같은 규칙을 화면 표시와 검색 조건에</text><text x="14.0" y="526.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">함께 사용하므로, 화면에서 볼 수 없는 문서는 검색 결과에도 나오지 않는다.</text></svg>
