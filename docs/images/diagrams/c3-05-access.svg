<svg xmlns="http://www.w3.org/2000/svg" width="720" height="579" viewBox="0 0 720 579" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>검색 단계의 권한 적용</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="579" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">검색 단계의 권한 적용: 답을 만들기 전에 SQL 조건으로</text><rect x="14.0" y="50.0" width="692.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">로그인 계정</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">역할(교직원 · 학생 · 관리자) · 소속 부서 · 추가 권한 부서 · 등급</text><rect x="280.0" y="141.0" width="426.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="292.0" y="169.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">rag_spaces.resolve: 검색 공간</text><text x="292.0" y="191.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">student / dept:&lt;부서&gt; / staff / dev</text><path d="M493.0,115.0 L493.0,141.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="280.0" y="224.0" width="426.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="292.0" y="252.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">access_policy.doc_sql: 검색 SQL 의 WHERE</text><text x="292.0" y="274.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">열람 등급 · 부서 · 종류 제외</text><path d="M493.0,206.0 L493.0,224.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="280.0" y="315.0" width="206.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="292.0" y="343.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">규정 검색</text><text x="292.0" y="365.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">열람 등급</text><rect x="500.0" y="315.0" width="206.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="512.0" y="343.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사업 문서 검색</text><text x="512.0" y="365.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">그래프 범위 · 절 축 청크</text><text x="512.0" y="386.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 공간 부서 · 증빙 종류</text><text x="512.0" y="407.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">제외 · 다시 거름</text><path d="M493.0,289.0 L493.0,302.0 L383.0,302.0 L383.0,315.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M493.0,289.0 L493.0,302.0 L603.0,302.0 L603.0,315.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="280.0" y="448.0" width="426.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="292.0" y="476.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">모델에 건넨 근거 = 화면 출처</text><text x="292.0" y="498.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 목록에서 만든다</text><path d="M383.0,422.0 L383.0,448.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M603.0,422.0 L603.0,448.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="222.5" width="236.0" height="68.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="250.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문이 범위 밖 부서를</text><text x="26.0" y="274.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">가리킴</text><path d="M132.0,115.0 L132.0,222.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="315.0" width="236.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="343.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">「열람 권한 없음」 안내</text><text x="26.0" y="365.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">+ 감사 기록</text><text x="26.0" y="386.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 부서 이름만 싣고 제목 ·</text><text x="26.0" y="407.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">건수는 말하지 않음</text><path d="M132.0,290.5 L132.0,315.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="539.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">모르는 역할은 가장 좁은 학생 범위로 본다. 같은 규칙을 화면 판정 함수와 SQL 조건 두 꼴로 내고, 모든</text><text x="14.0" y="560.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">화면과 검색이 이것을 쓴다.</text></svg>
