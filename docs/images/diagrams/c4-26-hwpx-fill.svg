<svg xmlns="http://www.w3.org/2000/svg" width="980" height="780" viewBox="0 0 980 780" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>원본 서식 보존 채우기</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="780" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">원본 서식 보존 채우기 — 작업본의 절 본문을 원본 hwpx 에 옮긴다</text><rect x="28" y="62" width="440" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">원본 hwpx (ZIP)</text><text x="44" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">구역 XML 을 다시 직렬화하지 않음</text><rect x="512" y="62" width="440" height="78" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="528" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">작업본 절 본문</text><text x="528" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">독스 또는 기안기 · 글 · 표 · 그림(안내 상자 제외)</text><rect x="28" y="178" width="924" height="70" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="204" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">절 제목 문단 찾기</text><text x="44" y="226" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">번호 · 제목 글자로 맞춤(또는 그 뒤 【작성방법】 상자)</text><path d="M248,140 L248,178" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M732,140 L732,178" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><line x1="48" y1="248" x2="48" y2="472" stroke="#94a3b8" stroke-width="1.3"/><path d="M48,304 L70,304" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="280" width="882" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="70" y="280" width="210" height="48" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="84" y="309.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">서식에 이미 있는 문단 · 표</text><text x="296" y="308.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">다시 넣지 않고 그 자리를 지나 이어 씀</text><path d="M48,360 L70,360" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="336" width="882" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="70" y="336" width="210" height="48" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="84" y="365.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">서식 표를 채웠을 때</text><text x="296" y="364.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">작업본 열 너비로 값 칸 x 위치를 재어 원래 칸에 써 넣음</text><path d="M48,416 L70,416" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="392" width="882" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="70" y="392" width="210" height="48" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="84" y="421.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">새 표</text><text x="296" y="420.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">id 는 문서 최댓값 다음부터, 테두리는 그 구역 본문 표의 가장 흔한 실선을 이어받음</text><path d="M48,472 L70,472" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="448" width="882" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="70" y="448" width="210" height="48" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="84" y="477.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">끼워 넣기</text><text x="296" y="476.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">글자열 위치에 문단 · 표 · 그림 XML (손대지 않은 문단은 한 글자도 안 바뀜)</text><rect x="28" y="534" width="924" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="560" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">다시 쓰기</text><text x="44" y="582" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">바뀐 구역만 줄 배치 캐시 지움 · ZIP 항목 순서와 압축 방식 유지 · 바뀐 항목만 다시 씀</text><path d="M490,496 L490,534" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="640" width="620" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="666" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">자가 점검</text><text x="44" y="688" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">ZIP 규약 · XML 형식 · 참조 id · 항목 수 · 표 격자</text><rect x="712" y="640" width="240" height="70" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="728" y="666" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">저장</text><text x="728" y="688" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">문제 목록이 비었을 때만</text><path d="M490,604 L490,640" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M648,675 L712,675" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="680.0" y="667" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">통과</text><text x="28" y="750" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">이 층은 내용을 만들지 않는다. 원본이 옛 .hwp 면 채우지 않고 hwpx 로 저장한 서식의 반입을 안내한다.</text></svg>
