<svg xmlns="http://www.w3.org/2000/svg" width="720" height="616" viewBox="0 0 720 616" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>원본 서식 보존 채우기</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="616" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">원본 서식 보존 채우기: 작업본의 절 본문을 원본 hwpx 에 옮긴다</text><rect x="14.0" y="50.0" width="334.0" height="86.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">원본 hwpx (ZIP)</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">구역 XML 을 다시 직렬화하지 않음</text><rect x="372.0" y="50.0" width="334.0" height="86.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="384.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">작업본 절 본문</text><text x="384.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">독스 또는 기안기 · 글 · 표 · 그림(안내 상자</text><text x="384.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">제외)</text><path d="M181.0,136.0 L181.0,160.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M539.0,136.0 L539.0,160.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="160.0" width="692.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="160.0" width="196.0" height="32.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="181.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">절 제목 문단 찾기</text><text x="222.0" y="181.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">번호 · 제목 글자로 맞춤(또는 그 뒤 【작성방법】 상자)</text><rect x="54.0" y="200.0" width="652.0" height="54.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="54.0" y="200.0" width="174.0" height="54.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="66.0" y="221.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">서식에 이미 있는</text><text x="66.0" y="243.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">문단 · 표</text><text x="240.0" y="232.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">다시 넣지 않고 그 자리를 지나 이어 씀</text><path d="M32.0,227.0 L54.0,227.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="54.0" y="260.0" width="652.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="54.0" y="260.0" width="174.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="66.0" y="281.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">서식 표를 채웠을 때</text><text x="240.0" y="281.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">작업본 열 너비로 값 셀 x 위치를 재어 원래 셀에 써 넣음</text><path d="M32.0,276.0 L54.0,276.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="54.0" y="298.0" width="652.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="54.0" y="298.0" width="174.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="66.0" y="329.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">새 표</text><text x="240.0" y="319.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">id 는 문서 최댓값 다음부터, 테두리는 그 구역 본문 표의 가장 흔한</text><text x="240.0" y="340.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">실선을 이어받음</text><path d="M32.0,324.0 L54.0,324.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="54.0" y="356.0" width="652.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="54.0" y="356.0" width="174.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="66.0" y="387.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">끼워 넣기</text><text x="240.0" y="377.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">글자열 위치에 문단 · 표 · 그림 XML (손대지 않은 문단은 한 글자도</text><text x="240.0" y="398.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">안 바뀜)</text><path d="M32.0,382.0 L54.0,382.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M32.0,192.0 L32.0,382.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M360.0,408.0 L360.0,432.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="432.0" width="692.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="432.0" width="196.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="463.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">다시 쓰기</text><text x="222.0" y="453.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">바뀐 구역만 줄 배치 캐시 지움 · ZIP 항목 순서와 압축 방식 유지 · 바뀐</text><text x="222.0" y="474.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">항목만 다시 씀</text><path d="M360.0,484.0 L360.0,508.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="508.0" width="450.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="536.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">자가 점검</text><text x="26.0" y="558.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">ZIP 규약 · XML 형식 · 참조 id · 항목 수 · 표 격자</text><rect x="514.0" y="508.0" width="192.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="526.0" y="536.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">저장</text><text x="526.0" y="558.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">문제 목록이 비었을 때만</text><path d="M464.0,540.5 L514.0,540.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="489.0" y="532.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">통과</text><text x="14.0" y="597.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">이 층은 내용을 만들지 않는다. 원본이 옛 .hwp 면 채우지 않고 hwpx 로 저장한 서식의 수집을 안내한다.</text></svg>
