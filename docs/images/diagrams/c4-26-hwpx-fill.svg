<svg xmlns="http://www.w3.org/2000/svg" width="720" height="616" viewBox="0 0 720 616" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>원본 서식 보존 채우기</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="616" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">원본 서식 보존 채우기</text><rect x="14.0" y="50.0" width="334.0" height="86.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">원본 한글 파일(hwpx)</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">원본의 내용과 서식을 그대로 두고 그 위에</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">채운다</text><rect x="372.0" y="50.0" width="334.0" height="86.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="384.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">작업 문서의 절 본문</text><text x="384.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">독스나 기안기에서 쓴 글과 표, 그림(안내</text><text x="384.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">상자는 제외)</text><path d="M181.0,136.0 L181.0,160.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M539.0,136.0 L539.0,160.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="160.0" width="692.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="160.0" width="196.0" height="52.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="191.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">절 위치 찾기</text><text x="222.0" y="181.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">원본에서 절 번호와 제목이 같은 문단(또는 그 뒤의 작성 방법 상자)을</text><text x="222.0" y="202.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">찾는다</text><rect x="54.0" y="220.0" width="652.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="54.0" y="220.0" width="174.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="66.0" y="241.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">이미 있는 문단과 표</text><text x="240.0" y="241.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">다시 넣지 않고 그 다음 위치부터 이어서 쓴다</text><path d="M32.0,236.0 L54.0,236.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="54.0" y="258.0" width="652.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="54.0" y="258.0" width="174.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="66.0" y="279.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">양식의 표</text><text x="240.0" y="279.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">작업 문서 표의 열 위치를 원본 표의 셀에 맞추어 값을 채운다</text><path d="M32.0,274.0 L54.0,274.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="54.0" y="296.0" width="652.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="54.0" y="296.0" width="174.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="66.0" y="317.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">새로 넣는 표</text><text x="240.0" y="317.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">원본 본문 표에서 가장 많이 쓰인 테두리를 그대로 따른다</text><path d="M32.0,312.0 L54.0,312.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="54.0" y="334.0" width="652.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="54.0" y="334.0" width="174.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="66.0" y="365.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">새 내용 넣기</text><text x="240.0" y="355.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">찾은 위치에 문단과 표, 그림을 넣고, 손대지 않은 문단은 원본 그대로</text><text x="240.0" y="376.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">둔다</text><path d="M32.0,360.0 L54.0,360.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M32.0,212.0 L32.0,360.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M360.0,386.0 L360.0,410.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="410.0" width="692.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="410.0" width="196.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="431.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">파일 다시 쓰기</text><text x="222.0" y="431.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">파일 안의 항목 순서와 압축 방식을 유지한 채 바뀐 항목만 다시 쓴다</text><path d="M360.0,442.0 L360.0,466.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="466.0" width="450.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="494.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">자가 점검</text><text x="26.0" y="516.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">파일 구조와 문서 형식, 항목 수, 표의 셀 배치가 올바른지</text><text x="26.0" y="537.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">검사한다</text><rect x="514.0" y="466.0" width="192.0" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="526.0" y="494.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">저장</text><text x="526.0" y="516.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">점검을 통과한 파일만</text><text x="526.0" y="537.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">저장한다</text><path d="M464.0,509.0 L514.0,509.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="489.0" y="501.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">통과</text><text x="14.0" y="576.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">이 단계는 내용을 생성하지 않는다. 원본이 이전 형식인 .hwp 이면 채우지 않고, hwpx 로 저장한 서식을</text><text x="14.0" y="597.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">수집하도록 안내한다.</text></svg>
