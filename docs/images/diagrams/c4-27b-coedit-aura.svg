<svg xmlns="http://www.w3.org/2000/svg" width="720" height="629" viewBox="0 0 720 629" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>② AURA(27B)가 양식을 만들고 절을 쓸 때</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="629" fill="#ffffff"/><defs><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fb3"/></marker><marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fb3"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="arF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">② AURA(27B)가 양식을 만들고 절을 쓸 때</text><text x="14.0" y="59.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">사람과 같은 편집 영역 길로 흘려 써서 열린 화면에 바로 보인다</text><rect x="114.0" y="70.0" width="141.0" height="86.0" rx="8" fill="#e8f0fe" stroke="#2f5fb3" stroke-width="1.5"/><text x="184.5" y="98.2" font-size="18" font-weight="700" fill="#2f5fb3" text-anchor="middle">김가람</text><text x="184.5" y="120.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">AURA 에게</text><text x="184.5" y="141.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">요청한 사람</text><rect x="263.0" y="70.0" width="141.0" height="86.0" rx="8" fill="#f1ecfb" stroke="#6b4fb3" stroke-width="1.5"/><text x="333.5" y="108.7" font-size="18" font-weight="700" fill="#6b4fb3" text-anchor="middle">AURA 서버</text><text x="333.5" y="130.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">27B 문서 작업</text><rect x="412.0" y="70.0" width="141.0" height="86.0" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="482.5" y="98.2" font-size="18" font-weight="700" fill="#2e7d4f" text-anchor="middle">열려 있는 화면</text><text x="482.5" y="120.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">같은 문서를 연</text><text x="482.5" y="141.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사람들</text><rect x="561.0" y="70.0" width="141.0" height="86.0" rx="8" fill="#f1f3f5" stroke="#5f6b7a" stroke-width="1.5"/><text x="631.5" y="108.7" font-size="18" font-weight="700" fill="#5f6b7a" text-anchor="middle">한글 파일</text><text x="631.5" y="130.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">hwpx</text><rect x="14.0" y="159.0" width="692.0" height="147.0" rx="8" fill="#f1f4f9" stroke="#dfe5ee" stroke-width="1.5"/><text x="20.0" y="178.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">양식 만들기</text><rect x="14.0" y="304.0" width="692.0" height="190.0" rx="8" fill="#fafbfd" stroke="#dfe5ee" stroke-width="1.5"/><text x="20.0" y="323.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">절 쓰기</text><rect x="14.0" y="492.0" width="692.0" height="74.0" rx="8" fill="#f1f4f9" stroke="#dfe5ee" stroke-width="1.5"/><text x="20.0" y="511.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">마무리</text><line x1="184.5" y1="156" x2="184.5" y2="567" stroke="#2f5fb3" stroke-opacity=".3" stroke-width="2"/><line x1="333.5" y1="156" x2="333.5" y2="567" stroke="#6b4fb3" stroke-opacity=".3" stroke-width="2"/><line x1="482.5" y1="156" x2="482.5" y2="567" stroke="#2e7d4f" stroke-opacity=".3" stroke-width="2"/><line x1="631.5" y1="156" x2="631.5" y2="567" stroke="#5f6b7a" stroke-opacity=".3" stroke-width="2"/><text x="291.6" y="178.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">① 「AURA 양식 만들기」, 가상 사업 설정과 함께<tspan font-weight="700" fill="#8a5a00"> · 0초</tspan></text><line x1="190.5" y1="190.0" x2="324.5" y2="190.0" stroke="#2f5fb3" stroke-width="2.4" marker-end="url(#arA)"/><rect x="114.0" y="200.0" width="472.3" height="31.0" rx="8" fill="#ffffff" stroke="#6b4fb3" stroke-width="2.2"/><text x="126.0" y="221.0" font-size="16" fill="#1f2937" text-anchor="start">② 27B 가 짧은 사업계획서 양식을 설계(절 차례·작성방법)<tspan font-weight="700" fill="#8a5a00"> · 몇십 초</tspan></text><text x="482.5" y="251.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">③ 빈 문서를 그 양식으로 바꿔 저장<tspan font-weight="700" fill="#8a5a00"> · 바로</tspan></text><line x1="339.5" y1="263.0" x2="622.5" y2="263.0" stroke="#6b4fb3" stroke-width="2.4" marker-end="url(#arS)"/><text x="408.0" y="287.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">④ 새 버전을 알림 → 모든 화면이 양식을 함께 받음 · 요약 편집 영역 채움<tspan font-weight="700" fill="#8a5a00"> · 바로</tspan></text><line x1="339.5" y1="299.0" x2="473.5" y2="299.0" stroke="#6b4fb3" stroke-width="2.4" marker-end="url(#arS)"/><text x="301.2" y="323.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">⑤ 「AURA 이어 쓰기」, 1절부터 차례로 세 개<tspan font-weight="700" fill="#8a5a00"> · 다음 요청</tspan></text><line x1="190.5" y1="335.0" x2="324.5" y2="335.0" stroke="#2f5fb3" stroke-width="2.4" marker-end="url(#arA)"/><rect x="114.0" y="345.0" width="564.8" height="52.0" rx="8" fill="#ffffff" stroke="#6b4fb3" stroke-width="2.2"/><text x="126.0" y="366.0" font-size="16" fill="#1f2937" text-anchor="start">⑥ 27B 가 절 초안(설정 밖 숫자·좁은 셀·안내 상자는 검증 단계가 막음), 다음 절은</text><text x="126.0" y="387.0" font-size="16" fill="#1f2937" text-anchor="start">미리<tspan font-weight="700" fill="#8a5a00"> · 절마다 몇십 초</tspan></text><text x="408.0" y="417.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">⑦ 편집 영역 길로 조금씩 보냄(초당 약 32자) · 머리줄에 「2. … 쓰는 중 (2/3)」 ·</text><text x="408.0" y="438.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">0.12초마다</text><line x1="339.5" y1="450.0" x2="473.5" y2="450.0" stroke="#6b4fb3" stroke-width="2.4" marker-end="url(#arS)"/><rect x="211.3" y="460.0" width="490.7" height="31.0" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="2.2"/><text x="223.3" y="481.0" font-size="16" fill="#1f2937" text-anchor="start">⑧ 열린 화면에 써 내려감 · 가만히 있던 화면은 그 자리로 따라감<tspan font-weight="700" fill="#8a5a00"> · 바로</tspan></text><text x="482.5" y="511.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">⑨ 다 쓰면 그 편집 영역만 파일에 넣고 편집 영역을 놓음<tspan font-weight="700" fill="#8a5a00"> · 몇 초 뒤</tspan></text><line x1="339.5" y1="523.0" x2="622.5" y2="523.0" stroke="#6b4fb3" stroke-width="2.4" marker-end="url(#arS)"/><text x="259.0" y="547.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">⑩ 「n개 절을 썼습니다」(실제로 쓴 수)<tspan font-weight="700" fill="#8a5a00"> · 끝</tspan></text><line x1="327.5" y1="559.0" x2="193.5" y2="559.0" stroke="#6b4fb3" stroke-width="2.4" marker-end="url(#arS)"/><text x="14.0" y="589.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">문서를 다시 여는 것은 양식을 넣을 때 한 번뿐이다. AURA 가 쓴 글도 편집 영역 안에 들어가 사람이 바로</text><text x="14.0" y="610.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">고칠 수 있다.</text></svg>
