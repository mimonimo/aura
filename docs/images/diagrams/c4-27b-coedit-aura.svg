<svg width="1060" height="526" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 526" role="img" aria-label="② AURA(27B)가 절을 쓸 때 — 사람과 같은 칸 길로 흘려 써 열린 화면에 바로 보인다" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker></defs>
<rect width="1060" height="526" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#1b2a41">② AURA(27B)가 절을 쓸 때 — 사람과 같은 칸 길로 흘려 써 열린 화면에 바로 보인다</text>
<rect x="165" y="40" width="190" height="40" rx="8" fill="#f8fafc" stroke="#c9d3e0"/>
<text x="260" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">김가람</text>
<text x="260" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">AURA 에게 요청한 사람</text>
<line x1="260" y1="80" x2="260" y2="476" stroke="#d8dee8" stroke-dasharray="4 4"/>
<rect x="405" y="40" width="190" height="40" rx="8" fill="#eef3fb" stroke="#c9d3e0"/>
<text x="500" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">AURA 서버</text>
<text x="500" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">27B 문서 작업</text>
<line x1="500" y1="80" x2="500" y2="476" stroke="#d8dee8" stroke-dasharray="4 4"/>
<rect x="645" y="40" width="190" height="40" rx="8" fill="#f8fafc" stroke="#c9d3e0"/>
<text x="740" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">열려 있는 화면</text>
<text x="740" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">같은 문서를 연 사람들</text>
<line x1="740" y1="80" x2="740" y2="476" stroke="#d8dee8" stroke-dasharray="4 4"/>
<rect x="855" y="40" width="190" height="40" rx="8" fill="#f8fafc" stroke="#c9d3e0"/>
<text x="950" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">한글 파일</text>
<text x="950" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">hwpx</text>
<line x1="950" y1="80" x2="950" y2="476" stroke="#d8dee8" stroke-dasharray="4 4"/>
<text x="20" y="114" font-size="11" fill="#8a5a00" font-weight="600">0초</text>
<line x1="266" y1="110" x2="494" y2="110" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="380" y="103" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">「1~3 절을 읽고 4 절에 정리해 줘」</text>
<text x="20" y="166" font-size="11" fill="#8a5a00" font-weight="600">1~3분</text>
<rect x="309" y="148" width="382" height="26" rx="6" fill="#fff8ec" stroke="#e8c98a"/>
<text x="500.0" y="166" font-size="11.5" fill="#3b4757" text-anchor="middle">27B: 읽기 → 근거 찾기 → 초안 쓰기 → 스스로 점검</text>
<text x="20" y="218" font-size="11" fill="#8a5a00" font-weight="600">몇 초</text>
<rect x="248" y="200" width="505" height="26" rx="6" fill="#fff8ec" stroke="#e8c98a"/>
<text x="500.0" y="218" font-size="11.5" fill="#3b4757" text-anchor="middle">검사: 근거에 없는 숫자는 거절, 사람이 쓰는 칸은 건너뜀, 그 절 칸을 맡음</text>
<text x="20" y="270" font-size="11" fill="#8a5a00" font-weight="600">0.12초마다</text>
<line x1="506" y1="266" x2="734" y2="266" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="620" y="259" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">칸 길로 조금씩 보냄(초당 약 32자)</text>
<text x="20" y="322" font-size="11" fill="#8a5a00" font-weight="600">바로</text>
<rect x="526" y="304" width="427" height="26" rx="6" fill="#fff8ec" stroke="#e8c98a"/>
<text x="740.0" y="322" font-size="11.5" fill="#3b4757" text-anchor="middle">열린 화면에 바로 써 내려감 · 손 놓은 화면은 그 칸으로 따라감</text>
<text x="20" y="374" font-size="11" fill="#8a5a00" font-weight="600">몇 초 뒤</text>
<line x1="506" y1="370" x2="944" y2="370" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="725" y="363" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">다 쓰면 그 칸만 파일에 써 넣고 칸을 놓음(표가 든 절은 파일째)</text>
<text x="20" y="426" font-size="11" fill="#8a5a00" font-weight="600">끝</text>
<line x1="494" y1="422" x2="266" y2="422" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="380" y="415" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">「4. AURA 정리」 를 썼습니다</text>
<text x="20" y="504" font-size="11.5" fill="#5b6b82">다시 불러오기가 없다. AURA 가 쓴 글도 칸 안에 들어가 사람이 바로 고칠 수 있다.</text>
</svg>
