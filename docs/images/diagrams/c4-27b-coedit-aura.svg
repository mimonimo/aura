<svg width="1060" height="526" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 526" role="img" aria-label="② AURA(27B)가 절을 쓸 때 — 서버가 한글 파일에 바로 쓰고 열린 화면이 새 판을 연다" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker></defs>
<rect width="1060" height="526" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#1b2a41">② AURA(27B)가 절을 쓸 때 — 서버가 한글 파일에 바로 쓰고 열린 화면이 새 판을 연다</text>
<rect x="165" y="40" width="190" height="40" rx="8" fill="#f8fafc" stroke="#c9d3e0"/>
<text x="260" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">김가람 채팅</text>
<text x="260" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">AURA 에게 맡긴 사람</text>
<line x1="260" y1="80" x2="260" y2="476" stroke="#d8dee8" stroke-dasharray="4 4"/>
<rect x="405" y="40" width="190" height="40" rx="8" fill="#eef3fb" stroke="#c9d3e0"/>
<text x="500" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">AURA 서버</text>
<text x="500" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">27B 문서 작업 에이전트</text>
<line x1="500" y1="80" x2="500" y2="476" stroke="#d8dee8" stroke-dasharray="4 4"/>
<rect x="855" y="40" width="190" height="40" rx="8" fill="#f8fafc" stroke="#c9d3e0"/>
<text x="950" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">한글 파일</text>
<text x="950" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">hwpx</text>
<line x1="950" y1="80" x2="950" y2="476" stroke="#d8dee8" stroke-dasharray="4 4"/>
<rect x="645" y="40" width="190" height="40" rx="8" fill="#f8fafc" stroke="#c9d3e0"/>
<text x="740" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">열린 기안기 화면</text>
<text x="740" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">김가람·이나래…</text>
<line x1="740" y1="80" x2="740" y2="476" stroke="#d8dee8" stroke-dasharray="4 4"/>
<text x="20" y="114" font-size="11" fill="#8a5a00" font-weight="600">0초</text>
<line x1="266" y1="110" x2="494" y2="110" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="380" y="103" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">「빈 절 하나 써 줘」</text>
<text x="20" y="166" font-size="11" fill="#8a5a00" font-weight="600">1~3분</text>
<rect x="304" y="148" width="393" height="26" rx="6" fill="#fff8ec" stroke="#e8c98a"/>
<text x="500.0" y="166" font-size="11.5" fill="#3b4757" text-anchor="middle">27B 가 절 고르기 → 근거 찾기 → 개요·본문·자기 점검</text>
<text x="20" y="218" font-size="11" fill="#8a5a00" font-weight="600">수 초</text>
<rect x="326" y="200" width="348" height="26" rx="6" fill="#fff8ec" stroke="#e8c98a"/>
<text x="500.0" y="218" font-size="11.5" fill="#3b4757" text-anchor="middle">관문 — 근거 밖 숫자 거절, 사람이 쥔 칸은 건너뜀</text>
<text x="20" y="270" font-size="11" fill="#8a5a00" font-weight="600">1초 안</text>
<line x1="506" y1="266" x2="944" y2="266" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="725" y="259" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">그 절 자리 뒤에 문단·표를 바로 넣고 저장(앞 판은 .판 폴더)</text>
<text x="20" y="322" font-size="11" fill="#8a5a00" font-weight="600">곧바로</text>
<line x1="506" y1="318" x2="734" y2="318" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="620" y="311" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">알림 — 「AURA 가 문서를 새로 저장함」, 머리줄 AURA 표시</text>
<text x="20" y="374" font-size="11" fill="#8a5a00" font-weight="600">0.4~0.5초</text>
<rect x="549" y="356" width="382" height="26" rx="6" fill="#fff8ec" stroke="#e8c98a"/>
<text x="740.0" y="374" font-size="11.5" fill="#3b4757" text-anchor="middle">입력이 멈추면 새 판 다시 열기(큰 문서는 5~10초 더)</text>
<text x="20" y="426" font-size="11" fill="#8a5a00" font-weight="600">끝</text>
<line x1="494" y1="422" x2="266" y2="422" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="380" y="415" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">「1. 개요」 를 썼습니다 — 남은 빈 절 이어 쓸까요?</text>
<text x="20" y="504" font-size="11.5" fill="#5b6b82">연결이 끊겨도 보낼 글은 브라우저에 남아 다시 이어지면 보낸다. 45초 동안 알림이 없으면 화면이 스스로 다시 연결한다.</text>
</svg>
