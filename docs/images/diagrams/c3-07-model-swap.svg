<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>용도별 연결과 모델 교체 구조</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="560" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">용도별 연결과 모델 교체 구조 — 모델 이름이 아니라 용도로 부른다</text><rect x="28" y="62" width="330" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">호출하는 쪽</text><text x="44" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">답변기 · 에이전트 · 판정 · 도우미</text><text x="44" y="129" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 용도 이름만 넘김</text><text x="44" y="148" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· answer / review / vision / helper</text><rect x="28" y="206" width="330" height="128" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="232" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">연결 설정</text><text x="44" y="254" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">llm_connections</text><text x="44" y="273" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">서버 · 모델 · 생각 끄기 인자</text><text x="44" y="292" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">구조화 출력 방식 · 동시 상한</text><text x="44" y="311" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 「도구 · 모델 연결」(/dev/tools)</text><path d="M193,166 L193,206" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="418" y="62" width="534" height="56" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="418" y="62" width="104" height="56" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="432" y="95.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">문맥 한도</text><text x="538" y="94.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">서버가 알려 주는 max_model_len 먼저, 없으면 설정값</text><rect x="418" y="132" width="534" height="56" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="418" y="132" width="104" height="56" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="432" y="165.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">구조화 출력</text><text x="538" y="164.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">JSON 스키마 강제, 서버가 거절하면 JSON 지시 + 파싱으로 물러남</text><rect x="418" y="202" width="534" height="56" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="418" y="202" width="104" height="56" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="432" y="235.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">장애</text><text x="538" y="234.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">같은 모델을 내는 다른 교내 연결로 넘김(외부로는 넘기지 않음)</text><rect x="418" y="272" width="534" height="56" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="418" y="272" width="104" height="56" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="432" y="305.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">기록</text><text x="538" y="304.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">결과마다 서버가 알려 준 실제 모델 정보(주소 · 가중치 경로는 빼고)</text><path d="M358,270 L388,270" fill="none" stroke="#94a3b8" stroke-width="1.3"/><path d="M388,90 L388,300" fill="none" stroke="#94a3b8" stroke-width="1.3"/><path d="M388,90 L418,90" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M388,160 L418,160" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M388,230 L418,230" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M388,300 L418,300" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="380" width="590" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="406" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">교체 점검 (scripts/195)</text><text x="44" y="428" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">후보 모델을 운영 설정을 바꾸지 않고 같은 데이터로 나란히 측정</text><text x="44" y="447" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 검색 · 답 · 종류 판정</text><rect x="662" y="380" width="290" height="84" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="678" y="406" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">채택 결정</text><text x="678" y="428" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">비교표로 정한 뒤 용도별</text><text x="678" y="447" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">서버만 바꿔 저장</text><path d="M193,334 L193,380" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M618,422 L662,422" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="28" y="500" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">모델 이름 · 문맥 길이 · 생각 끄기 인자를 코드에 박지 않는다. 용도별 서버를 바꾸고 저장하면 코드 수정 없이 모델이 바뀐다.</text><text x="28" y="520" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">문맥은 비율로 나눈다(작업 메모 6 %, 최근 대화 30 %). 문맥이 긴 모델로 바꾸면 저절로 맞는다.</text></svg>
