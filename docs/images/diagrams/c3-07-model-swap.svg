<svg xmlns="http://www.w3.org/2000/svg" width="720" height="595" viewBox="0 0 720 595" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>용도별 연결과 모델 교체 구조</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="595" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">용도별 연결과 모델 교체 구조</text><rect x="14.0" y="50.0" width="268.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">기능</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">답변 작성, 수집 검토, 이미지 판독,</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">업무 도우미</text><text x="26.0" y="142.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 용도 이름으로 모델을 요청한다.</text><rect x="14.0" y="181.0" width="268.0" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="209.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">연결 설정</text><text x="26.0" y="231.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">용도마다 서버와 모델을 지정한다.</text><text x="26.0" y="252.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 운영 관리 화면에서 변경한다.</text><path d="M148.0,157.0 L148.0,181.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="291.0" width="268.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="319.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">실제 모델 호출</text><text x="26.0" y="341.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">지정한 교내 서버의 모델이 응답한다.</text><path d="M148.0,267.0 L148.0,291.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="318.0" y="65.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">연결 설정이 함께 처리하는 일</text><rect x="318.0" y="76.0" width="388.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="318.0" y="76.0" width="128.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="330.0" y="107.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">컨텍스트 길이</text><text x="458.0" y="97.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서버가 알려 주는 길이를 읽어 와</text><text x="458.0" y="118.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사용한다.</text><rect x="318.0" y="136.0" width="388.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="318.0" y="136.0" width="128.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="330.0" y="167.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">구조화 출력</text><text x="458.0" y="157.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">지원하지 않는 서버에는 지시문</text><text x="458.0" y="178.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">방식으로 대체한다.</text><rect x="318.0" y="196.0" width="388.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="318.0" y="196.0" width="128.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="330.0" y="227.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">장애 대응</text><text x="458.0" y="217.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 모델을 올린 다른 교내 서버로</text><text x="458.0" y="238.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">전환한다.</text><rect x="318.0" y="256.0" width="388.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="318.0" y="256.0" width="128.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="330.0" y="287.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">기록</text><text x="458.0" y="277.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">결과마다 실제로 사용한 모델을</text><text x="458.0" y="298.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">기록한다.</text><path d="M282.0,224.0 L300.0,224.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M300.0,102.0 L300.0,282.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M300.0,102.0 L318.0,102.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M300.0,162.0 L318.0,162.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M300.0,222.0 L318.0,222.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M300.0,282.0 L318.0,282.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="378.0" width="692.0" height="130.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="400.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">교체 절차</text><rect x="26.0" y="410.0" width="205.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="438.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">① 나란히 측정</text><text x="38.0" y="460.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">후보 모델을 같은 평가</text><text x="38.0" y="481.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">데이터셋으로 측정</text><rect x="257.3" y="410.0" width="205.3" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="269.3" y="438.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">② 채택 결정</text><text x="269.3" y="460.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">비교 결과로 교체 여부 결정</text><path d="M231.3,453.0 L257.3,453.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="488.7" y="410.0" width="205.3" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="500.7" y="438.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">③ 설정 저장</text><text x="500.7" y="460.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">연결 설정만 바꿔 저장</text><path d="M462.7,453.0 L488.7,453.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="534.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">모델 이름과 컨텍스트 길이를 코드에 고정하지 않으므로, 연결 설정만 바꾸어 저장하면 코드를 고치지 않고</text><text x="14.0" y="555.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">모델을 교체할 수 있다. 컨텍스트는 길이에 비례해 나누어 쓰므로 더 긴 모델로 바꾸면 배분도 함께</text><text x="14.0" y="576.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">늘어난다.</text></svg>
