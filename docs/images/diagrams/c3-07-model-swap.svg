<svg xmlns="http://www.w3.org/2000/svg" width="720" height="552" viewBox="0 0 720 552" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>용도별 연결과 모델 교체 구조</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="552" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">용도별 연결과 모델 교체 구조: 모델 이름이 아니라 용도로 부른다</text><rect x="14.0" y="50.0" width="268.0" height="128.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">호출하는 쪽</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">답변기 · 에이전트 · 판정 · 도우미</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 용도 이름만 넘김</text><text x="26.0" y="142.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· answer / review / vision /</text><text x="26.0" y="163.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">helper</text><rect x="14.0" y="204.0" width="268.0" height="128.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="232.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">연결 설정</text><text x="26.0" y="254.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">llm_connections</text><text x="26.0" y="275.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서버 · 모델 · 추론 모드 끄기 인자</text><text x="26.0" y="296.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">구조화 출력 방식 · 동시 상한</text><text x="26.0" y="317.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 「도구 · 모델 연결」(/dev/tools)</text><path d="M148.0,178.0 L148.0,204.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="318.0" y="50.0" width="388.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="318.0" y="50.0" width="104.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="330.0" y="81.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">문맥 한도</text><text x="434.0" y="71.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서버가 알려 주는 max_model_len</text><text x="434.0" y="92.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">먼저, 없으면 설정값</text><rect x="318.0" y="112.0" width="388.0" height="54.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="318.0" y="112.0" width="104.0" height="54.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="330.0" y="133.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">구조화</text><text x="330.0" y="155.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">출력</text><text x="434.0" y="134.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">JSON 스키마 강제, 서버가 거절하면</text><text x="434.0" y="155.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">JSON 지시 + 파싱으로 물러남</text><rect x="318.0" y="176.0" width="388.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="318.0" y="176.0" width="104.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="330.0" y="207.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">장애</text><text x="434.0" y="197.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 모델을 내는 다른 교내 연결로</text><text x="434.0" y="218.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">넘김(외부로는 넘기지 않음)</text><rect x="318.0" y="238.0" width="388.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="318.0" y="238.0" width="104.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="330.0" y="269.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">기록</text><text x="434.0" y="259.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">결과마다 서버가 알려 준 실제 모델</text><text x="434.0" y="280.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">정보(주소 · 가중치 경로는 빼고)</text><path d="M282.0,268.0 L300.0,268.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M300.0,76.0 L300.0,268.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M300.0,76.0 L318.0,76.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M300.0,139.0 L318.0,139.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M300.0,202.0 L318.0,202.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M300.0,264.0 L318.0,264.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="358.0" width="440.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="386.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">교체 점검 (scripts/195)</text><text x="26.0" y="408.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">후보 모델을 운영 설정을 바꾸지 않고 같은 데이터로 나란히</text><text x="26.0" y="429.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">측정</text><text x="26.0" y="450.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 검색 · 답 · 종류 판정</text><rect x="484.0" y="358.0" width="222.0" height="107.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="496.0" y="386.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">채택 결정</text><text x="496.0" y="408.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">비교표로 정한 뒤 용도별</text><text x="496.0" y="429.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서버만 바꿔 저장</text><path d="M148.0,332.0 L148.0,358.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M454.0,411.5 L484.0,411.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="491.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">모델 이름 · 문맥 길이 · 추론 모드 끄기 인자를 코드에 박지 않는다. 용도별 서버를 바꾸고 저장하면 코드</text><text x="14.0" y="512.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">수정 없이 모델이 바뀐다. 문맥은 비율로 나눈다(작업 메모 6 %, 최근 대화 30 %). 문맥이 긴 모델로</text><text x="14.0" y="533.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">바꾸면 저절로 맞는다.</text></svg>
