<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>RAG 개념도</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1040" height="400" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">검색 증강 생성(RAG) — 찾고, 묶고, 쓴다</text><rect x="28" y="76" width="172" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">질문</text><text x="44" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">교직원의 질문</text><text x="44" y="143" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 질문한 사람의 권한</text><path d="M200,132 L231,132" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="231" y="76" width="172" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="247" y="98" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">①</text><text x="247" y="120" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">검색</text><text x="247" y="142" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">질문과 가까운</text><text x="247" y="161" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">문서 조각을 찾음</text><path d="M403,132 L434,132" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="434" y="76" width="172" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="450" y="98" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">②</text><text x="450" y="120" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">근거 묶기</text><text x="450" y="142" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">조각과 출처를</text><text x="450" y="161" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">모델 입력에 넣음</text><path d="M606,132 L637,132" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="637" y="76" width="172" height="112" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="653" y="98" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">③</text><text x="653" y="120" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">생성 모델</text><text x="653" y="142" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">근거 안에서</text><text x="653" y="161" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">답을 씀</text><path d="M809,132 L840,132" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="840" y="76" width="172" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="856" y="102" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">근거 붙은 답</text><text x="856" y="124" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">답 + 출처</text><text x="856" y="143" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">(문서·쪽·절)</text><rect x="160" y="236" width="220" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="176" y="262" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">규정 색인</text><text x="176" y="284" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">교내 규정·지침, 조문 단위</text><rect x="400" y="236" width="220" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="416" y="262" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">사업 문서 색인</text><text x="416" y="284" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">사업 문서 조각</text><path d="M270,236 L270,214 L317,214 L317,188" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M510,236 L510,214 L317,214" fill="none" stroke="#94a3b8" stroke-width="1.3"/><text x="640" y="268" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">두 색인은 합치지 않는다 —</text><text x="640" y="288" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">규정 질문에 사업 조각이 섞이지 않게</text><text x="28" y="350" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">열람 권한은 검색 조건(SQL)에 넣는다. 답을 만든 뒤에 거르면 모델이 이미 권한 밖 자료를 읽은 뒤이기 때문이다.</text><text x="28" y="370" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">모델이 학습하지 않은 최신·기관 내부 정보로 답할 수 있고, 답의 근거를 출처로 보일 수 있다.</text></svg>
