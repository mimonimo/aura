<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>RAG 개념도</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="334" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">검색 증강 생성(RAG): 찾고, 묶고, 쓴다</text><rect x="14.0" y="50.0" width="124.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">교직원의 질문</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 질문한</text><text x="26.0" y="142.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">사람의 권한</text><path d="M138.0,103.5 L156.0,103.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="156.0" y="50.0" width="124.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="268.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">①</text><text x="168.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">검색</text><text x="168.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문과 가까운</text><text x="168.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">문서 청크를</text><text x="168.0" y="142.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">찾음</text><path d="M280.0,103.5 L298.0,103.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="298.0" y="50.0" width="124.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="410.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">②</text><text x="310.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">근거 묶기</text><text x="310.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">청크와 출처를</text><text x="310.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">모델 입력에</text><text x="310.0" y="142.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">넣음</text><path d="M422.0,103.5 L440.0,103.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="440.0" y="50.0" width="124.0" height="107.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="552.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">③</text><text x="452.0" y="78.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">생성 모델</text><text x="452.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거 안에서</text><text x="452.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">답을 씀</text><path d="M564.0,103.5 L582.0,103.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="582.0" y="50.0" width="124.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="594.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">근거 붙은 답</text><text x="594.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">답 + 출처</text><text x="594.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">(문서·쪽·절)</text><rect x="14.0" y="197.0" width="200.0" height="65.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="225.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">규정 색인</text><text x="26.0" y="247.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">교내 규정·지침, 조문 단위</text><rect x="230.0" y="197.0" width="200.0" height="65.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="242.0" y="225.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사업 문서 색인</text><text x="242.0" y="247.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 문서 청크</text><path d="M114.0,197.0 L114.0,179.0 L330.0,179.0 L330.0,197.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M218.0,179.0 L218.0,157.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="450.0" y="219.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">두 색인은 합치지 않는다. 규정 질문에</text><text x="450.0" y="240.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">사업 청크가 섞이지 않게</text><text x="14.0" y="294.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">열람 권한은 검색 조건(SQL)에 넣는다. 답을 만든 뒤에 거르면 모델이 이미 권한 밖 자료를 읽은 뒤이기</text><text x="14.0" y="315.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">때문이다. 모델이 학습하지 않은 최신·기관 내부 정보로 답할 수 있고, 답의 근거를 출처로 보일 수 있다.</text></svg>
