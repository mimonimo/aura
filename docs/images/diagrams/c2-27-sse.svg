<svg xmlns="http://www.w3.org/2000/svg" width="720" height="501" viewBox="0 0 720 501" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>SSE 알림 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="501" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">SSE 알림 흐름</text><rect x="354.0" y="50.0" width="352.0" height="128.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">기준 데이터 보관</text><text x="366.0" y="78.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 서버</text><text x="366.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">① 요청자가 편집 잠금을 가졌는지 확인한다</text><text x="366.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">② 버전 번호가 다르면 충돌 사본으로 보관한다</text><text x="366.0" y="142.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">③ 새 버전 번호로 저장한다</text><text x="366.0" y="163.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">④ 알림 스트림에 이벤트를 추가한다</text><rect x="14.0" y="50.0" width="220.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="222.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">편집자</text><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">브라우저 A</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">편집 영역 하나를 고친 뒤 그</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">글 전체와 버전 번호를 보낸다</text><path d="M234.0,90.0 L354.0,90.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="294.0" y="82.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">POST</text><text x="242.0" y="114.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">편집 영역 변경</text><path d="M354.0,142.0 L234.0,142.0" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="242.0" y="166.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">새 버전 번호</text><rect x="14.0" y="212.0" width="300.0" height="221.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="234.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">알림 스트림 (SSE)</text><rect x="26.0" y="246.0" width="276.0" height="30.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="164.0" y="266.5" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">이벤트 41: 편집 영역 변경</text><rect x="26.0" y="284.0" width="276.0" height="30.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="164.0" y="304.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">이벤트 42: 편집 잠금</text><rect x="26.0" y="322.0" width="276.0" height="30.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="164.0" y="342.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">이벤트 43: 편집 영역 변경</text><text x="26.0" y="378.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">하나의 HTTP 연결을 열어 두고 서버가</text><text x="26.0" y="399.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">브라우저로 이벤트를 계속 보내는 단방향</text><text x="26.0" y="420.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">스트림이다.</text><path d="M394.0,178.0 L394.0,198.0 L164.0,198.0 L164.0,212.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="374.0" y="212.0" width="332.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="694.0" y="239.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">열람자</text><text x="386.0" y="240.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">브라우저 B</text><text x="386.0" y="262.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이벤트를 받아 해당 편집 영역의 글을 새로</text><text x="386.0" y="283.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">표시한다</text><rect x="374.0" y="312.0" width="332.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="694.0" y="339.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">열람자</text><text x="386.0" y="340.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">브라우저 C</text><text x="386.0" y="362.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 이벤트를 받고, 연결이 끊기면 마지막으로</text><text x="386.0" y="383.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">받은 이벤트 다음부터 이어 받는다</text><path d="M314.0,255.0 L374.0,255.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M314.0,355.0 L374.0,355.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="461.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">변경 전송은 일반 HTTP POST 로, 알림 전송은 SSE 로 처리한다. 별도의 양방향 통신 라이브러리나 빌드</text><text x="14.0" y="482.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">단계 없이 FastAPI 서버만으로 구현한다.</text></svg>
