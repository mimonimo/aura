<svg xmlns="http://www.w3.org/2000/svg" width="720" height="543" viewBox="0 0 720 543" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>SSE 알림 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="543" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">SSE 알림 흐름: 변경은 POST 로, 알림은 밀어 주기로</text><rect x="354.0" y="50.0" width="352.0" height="191.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">정답을 쥔 곳</text><text x="366.0" y="78.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 서버</text><text x="366.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">① 편집 잠금 확인</text><text x="366.0" y="121.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 이 편집 영역을 쥔 사람인가</text><text x="366.0" y="142.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">② 버전 번호 확인</text><text x="366.0" y="163.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 어긋나면 충돌 사본으로 둠</text><text x="366.0" y="184.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">③ 기록</text><text x="366.0" y="205.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 새 버전 번호로 저장 (정답)</text><text x="366.0" y="226.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">④ 알림 줄에 사건 추가</text><rect x="14.0" y="50.0" width="220.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="222.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">고치는 사람</text><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">브라우저 A</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">편집 영역 하나를 고침</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">편집 영역 글 전체 + 버전 번호</text><path d="M234.0,90.0 L354.0,90.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="294.0" y="82.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">POST</text><text x="242.0" y="114.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">편집 영역 변경</text><path d="M354.0,170.0 L234.0,170.0" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="242.0" y="194.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">새 버전 번호</text><rect x="14.0" y="275.0" width="300.0" height="200.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="297.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">알림 줄 (SSE)</text><rect x="26.0" y="309.0" width="276.0" height="30.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="164.0" y="329.5" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">사건 41 · 편집 영역 변경</text><rect x="26.0" y="347.0" width="276.0" height="30.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="164.0" y="367.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사건 42 · 편집 잠금</text><rect x="26.0" y="385.0" width="276.0" height="30.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="164.0" y="405.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사건 43 · 편집 영역 변경</text><text x="26.0" y="441.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">HTTP 연결 하나로 서버 → 브라우저 한</text><text x="26.0" y="462.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">방향으로 계속</text><path d="M394.0,241.0 L394.0,261.0 L164.0,261.0 L164.0,275.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="374.0" y="275.0" width="332.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="694.0" y="302.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">보는 사람</text><text x="386.0" y="303.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">브라우저 B</text><text x="386.0" y="325.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">EventSource 로 받음</text><text x="386.0" y="346.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">그 편집 영역 글을 바꿔 그림</text><rect x="374.0" y="375.0" width="332.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="694.0" y="402.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">보는 사람</text><text x="386.0" y="403.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">브라우저 C</text><text x="386.0" y="425.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 사건을 받음</text><text x="386.0" y="446.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">끊기면 Last-Event-ID 로 이어 받기</text><path d="M314.0,318.0 L374.0,318.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M314.0,418.0 L374.0,418.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="503.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">변경 보내기는 일반 HTTP POST, 밀어 주기는 SSE 다. 별도 양방향 라이브러리나 빌드 단계 없이</text><text x="14.0" y="524.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">FastAPI 서버 그대로 쓴다.</text></svg>
