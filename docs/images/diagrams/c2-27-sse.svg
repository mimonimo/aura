<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>SSE 알림 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1100" height="430" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">SSE 알림 흐름 — 변경은 POST 로, 알림은 밀어 주기로</text><rect x="28" y="90" width="210" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="112" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">고치는 사람</text><text x="44" y="134" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">브라우저 A</text><text x="44" y="156" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">칸 하나를 고침</text><text x="44" y="175" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">칸 글 전체 + 판 번호</text><rect x="320" y="76" width="300" height="280" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="336" y="98" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">정답을 쥔 곳</text><text x="336" y="120" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 서버</text><text x="336" y="142" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">① 임대 확인</text><text x="336" y="161" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 이 칸을 쥔 사람인가</text><text x="336" y="180" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">② 판 번호 확인</text><text x="336" y="199" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 어긋나면 충돌 사본으로 둠</text><text x="336" y="218" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">③ 기록</text><text x="336" y="237" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 새 판 번호로 저장 (정답)</text><text x="336" y="256" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">④ 알림 줄에 사건 추가</text><path d="M238,130 L320,130" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="279.0" y="122" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">POST 칸 변경</text><path d="M320,180 L238,180" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="279.0" y="172" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">새 판 번호</text><rect x="668" y="76" width="170" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="682" y="96" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">알림 줄 (SSE)</text><rect x="684" y="112" width="138" height="28" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="753.0" y="130.5" font-size="12.5" font-weight="600" fill="#1b3b75" text-anchor="middle">사건 41 · 칸 변경</text><rect x="684" y="148" width="138" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="753.0" y="166.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">사건 42 · 임대</text><rect x="684" y="184" width="138" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="753.0" y="202.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">사건 43 · 칸 변경</text><text x="684" y="240" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">HTTP 연결 하나로</text><text x="684" y="258" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">서버 → 브라우저</text><text x="684" y="276" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">한 방향으로 계속</text><path d="M620,300 L668,300" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="886" y="76" width="190" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="902" y="98" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">보는 사람</text><text x="902" y="120" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">브라우저 B</text><text x="902" y="142" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">EventSource 로 받음</text><text x="902" y="161" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">그 칸 글을 바꿔 그림</text><rect x="886" y="236" width="190" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="902" y="258" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">보는 사람</text><text x="902" y="280" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">브라우저 C</text><text x="902" y="302" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">같은 사건을 받음</text><text x="902" y="321" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">끊기면 Last-Event-ID 로</text><text x="902" y="340" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">이어 받기</text><path d="M838,136 L886,136" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M838,296 L886,296" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="28" y="400" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">변경 보내기는 일반 HTTP POST, 밀어 주기는 SSE 다. 별도 양방향 라이브러리나 빌드 단계 없이 FastAPI 서버 그대로 쓴다.</text></svg>
