<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>SFT 파이프라인</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="630" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">SFT 파이프라인</text><rect x="14.0" y="50.0" width="692.0" height="226.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="72.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">학습 후보</text><rect x="26.0" y="82.0" width="328.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="110.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">실문서 절 작성 쌍</text><text x="38.0" y="132.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">양식과 완성본으로 운영 입력 형식의 쌍을</text><text x="38.0" y="153.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">만든다</text><rect x="366.0" y="82.0" width="328.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="378.0" y="110.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">문서 구조 단계 문답</text><text x="378.0" y="132.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업명부터 뼈대까지 단계별로 답한다</text><rect x="26.0" y="180.0" width="328.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="208.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">근거 기반 연결 대화</text><text x="38.0" y="230.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업에서 절까지의 근거를 담은 대화</text><rect x="366.0" y="180.0" width="328.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="378.0" y="208.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">운영 기록의 마스킹 사본</text><text x="378.0" y="230.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">에이전트 단계와 질문 해석 기록</text><path d="M74.0,276.0 L74.0,296.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="296.0" width="328.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="296.0" width="100.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="317.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">자동 검사</text><text x="126.0" y="317.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거와 수치가 맞는지 확인한다</text><rect x="14.0" y="338.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="338.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="369.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">사람 검수</text><text x="126.0" y="359.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거와 구조, 개인정보를</text><text x="126.0" y="380.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">확인한다</text><path d="M64.0,328.0 L64.0,338.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="400.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="400.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="431.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">개인정보</text><text x="126.0" y="421.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">재마스킹 결과가 같은 파일만</text><text x="126.0" y="442.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">쓴다</text><path d="M64.0,390.0 L64.0,400.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="462.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="462.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="493.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">분할 검사</text><text x="126.0" y="483.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 단위로 나누고 중복을</text><text x="126.0" y="504.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">없앤다</text><path d="M64.0,452.0 L64.0,462.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="378.0" y="296.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="378.0" y="296.0" width="100.0" height="52.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="390.0" y="327.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">학습</text><text x="490.0" y="317.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">LoRA 로 지도</text><text x="490.0" y="338.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">미세조정(SFT)한다</text><rect x="378.0" y="358.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="378.0" y="358.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="390.0" y="389.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">병합</text><text x="490.0" y="379.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">4비트로 양자화해 후보로</text><text x="490.0" y="400.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서빙한다</text><path d="M428.0,348.0 L428.0,358.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="378.0" y="420.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="378.0" y="420.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="390.0" y="451.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">비교</text><text x="490.0" y="441.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 시험으로 기반 모델과</text><text x="490.0" y="462.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">비교한다</text><path d="M428.0,410.0 L428.0,420.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M342.0,488.0 L360.0,488.0 L360.0,322.0 L378.0,322.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="378.0" y="490.0" width="190.0" height="107.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="390.0" y="518.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">채택 기준 충족</text><text x="390.0" y="540.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">해당 용도의 모델을 후보</text><text x="390.0" y="561.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">모델로 바꾼다</text><rect x="578.0" y="490.0" width="128.0" height="107.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="590.0" y="518.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">기준 미달</text><text x="590.0" y="540.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">데이터를</text><text x="590.0" y="561.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">보강해 다시</text><text x="590.0" y="582.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">학습한다</text><path d="M428.0,472.0 L428.0,490.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M642.0,472.0 L642.0,490.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="548.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">비교할 때는 모델만 바꾸고 질문과 플랫폼 코드,</text><text x="14.0" y="569.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">생성 설정, 채점 모델은 그대로 둔다. 학습</text><text x="14.0" y="590.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">데이터셋 원문은 학습 장비 밖으로 반출하지</text><text x="14.0" y="611.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">않는다.</text></svg>
