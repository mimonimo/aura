<svg xmlns="http://www.w3.org/2000/svg" width="720" height="629" viewBox="0 0 720 629" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>SFT 파이프라인</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="629" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">SFT 파이프라인: 학습 데이터에서 운영 교체 결정까지</text><rect x="14.0" y="50.0" width="692.0" height="226.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="72.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">학습 후보</text><rect x="26.0" y="82.0" width="328.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="110.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">실문서 절 작성쌍 (scripts/152)</text><text x="38.0" y="132.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">양식 × 완성본 · 서빙 프롬프트 형식 → 편집</text><text x="38.0" y="153.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">계획 JSON</text><rect x="366.0" y="82.0" width="328.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="378.0" y="110.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">문서 구조 단계 문답 (scripts/153)</text><text x="378.0" y="132.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">[N단계] 사업명 → 개요 → 목차 → 요구 항목</text><text x="378.0" y="153.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">→ 뼈대</text><rect x="26.0" y="180.0" width="328.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="208.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">근거 기반 연결 대화</text><text x="38.0" y="230.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 · 연차 · 문서 · 절 경로와 근거 위치,</text><text x="38.0" y="251.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">2~6턴</text><rect x="366.0" y="180.0" width="328.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="378.0" y="208.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">운영 기록: 마스킹한 사본</text><text x="378.0" y="230.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">에이전트 단계 · 질문 읽기 · 양식 고르기 · 못</text><text x="378.0" y="251.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">채운 이유</text><path d="M74.0,276.0 L74.0,296.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="296.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="296.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="327.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">자동 검사</text><text x="126.0" y="317.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">경로·근거 기록, 근거가 그 턴에</text><text x="126.0" y="338.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">그대로, 숫자 대조</text><rect x="14.0" y="358.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="358.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="389.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">사람 검수</text><text x="126.0" y="379.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Label Studio:</text><text x="126.0" y="400.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거·구조·맥락·개인정보</text><path d="M64.0,348.0 L64.0,358.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="420.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="420.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="451.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">개인정보</text><text x="126.0" y="441.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">전체 탐지, 다시 마스킹해도</text><text x="126.0" y="462.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 파일만 반출</text><path d="M64.0,410.0 L64.0,420.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="482.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="482.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="513.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">묶음 검사</text><text x="126.0" y="503.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 단위 학습·검증·시험</text><text x="126.0" y="524.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">분리, 중복 제거</text><path d="M64.0,472.0 L64.0,482.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="378.0" y="296.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="378.0" y="296.0" width="100.0" height="52.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="390.0" y="327.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">학습</text><text x="490.0" y="317.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">TRL·PEFT bf16 LoRA SFT,</text><text x="490.0" y="338.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">문맥 16,384</text><rect x="378.0" y="358.0" width="328.0" height="54.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="378.0" y="358.0" width="100.0" height="54.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="390.0" y="379.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">병합·</text><text x="390.0" y="401.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">재양자화</text><text x="490.0" y="380.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">병합 → NVFP4 → 후보</text><text x="490.0" y="401.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이름으로 서빙</text><path d="M428.0,348.0 L428.0,358.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="378.0" y="422.0" width="328.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="378.0" y="422.0" width="100.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="390.0" y="453.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">비교</text><text x="490.0" y="443.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">정답 로그확률 → 같은</text><text x="490.0" y="464.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">시험으로 기반 모델과</text><path d="M428.0,412.0 L428.0,422.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M342.0,508.0 L360.0,508.0 L360.0,322.0 L378.0,322.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="378.0" y="492.0" width="190.0" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="390.0" y="520.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">채택 기준을 넘으면</text><text x="390.0" y="542.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">용도를 후보 모델로</text><rect x="578.0" y="492.0" width="128.0" height="86.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="590.0" y="520.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">넘지 못하면</text><text x="590.0" y="542.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">학습셋 보강 뒤</text><text x="590.0" y="563.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">다시</text><path d="M428.0,474.0 L428.0,492.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M642.0,474.0 L642.0,492.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="568.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">비교에서는 모델 하나만 바꾸고 질문 · 플랫폼 코드</text><text x="14.0" y="589.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 생성 설정 · 채점 모델은 그대로 둔다. 학습셋</text><text x="14.0" y="610.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">원문은 학습 장비 밖으로 나가지 않는다.</text></svg>
