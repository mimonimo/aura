<svg xmlns="http://www.w3.org/2000/svg" width="980" height="625" viewBox="0 0 980 625" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>SFT 파이프라인</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="625" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">SFT 파이프라인 — 학습 데이터에서 운영 교체 결정까지</text><rect x="28" y="62" width="892" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="42" y="82" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">학습 후보</text><rect x="44.0" y="88" width="422.0" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60.0" y="114" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">실문서 절 작성쌍 (scripts/152)</text><text x="60.0" y="134" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">양식 × 완성본 · 서빙 프롬프트 형식 → 편집 계획 JSON</text><rect x="482.0" y="88" width="422.0" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="498.0" y="114" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">문서 구조 단계 문답 (scripts/153)</text><text x="498.0" y="134" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">[N단계] 사업명 → 개요 → 목차 → 요구 항목 → 뼈대</text><rect x="44.0" y="152" width="422.0" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60.0" y="178" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">근거 기반 연결 대화</text><text x="60.0" y="198" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">사업 · 연차 · 문서 · 절 경로와 근거 위치, 2~6턴</text><rect x="482.0" y="152" width="422.0" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="498.0" y="178" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">운영 기록 — 가린 사본</text><text x="498.0" y="198" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">에이전트 단계 · 질문 읽기 · 양식 고르기 · 못 채운 이유</text><path d="M113,222 L113,254" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="254" width="426.0" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="254" width="130" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="280.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">자동 검사</text><text x="174" y="279.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">경로·근거 기록, 근거가 그 턴에 그대로, 숫자 대조</text><path d="M93,296 L93,310" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="310" width="426.0" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="310" width="130" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="336.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">사람 검수</text><text x="174" y="335.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Label Studio — 근거·구조·맥락·개인정보</text><path d="M93,352 L93,366" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="366" width="426.0" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="366" width="130" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="392.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">개인정보</text><text x="174" y="391.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">전체 탐지, 다시 가려도 같은 파일만 반출</text><path d="M93,408 L93,422" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="422" width="426.0" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="422" width="130" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="448.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">묶음 검사</text><text x="174" y="447.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">사업 단위 학습·검증·시험 분리, 중복 제거</text><rect x="494.0" y="254" width="426.0" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="494.0" y="254" width="130" height="42" rx="9" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="508.0" y="280.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">학습</text><text x="640.0" y="279.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">TRL·PEFT bf16 LoRA SFT, 문맥 16,384</text><path d="M559.0,296 L559.0,310" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="494.0" y="310" width="426.0" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="494.0" y="310" width="130" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="508.0" y="336.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">병합·재양자화</text><text x="640.0" y="335.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">병합 → NVFP4 → 후보 이름으로 서빙</text><path d="M559.0,352 L559.0,366" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="494.0" y="366" width="426.0" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="494.0" y="366" width="130" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="508.0" y="392.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">비교</text><text x="640.0" y="391.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">정답 로그확률 → 같은 시험으로 기반 모델과</text><path d="M454.0,443 L474.0,443 L474.0,275 L494.0,275" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M559.0,408 L559.0,494" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="494.0" y="494" width="205.0" height="60" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="510.0" y="520" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">채택 기준을 넘으면</text><text x="510.0" y="542" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">용도를 후보 모델로</text><rect x="715.0" y="494" width="205.0" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/><text x="731.0" y="520" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">넘지 못하면</text><text x="731.0" y="542" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">학습셋 보강 뒤 다시</text><text x="28" y="586" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">비교에서는 모델 하나만 바꾸고 질문 · 플랫폼 코드 · 생성 설정 · 채점 모델은 그대로 둔다.</text><text x="28" y="606" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">학습셋 원문은 학습 장비 밖으로 나가지 않는다.</text></svg>
