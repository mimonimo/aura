<svg xmlns="http://www.w3.org/2000/svg" width="980" height="830" viewBox="0 0 980 830" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>SFT 파이프라인</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="830" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">SFT 파이프라인 — 학습 데이터에서 운영 교체 결정까지</text><rect x="28" y="62" width="892" height="160" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="42" y="82" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">학습 후보</text><rect x="44.0" y="88" width="422.0" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60.0" y="114" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">실문서 절 작성쌍 (scripts/152)</text><text x="60.0" y="134" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">양식 × 완성본 · 서빙 프롬프트 꼴 → 편집 계획 JSON</text><rect x="482.0" y="88" width="422.0" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="498.0" y="114" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">문서 구조 단계 문답 (scripts/153)</text><text x="498.0" y="134" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">[N단계] 사업명 → 개요 → 목차 → 요구 항목 → 뼈대</text><rect x="44.0" y="152" width="422.0" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="60.0" y="178" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">근거 기반 연결 대화</text><text x="60.0" y="198" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">사업 · 연차 · 문서 · 절 경로와 근거 위치, 2~6턴</text><rect x="482.0" y="152" width="422.0" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="498.0" y="178" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">운영 기록 — 가린 사본</text><text x="498.0" y="198" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">에이전트 단계 · 질문 읽기 · 양식 고르기 · 못 채운 까닭</text><path d="M113,222 L113,254" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="254" width="892" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="254" width="170" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="282.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">자동 검사</text><text x="214" y="281.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">경로 · 근거 기록, 근거가 그 턴에 글자 그대로, 숫자가 근거에(수치 검증기와 같은 함수), 순서, 중복</text><path d="M113,300 L113,316" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="316" width="892" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="316" width="170" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="344.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">사람 검수</text><text x="214" y="343.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Label Studio — 근거 · 구조 · 맥락 · 개인정보 네 항목 확인, 채택 · 수정만 승인본</text><path d="M113,362 L113,378" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="378" width="892" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="378" width="170" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="406.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">개인정보</text><text x="214" y="405.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">내부 설정과 상관없이 전체 탐지, 다시 가려도 바뀌지 않는 파일만 반출(fail-closed)</text><path d="M113,424 L113,440" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="440" width="892" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="440" width="170" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="468.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">묶음 검사</text><text x="214" y="467.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">사업 단위 학습 · 검증 · 시험 분리와 중복을 전체에서 다시</text><path d="M113,486 L113,502" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="502" width="892" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="502" width="170" height="46" rx="9" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="42" y="530.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">학습</text><text x="214" y="529.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">학습 장비 · TRL · PEFT, bf16 LoRA SFT, 문맥 16,384, 베이스라인 없으면 시작 안 함</text><path d="M113,548 L113,564" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="564" width="892" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="564" width="170" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="592.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">병합 · 재양자화</text><text x="214" y="591.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">병합 → NVFP4 → 서빙 장비에 후보 이름으로 올림 (scripts/116)</text><path d="M113,610 L113,626" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="626" width="892" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="28" y="626" width="170" height="46" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="42" y="654.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">비교 (ADR-0069)</text><text x="214" y="653.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">학습이 서빙에 들어갔나(정답 로그확률) → 같은 시험으로 오픈 모델과</text><path d="M113,672 L113,702" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="702" width="420" height="64" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="728" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">채택 기준을 넘으면</text><text x="44" y="750" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">용도를 후보 모델로 옮김</text><rect x="492" y="702" width="428" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/><text x="508" y="728" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">넘지 못하면</text><text x="508" y="750" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">학습셋을 보강해 같은 절차로 다시</text><path d="M113,686 L670,686 L670,702" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M920,734 L950,734 L950,142 L920,142" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="28" y="802" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">비교에서는 모델 하나만 바꾸고 질문 · 플랫폼 코드 · 생성 설정 · 채점 모델은 그대로 둔다.</text><text x="28" y="822" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">학습셋 원문은 학습 장비 밖으로 나가지 않는다.</text></svg>
