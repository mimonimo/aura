="94.0" y="412.0" width="612.0" height="34.0" rx="6" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="104.0" y="435.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">공통</text><text x="137.9" y="435.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="151.9" y="435.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">지난 사업 문서</text><text x="251.1" y="435.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="265.1" y="435.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">사업</text><text x="298.4" y="435.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="312.4" y="435.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">용도</text><text x="696.0" y="435.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="end">사업 전용 양식</text><path d="M72.0,429.0 L94.0,429.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="94.0" y="452.0" width="612.0" height="34.0" rx="6" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="104.0" y="475.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">~아이디</text><text x="696.0" y="475.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="end">개인 폴더</text><path d="M72.0,469.0 L94.0,469.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><path d="M32.0,82.0 L32.0,269.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><path d="M72.0,286.0 L72.0,469.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><text x="14.0" y="512.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">파일의 실제 위치는 DB 의 파일 대장에 기록되어 있으므로, 폴더 전체를 옮길 때는 대장에 적힌 경로의</text><text x="14.0" y="533.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">앞부분만 바꾸면 된다. 기안기 아래의 다섯 폴더는 부서마다 하나씩 있으며, 개인 폴더는 사용자가 처음 열</text><text x="14.0" y="554.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">때 만들어진다.</text></svg>
