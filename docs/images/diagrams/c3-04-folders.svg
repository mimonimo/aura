<svg xmlns="http://www.w3.org/2000/svg" width="720" height="573" viewBox="0 0 720 573" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>문서 폴더 배치</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="573" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">문서 폴더 배치</text><rect x="14.0" y="50.0" width="130.0" height="32.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="72.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">documents/</text><text x="696.0" y="72.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="end">담는 것</text><text x="164.0" y="72.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">굵은 글: 폴더 이름, 흐린 글: 문서마다 달라지는 부분</text><rect x="54.0" y="92.0" width="652.0" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="115.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">반입</text><text x="97.9" y="115.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="111.9" y="115.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">연도</text><text x="145.3" y="115.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="159.3" y="115.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">서류 유형</text><text x="224.6" y="115.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="238.6" y="115.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">접수번호와 제목</text><text x="344.9" y="115.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="358.9" y="115.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">원본 파일</text><text x="696.0" y="115.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="end">수집한 원본과 추출 결과</text><path d="M32.0,109.0 L54.0,109.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="54.0" y="132.0" width="652.0" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="155.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">첨부</text><text x="97.9" y="155.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="111.9" y="155.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">연도</text><text x="145.3" y="155.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="159.3" y="155.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">대화 번호</text><text x="224.6" y="155.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="238.6" y="155.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">시각과 파일 이름</text><text x="696.0" y="155.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="end">채팅에 첨부한 파일</text><path d="M32.0,149.0 L54.0,149.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="54.0" y="172.0" width="652.0" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="195.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">생성</text><text x="97.9" y="195.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/</text><text x="111.9" y="195.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">연도</text><text x="145.3" y="195.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="start">/<