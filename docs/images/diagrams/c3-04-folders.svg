<svg xmlns="http://www.w3.org/2000/svg" width="720" height="533" viewBox="0 0 720 533" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>1 층 문서 폴더 배치</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="533" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">1 층 문서 폴더 배치: 문서마다 접수번호와 제목으로 된 폴더</text><rect x="14.0" y="50.0" width="130.0" height="32.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="72.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">documents/</text><text x="698.0" y="72.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="end">하는 일</text><rect x="54.0" y="92.0" width="652.0" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="115.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">반입/&lt;연도&gt;/&lt;유형&gt;/&lt;접수번호&gt; &lt;제목&gt;/원본.&lt;확장자&gt;</text><text x="696.0" y="115.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">수집 원본과 추출 부산물</text><path d="M32.0,109.0 L54.0,109.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="54.0" y="132.0" width="652.0" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="155.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">첨부/&lt;연도&gt;/대화-&lt;번호&gt;/&lt;시각&gt; &lt;파일명&gt;</text><text x="696.0" y="155.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">채팅 첨부</text><path d="M32.0,149.0 L54.0,149.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="54.0" y="172.0" width="652.0" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="195.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">생성/&lt;연도&gt;/&lt;접수번호&gt;/&lt;시각&gt; &lt;종류&gt;.&lt;확장자&gt;</text><text x="696.0" y="195.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">초안 · 판독 · 복원 · 완성본 사본</text><path d="M32.0,189.0 L54.0,189.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="54.0" y="212.0" width="652.0" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="235.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">보고/주간/&lt;월요일&gt;.md</text><text x="696.0" y="235.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">주간 보고</text><path d="M32.0,229.0 L54.0,229.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="54.0" y="252.0" width="652.0" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="275.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">기안기/&lt;부서&gt;/&lt;폴더&gt;/&lt;제목&gt;.hwpx</text><text x="696.0" y="275.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">한글 문서함(부서 디렉터리)</text><path d="M32.0,269.0 L54.0,269.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="94.0" y="292.0" width="612.0" height="34.0" rx="6" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="104.0" y="315.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">.판/ · .휴지통/</text><text x="696.0" y="315.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">부서마다 저장 전 버전과 지운 문서</text><path d="M72.0,309.0 L94.0,309.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="94.0" y="332.0" width="612.0" height="34.0" rx="6" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="104.0" y="355.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">공통/공통 양식/&lt;목적&gt;/</text><text x="696.0" y="355.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">어디서나 쓰는 빈 양식</text><path d="M72.0,349.0 L94.0,349.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="94.0" y="372.0" width="612.0" height="34.0" rx="6" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="104.0" y="395.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">공통/지난 사업 문서/&lt;사업&gt;/&lt;목적&gt;/</text><text x="696.0" y="395.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">사업 전용 양식</text><path d="M72.0,389.0 L94.0,389.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><rect x="94.0" y="412.0" width="612.0" height="34.0" rx="6" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="104.0" y="435.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">~&lt;아이디&gt;/</text><text x="696.0" y="435.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">내 폴더(처음 열 때 생김)</text><path d="M72.0,429.0 L94.0,429.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><path d="M32.0,82.0 L32.0,269.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><path d="M72.0,286.0 L72.0,429.0" fill="none" stroke="#7b8797" stroke-width="1.6"/><text x="14.0" y="472.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">파일의 실제 자리는 DB 의 파일 대장이 가리킨다. 폴더를 통째로 옮길 때는 경로 앞부분만 바꾸면 된다.</text><text x="14.0" y="493.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">경로 규칙은 app/paths.py 한 곳에서만 나오고, 새 수집 지점은 원본 채택 함수(storage.adopt_original)를</text><text x="14.0" y="514.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">거친다.</text></svg>
