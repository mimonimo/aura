<svg xmlns="http://www.w3.org/2000/svg" width="980" height="556" viewBox="0 0 980 556" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>1 층 문서 폴더 배치</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="556" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">1 층 문서 폴더 배치 — 문서마다 접수번호와 제목으로 된 폴더</text><rect x="28" y="62" width="150" height="34" rx="7" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="42" y="84" font-size="13.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="700" fill="#1b3b75">documents/</text><text x="952" y="84" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="end">하는 일</text><line x1="48" y1="96" x2="48" y2="294" stroke="#94a3b8" stroke-width="1.3"/><line x1="88" y1="310" x2="88" y2="454" stroke="#94a3b8" stroke-width="1.3"/><line x1="48" y1="134" x2="70" y2="134" stroke="#94a3b8" stroke-width="1.3"/><rect x="72" y="118" width="880" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="84" y="139" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="600" fill="#1f2937">반입/&lt;연도&gt;/&lt;유형&gt;/&lt;접수번호&gt; &lt;제목&gt;/원본.&lt;확장자&gt;</text><text x="936" y="139" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">반입 원본과 추출 부산물</text><line x1="48" y1="174" x2="70" y2="174" stroke="#94a3b8" stroke-width="1.3"/><rect x="72" y="158" width="880" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="84" y="179" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="600" fill="#1f2937">첨부/&lt;연도&gt;/대화-&lt;번호&gt;/&lt;시각&gt; &lt;파일명&gt;</text><text x="936" y="179" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">채팅 첨부</text><line x1="48" y1="214" x2="70" y2="214" stroke="#94a3b8" stroke-width="1.3"/><rect x="72" y="198" width="880" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="84" y="219" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="600" fill="#1f2937">생성/&lt;연도&gt;/&lt;접수번호&gt;/&lt;시각&gt; &lt;종류&gt;.&lt;확장자&gt;</text><text x="936" y="219" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">초안 · 판독 · 복원 · 완성본 사본</text><line x1="48" y1="254" x2="70" y2="254" stroke="#94a3b8" stroke-width="1.3"/><rect x="72" y="238" width="880" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="84" y="259" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="600" fill="#1f2937">보고/주간/&lt;월요일&gt;.md</text><text x="936" y="259" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">주간 보고</text><line x1="48" y1="294" x2="70" y2="294" stroke="#94a3b8" stroke-width="1.3"/><rect x="72" y="278" width="880" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="84" y="299" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="600" fill="#1f2937">기안기/&lt;부서&gt;/&lt;폴더&gt;/&lt;제목&gt;.hwpx</text><text x="936" y="299" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">한글 문서함(부서 디렉터리)</text><line x1="88" y1="334" x2="110" y2="334" stroke="#94a3b8" stroke-width="1.3"/><rect x="112" y="318" width="840" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="124" y="339" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">.판/ · .휴지통/</text><text x="936" y="339" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">부서마다 저장 전 판과 지운 문서</text><line x1="88" y1="374" x2="110" y2="374" stroke="#94a3b8" stroke-width="1.3"/><rect x="112" y="358" width="840" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="124" y="379" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">공통/공통 양식/&lt;목적&gt;/</text><text x="936" y="379" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">어디서나 쓰는 빈 양식</text><line x1="88" y1="414" x2="110" y2="414" stroke="#94a3b8" stroke-width="1.3"/><rect x="112" y="398" width="840" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="124" y="419" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">공통/지난 사업 문서/&lt;사업&gt;/&lt;목적&gt;/</text><text x="936" y="419" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">사업 전용 양식</text><line x1="88" y1="454" x2="110" y2="454" stroke="#94a3b8" stroke-width="1.3"/><rect x="112" y="438" width="840" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text x="124" y="459" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">~&lt;아이디&gt;/</text><text x="936" y="459" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="end">내 폴더(처음 열 때 생김)</text><text x="28" y="506" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">파일의 실제 자리는 DB 의 파일 장부가 가리킨다. 폴더를 통째로 옮길 때는 경로 앞부분만 바꾸면 된다.</text><text x="28" y="526" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">경로 규칙은 app/paths.py 한 곳에서만 나오고, 새 반입 지점은 원본 채택 함수(storage.adopt_original)를 거친다.</text></svg>
