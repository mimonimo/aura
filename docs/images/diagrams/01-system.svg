<svg xmlns="http://www.w3.org/2000/svg" width="720" height="593" viewBox="0 0 720 593" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>전체 프로젝트 구조: 교내 장비와 연결</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="593" fill="#ffffff"/><rect x="14.0" y="14.0" width="340.0" height="86.0" rx="8" fill="#e8f0fe" stroke="#2f5fb3" stroke-width="1.5"/><text x="26.0" y="42.2" font-size="18" font-weight="700" fill="#2f5fb3" text-anchor="start">교직원 브라우저</text><text x="26.0" y="64.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">AURA 화면 · 웹 한글 기안기 · 공동 편집 층</text><text x="26.0" y="85.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 학교망(VPN)</text><rect x="378.0" y="14.0" width="328.0" height="86.0" rx="8" fill="#e8f0fe" stroke="#2f5fb3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="390.0" y="42.2" font-size="18" font-weight="700" fill="#2f5fb3" text-anchor="start">구글 드라이브·독스</text><text x="390.0" y="64.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">보조 경로(드라이브 가져오기·독스 편집)</text><text x="390.0" y="85.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 계정을 이은 사용자만</text><rect x="14.0" y="162.0" width="692.0" height="107.0" rx="8" fill="#f1ecfb" stroke="#6b4fb3" stroke-width="1.5"/><text x="26.0" y="190.2" font-size="18" font-weight="700" fill="#6b4fb3" text-anchor="start">운영 VM</text><text x="26.0" y="212.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">플랫폼 화면·API · PostgreSQL·pgvector · 검색 색인 · 지식그래프·온톨로지 · 웹 한글 기안기 서버 ·</text><text x="26.0" y="233.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">공동 편집 서버(SSE)</text><text x="26.0" y="254.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· CPU 8 · 메모리 64GB · PostgreSQL(pgvector)</text><path d="M48.0,100.0 L48.0,162.0" fill="none" stroke="#2f5fb3" stroke-width="2.0" marker-end="url(#head)"/><text x="62.0" y="125.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">화면 · 기안기 문서 열기·저장 · 편집 영역 글</text><text x="62.0" y="146.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">주고받기</text><path d="M666.0,162.0 L666.0,100.0" fill="none" stroke="#6b4fb3" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="654.0" y="125.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="end">보조 경로. 계정을 이은</text><text x="654.0" y="146.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="end">사용자만, 가져오기·독스 편집</text><rect x="14.0" y="352.0" width="164.0" height="149.0" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="26.0" y="380.2" font-size="18" font-weight="700" fill="#2e7d4f" text-anchor="start">토르 02</text><text x="26.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">vLLM · Writer 27B</text><text x="26.0" y="423.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· Qwen3.8-27B</text><text x="26.0" y="444.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">NVFP4 · 포트 8001</text><rect x="190.0" y="352.0" width="164.0" height="149.0" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="202.0" y="380.2" font-size="18" font-weight="700" fill="#2e7d4f" text-anchor="start">토르 03</text><text x="202.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">검토·판독 27B ·</text><text x="202.0" y="423.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Embed v2 · Rerank</text><text x="202.0" y="444.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">v1</text><text x="202.0" y="465.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 임베딩 8016 ·</text><text x="202.0" y="486.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">리랭커 8015</text><rect x="366.0" y="352.0" width="164.0" height="149.0" rx="8" fill="#fdf3e7" stroke="#8a5a00" stroke-width="1.5"/><text x="378.0" y="380.2" font-size="18" font-weight="700" fill="#8a5a00" text-anchor="start">DGX</text><text x="378.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">원본 보관 · MinerU</text><text x="378.0" y="423.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">판독 · LoRA 학습</text><text x="378.0" y="444.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· GB10 GPU · 통합</text><text x="378.0" y="465.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">메모리 121GB ·</text><text x="378.0" y="486.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">디스크 3.7TB</text><rect x="542.0" y="352.0" width="164.0" height="149.0" rx="8" fill="#fdf3e7" stroke="#8a5a00" stroke-width="1.5"/><text x="554.0" y="380.2" font-size="18" font-weight="700" fill="#8a5a00" text-anchor="start">원본 보관 PC</text><text x="554.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">학교 실문서</text><text x="554.0" y="423.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">보관(사업별 폴더)</text><text x="554.0" y="444.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· DGX 로</text><text x="554.0" y="465.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">복사(rclone)</text><path d="M32.0,269.0 L32.0,352.0" fill="none" stroke="#6b4fb3" stroke-width="2.0" marker-end="url(#head)"/><text x="42.0" y="294.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문·문서 작성.</text><text x="42.0" y="315.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">27B 가 도구를 골라</text><text x="42.0" y="336.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">답하고 쓴다</text><path d="M208.0,269.0 L208.0,352.0" fill="none" stroke="#6b4fb3" stroke-width="2.0" marker-end="url(#head)"/><text x="218.0" y="294.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">새 문서 검토·서류</text><text x="218.0" y="315.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">종류 판정 · 검색</text><text x="218.0" y="336.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">임베딩·리랭킹</text><path d="M378.0,352.0 L378.0,269.0" fill="none" stroke="#8a5a00" stroke-width="2.0" marker-end="url(#head)"/><path d="M394.0,269.0 L394.0,352.0" fill="none" stroke="#6b4fb3" stroke-width="2.0" marker-end="url(#head)"/><text x="404.0" y="294.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">↑ 읽은 결과·원본 목록</text><text x="404.0" y="315.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">↓ 승인된 학습 데이터</text><path d="M386.0,501.0 L386.0,521.0 L96.0,521.0" fill="none" stroke="#8a5a00" stroke-width="2.0"/><path d="M96.0,521.0 L96.0,501.0" fill="none" stroke="#8a5a00" stroke-width="2.0" marker-end="url(#head)"/><path d="M272.0,521.0 L272.0,501.0" fill="none" stroke="#8a5a00" stroke-width="2.0" marker-end="url(#head)"/><text x="184.0" y="543.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">학습본</text><path d="M624.0,501.0 L624.0,521.0 L506.0,521.0" fill="none" stroke="#8a5a00" stroke-width="2.0"/><path d="M506.0,521.0 L506.0,501.0" fill="none" stroke="#8a5a00" stroke-width="2.0" marker-end="url(#head)"/><text x="614.0" y="543.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">학교 원본 복사</text><text x="14.0" y="574.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">화살표 색은 보내는 장비 색</text><rect x="211.6" y="561.0" width="16.0" height="16.0" rx="4" fill="#e8f0fe" stroke="#2f5fb3" stroke-width="1.5"/><text x="233.6" y="574.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사용자 쪽</text><rect x="310.0" y="561.0" width="16.0" height="16.0" rx="4" fill="#f1ecfb" stroke="#6b4fb3" stroke-width="1.5"/><text x="332.0" y="574.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">운영 플랫폼</text><rect x="422.8" y="561.0" width="16.0" height="16.0" rx="4" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="444.8" y="574.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">모델 서빙</text><rect x="521.2" y="561.0" width="16.0" height="16.0" rx="4" fill="#fdf3e7" stroke="#8a5a00" stroke-width="1.5"/><text x="543.2" y="574.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">원본·학습</text></svg>
