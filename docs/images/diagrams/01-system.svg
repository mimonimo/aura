<svg xmlns="http://www.w3.org/2000/svg" width="720" height="593" viewBox="0 0 720 593" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>전체 프로젝트 구조: 교내 장비와 연결</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="593" fill="#ffffff"/><rect x="14.0" y="14.0" width="340.0" height="86.0" rx="8" fill="#e8f0fe" stroke="#2f5fb3" stroke-width="1.5"/><text x="26.0" y="42.2" font-size="18" font-weight="700" fill="#2f5fb3" text-anchor="start">교직원 브라우저</text><text x="26.0" y="64.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">AURA 화면과 웹 한글 기안기를 쓰며,</text><text x="26.0" y="85.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">학교망(VPN)으로 접속한다</text><rect x="378.0" y="14.0" width="328.0" height="86.0" rx="8" fill="#e8f0fe" stroke="#2f5fb3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="390.0" y="42.2" font-size="18" font-weight="700" fill="#2f5fb3" text-anchor="start">구글 드라이브·독스</text><text x="390.0" y="64.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">계정을 연결한 사용자만 쓰는 보조 경로</text><rect x="14.0" y="162.0" width="692.0" height="107.0" rx="8" fill="#f1ecfb" stroke="#6b4fb3" stroke-width="1.5"/><text x="26.0" y="190.2" font-size="18" font-weight="700" fill="#6b4fb3" text-anchor="start">운영 VM</text><text x="26.0" y="212.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">플랫폼 화면과 API, 웹 한글 기안기 서버, 공동 편집 서버(SSE)를 실행한다</text><text x="26.0" y="233.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">PostgreSQL(pgvector)에 문서와 검색 색인, 지식그래프를 저장한다</text><text x="26.0" y="254.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">CPU 8코어, 메모리 64GB</text><path d="M48.0,100.0 L48.0,162.0" fill="none" stroke="#2f5fb3" stroke-width="2.0" marker-end="url(#head)"/><text x="62.0" y="125.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">화면 요청, 기안기 문서 열기·저장, 편집 영역 글</text><text x="62.0" y="146.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">송수신</text><path d="M666.0,162.0 L666.0,100.0" fill="none" stroke="#6b4fb3" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="654.0" y="125.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="end">보조 경로: 계정을 연결한</text><text x="654.0" y="146.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="end">사용자의 가져오기·독스 편집</text><rect x="14.0" y="352.0" width="164.0" height="149.0" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="26.0" y="380.2" font-size="18" font-weight="700" fill="#2e7d4f" text-anchor="start">토르 02</text><text x="26.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">vLLM 으로 Writer</text><text x="26.0" y="423.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">27B(Qwen3.8-27B)</text><text x="26.0" y="444.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">를 서빙한다</text><text x="26.0" y="465.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">4비트(NVFP4)</text><text x="26.0" y="486.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">양자화</text><rect x="190.0" y="352.0" width="164.0" height="149.0" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="202.0" y="380.2" font-size="18" font-weight="700" fill="#2e7d4f" text-anchor="start">토르 03</text><text x="202.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">검토·판독용 27B 와</text><text x="202.0" y="423.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Embed v2, Rerank</text><text x="202.0" y="444.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">v1 을 서빙한다</text><rect x="366.0" y="352.0" width="164.0" height="149.0" rx="8" fill="#fdf3e7" stroke="#8a5a00" stroke-width="1.5"/><text x="378.0" y="380.2" font-size="18" font-weight="700" fill="#8a5a00" text-anchor="start">DGX</text><text x="378.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">원본을 보관하고</text><text x="378.0" y="423.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">MinerU 판독과</text><text x="378.0" y="444.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">LoRA 학습을 한다</text><text x="378.0" y="465.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">통합 메모리 121GB,</text><text x="378.0" y="486.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">디스크 3.7TB</text><rect x="542.0" y="352.0" width="164.0" height="149.0" rx="8" fill="#fdf3e7" stroke="#8a5a00" stroke-width="1.5"/><text x="554.0" y="380.2" font-size="18" font-weight="700" fill="#8a5a00" text-anchor="start">원본 보관 PC</text><text x="554.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업별 폴더로 학교</text><text x="554.0" y="423.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">실문서를 보관하고</text><text x="554.0" y="444.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">DGX 로 복사한다</text><path d="M32.0,269.0 L32.0,352.0" fill="none" stroke="#6b4fb3" stroke-width="2.0" marker-end="url(#head)"/><text x="42.0" y="294.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질의응답·문서 작성</text><text x="42.0" y="315.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">요청, 27B 의 도구</text><text x="42.0" y="336.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">선택과 답변 작성</text><path d="M208.0,269.0 L208.0,352.0" fill="none" stroke="#6b4fb3" stroke-width="2.0" marker-end="url(#head)"/><text x="218.0" y="294.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">새 문서 검토와 서류</text><text x="218.0" y="315.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">종류 판정, 검색</text><text x="218.0" y="336.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">임베딩과 리랭킹</text><path d="M378.0,352.0 L378.0,269.0" fill="none" stroke="#8a5a00" stroke-width="2.0" marker-end="url(#head)"/><path d="M394.0,269.0 L394.0,352.0" fill="none" stroke="#6b4fb3" stroke-width="2.0" marker-end="url(#head)"/><text x="404.0" y="294.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">↑ 판독 결과와 원본 목록</text><text x="404.0" y="315.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">↓ 승인된 학습 데이터</text><path d="M386.0,501.0 L386.0,521.0 L96.0,521.0" fill="none" stroke="#8a5a00" stroke-width="2.0"/><path d="M96.0,521.0 L96.0,501.0" fill="none" stroke="#8a5a00" stroke-width="2.0" marker-end="url(#head)"/><path d="M272.0,521.0 L272.0,501.0" fill="none" stroke="#8a5a00" stroke-width="2.0" marker-end="url(#head)"/><text x="184.0" y="543.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">학습된 모델</text><path d="M624.0,501.0 L624.0,521.0 L506.0,521.0" fill="none" stroke="#8a5a00" stroke-width="2.0"/><path d="M506.0,521.0 L506.0,501.0" fill="none" stroke="#8a5a00" stroke-width="2.0" marker-end="url(#head)"/><text x="614.0" y="543.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">학교 원본 복사</text><text x="14.0" y="574.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">화살표 색: 송신 장비의 색</text><rect x="203.3" y="561.0" width="16.0" height="16.0" rx="4" fill="#e8f0fe" stroke="#2f5fb3" stroke-width="1.5"/><text x="225.3" y="574.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사용자 쪽</text><rect x="301.7" y="561.0" width="16.0" height="16.0" rx="4" fill="#f1ecfb" stroke="#6b4fb3" stroke-width="1.5"/><text x="323.7" y="574.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">운영 플랫폼</text><rect x="414.5" y="561.0" width="16.0" height="16.0" rx="4" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="436.5" y="574.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">모델 서빙</text><rect x="512.9" y="561.0" width="16.0" height="16.0" rx="4" fill="#fdf3e7" stroke="#8a5a00" stroke-width="1.5"/><text x="534.9" y="574.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">원본·학습</text></svg>
