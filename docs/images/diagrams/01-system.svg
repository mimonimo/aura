<svg xmlns="http://www.w3.org/2000/svg" width="790" height="492" viewBox="0 0 790 492" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>AURA 전체 구성</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="790" height="492" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">전체 구성 — 장비와 하는 일</text><rect x="28" y="80" width="190" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="102" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">입력</text><text x="44" y="124" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">학교 원본 문서</text><text x="44" y="146" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">부서·사업 폴더의</text><text x="44" y="165" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">공고·계획서·보고서·규정</text><rect x="28" y="250" width="190" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="272" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">사용자</text><text x="44" y="294" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">교직원</text><text x="44" y="316" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">브라우저로 접속</text><text x="44" y="335" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">채팅·문서함·한글 기안기</text><text x="44" y="354" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 로그인·부서별 열람 범위</text><rect x="276" y="80" width="210" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="292" y="102" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">원본·처리·학습</text><text x="292" y="124" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">DGX</text><text x="292" y="146" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">원본 보관·동기화</text><text x="292" y="165" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">문서 일괄 읽기(MinerU OCR)</text><text x="292" y="184" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Writer LoRA 학습</text><text x="292" y="203" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· GB10 · 메모리 121GB</text><rect x="276" y="270" width="210" height="150" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="292" y="292" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">플랫폼·데이터</text><text x="292" y="314" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">운영 서버 (VM)</text><text x="292" y="336" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">AURA 웹 화면·API</text><text x="292" y="355" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">PostgreSQL · pgvector 색인</text><text x="292" y="374" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">지식 그래프 · 한글 기안기</text><text x="292" y="393" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 상시 가동, 외부 AI 호출 없음</text><rect x="560" y="80" width="200" height="132" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="576" y="102" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">실시간 모델</text><text x="576" y="124" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">젯슨 AGX 토르 02</text><text x="576" y="146" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Writer 27B (NVFP4)</text><text x="576" y="165" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">대화·초안·문서 에이전트</text><text x="576" y="184" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 사람이 기다리는 일</text><rect x="560" y="260" width="200" height="132" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="576" y="282" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">실시간 모델</text><text x="576" y="304" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">젯슨 AGX 토르 03</text><text x="576" y="326" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Writer 27B (NVFP4)</text><text x="576" y="345" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">반입 검토·이미지 판독</text><text x="576" y="364" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">임베딩·리랭커</text><path d="M218,136 L276,136" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="247.0" y="128" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">동기화</text><path d="M381,230 L381,270" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="440" y="254" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">읽은 문서·판정</text><path d="M218,330 L276,330" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="247.0" y="322" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">HTTPS</text><path d="M486,330 L523,330 L523,146 L560,146" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><path d="M486,345 L560,345" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><text x="660" y="241" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">모델 호출(교내망)</text><path d="M486,100 L560,100" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="523.0" y="92" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">학습본 이관</text><text x="28" y="452" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">학습본은 bf16 병합 → NVFP4 양자화 뒤 토르로 옮긴다. 작업본은 학교 Google Docs(선택)에 둘 수 있고,</text><text x="28" y="472" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">문서와 첨부는 교외 AI 서비스로 나가지 않는다.</text></svg>
