<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>LoRA 구조 개념도</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="920" height="470" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">LoRA — 고정 가중치 옆에 저랭크 행렬 두 개</text><rect x="28" y="186" width="100" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="78.0" y="221.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">입력 x</text><rect x="230" y="70" width="270" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="246" y="92" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">고정</text><text x="246" y="116" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">사전학습 가중치 W</text><text x="246" y="140" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">d × d 크기, 값을 바꾸지 않음</text><text x="246" y="160" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 학습하지 않음</text><polygon points="230,250 340,290 340,330 230,370" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><polygon points="390,290 500,250 500,370 390,330" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="276" y="316" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="middle">A</text><text x="454" y="316" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="middle">B</text><path d="M340,310 L390,310" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="365" y="300" font-size="13" font-weight="700" fill="#1b3b75" text-anchor="middle">r</text><text x="285" y="394" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">A : r × d, 학습함</text><text x="445" y="394" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">B : d × r, 학습함</text><text x="365" y="418" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">r 은 d 보다 훨씬 작다 (저랭크)</text><path d="M128,216 L180,216" fill="none" stroke="#94a3b8" stroke-width="1.3"/><path d="M180,216 L180,135 L230,135" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M180,216 L180,310 L230,310" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><circle cx="580" cy="216" r="18" fill="#ffffff" stroke="#1b3b75" stroke-width="1.3"/><text x="580" y="222" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="middle">+</text><path d="M500,135 L580,135 L580,198" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="540" y="127" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">Wx</text><path d="M500,310 L580,310 L580,234" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="540" y="302" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">BAx</text><path d="M598,216 L650,216" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="650" y="166" width="242" height="100" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="666" y="188" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">결과</text><text x="666" y="210" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">출력 h</text><text x="666" y="232" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">h = Wx + BAx</text><text x="28" y="448" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">학습 결과는 A·B 만 담은 작은 어댑터 파일로 남는다. 운영에 넣을 때는 W + BA 로 합쳐 한 모델로 쓴다.</text></svg>
