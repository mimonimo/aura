<svg xmlns="http://www.w3.org/2000/svg" width="720" height="407" viewBox="0 0 720 407" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>LoRA 구조 개념도</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="407" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">LoRA 구조</text><rect x="150.0" y="50.0" width="270.0" height="86.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="408.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">고정</text><text x="162.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">사전학습 가중치 W</text><text x="162.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">d × d 크기의 원래 가중치로,</text><text x="162.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">학습하는 동안 값을 바꾸지 않는다</text><polygon points="150,170 255,205 255,245 150,280" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><polygon points="315,205 420,170 420,280 315,245" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="192.0" y="232.0" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="middle">A</text><text x="378.0" y="232.0" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="middle">B</text><path d="M255.0,225.0 L315.0,225.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="285.0" y="215.0" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="middle">r</text><text x="202.0" y="304.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">A : r × d, 학습 대상</text><text x="368.0" y="304.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">B : d × r, 학습 대상</text><text x="150.0" y="330.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">r 은 d 보다 훨씬 작다 (저랭크)</text><rect x="14.0" y="129.0" width="92.0" height="60.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="60.0" y="165.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">입력 x</text><path d="M106.0,159.0 L126.0,159.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M126.0,159.0 L126.0,93.0 L150.0,93.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M126.0,159.0 L126.0,225.0 L150.0,225.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><circle cx="490" cy="159.0" r="20" fill="#ffffff" stroke="#1b3b75" stroke-width="2.2"/><text x="490.0" y="167.0" font-size="22" font-weight="700" fill="#1b3b75" text-anchor="middle">+</text><path d="M420.0,93.0 L490.0,93.0 L490.0,139.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="450.0" y="85.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Wx</text><path d="M420.0,225.0 L490.0,225.0 L490.0,179.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="452.0" y="217.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">BAx</text><rect x="530.0" y="126.5" width="176.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="154.3" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">결과</text><text x="542.0" y="154.7" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">출력 h</text><text x="542.0" y="176.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">h = Wx + BAx</text><path d="M510.0,159.0 L530.0,159.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="367.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">학습 결과는 A와 B만 담은 작은 어댑터 파일로 저장된다. 운영에 적용할 때는 W + BA 로 병합하여 하나의</text><text x="14.0" y="388.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">모델로 사용한다.</text></svg>
