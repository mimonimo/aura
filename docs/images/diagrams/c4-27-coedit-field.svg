<svg width="1060" height="658" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 658" role="img" aria-label="① 사람이 칸에 글을 칠 때" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fb3"/></marker>
<marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fb3"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker>
<marker id="arF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker>
</defs>
<rect width="1060" height="658" fill="#ffffff"/>
<text x="24" y="30" font-size="16" font-weight="700" fill="#1b2a41">① 사람이 칸에 글을 칠 때</text>
<text x="24" y="52" font-size="12.5" fill="#5b6b82">다른 사람 화면까지 약 0.2초, 한글 파일까지 몇 초</text>
<rect x="16" y="102" width="1028" height="158" rx="10" fill="#f7f9fc" stroke="#e6ebf2"/>
<text x="1030" y="119" font-size="11" font-weight="700" fill="#7a869a" text-anchor="end">쓰는 동안</text>
<rect x="16" y="264" width="1028" height="158" rx="10" fill="#fbfcfe" stroke="#e6ebf2"/>
<text x="1030" y="281" font-size="11" font-weight="700" fill="#7a869a" text-anchor="end">다른 화면에 보이기</text>
<rect x="16" y="426" width="1028" height="104" rx="10" fill="#f7f9fc" stroke="#e6ebf2"/>
<text x="1030" y="443" font-size="11" font-weight="700" fill="#7a869a" text-anchor="end">서식 바꿀 때</text>
<rect x="16" y="534" width="1028" height="50" rx="10" fill="#fbfcfe" stroke="#e6ebf2"/>
<text x="1030" y="551" font-size="11" font-weight="700" fill="#7a869a" text-anchor="end">파일에 남기기</text>
<rect x="232" y="64" width="176" height="36" rx="8" fill="#e8f0fe" stroke="#2f5fb3" stroke-opacity=".35"/>
<text x="320" y="80" font-size="13" font-weight="700" fill="#2f5fb3" text-anchor="middle">김가람 화면</text>
<text x="320" y="94" font-size="10.5" fill="#5f6b7a" text-anchor="middle">글을 쓰는 사람</text>
<line x1="320" y1="100" x2="320" y2="610" stroke="#2f5fb3" stroke-opacity=".22" stroke-width="2"/>
<rect x="452" y="64" width="176" height="36" rx="8" fill="#f1ecfb" stroke="#6b4fb3" stroke-opacity=".35"/>
<text x="540" y="80" font-size="13" font-weight="700" fill="#6b4fb3" text-anchor="middle">AURA 서버</text>
<text x="540" y="94" font-size="10.5" fill="#5f6b7a" text-anchor="middle">칸 글을 바로 저장</text>
<line x1="540" y1="100" x2="540" y2="610" stroke="#6b4fb3" stroke-opacity=".22" stroke-width="2"/>
<rect x="672" y="64" width="176" height="36" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-opacity=".35"/>
<text x="760" y="80" font-size="13" font-weight="700" fill="#2e7d4f" text-anchor="middle">이나래 화면</text>
<text x="760" y="94" font-size="10.5" fill="#5f6b7a" text-anchor="middle">같은 문서를 연 사람</text>
<line x1="760" y1="100" x2="760" y2="610" stroke="#2e7d4f" stroke-opacity=".22" stroke-width="2"/>
<rect x="862" y="64" width="176" height="36" rx="8" fill="#f1f3f5" stroke="#5f6b7a" stroke-opacity=".35"/>
<text x="950" y="80" font-size="13" font-weight="700" fill="#5f6b7a" text-anchor="middle">한글 파일</text>
<text x="950" y="94" font-size="10.5" fill="#5f6b7a" text-anchor="middle">hwpx</text>
<line x1="950" y1="100" x2="950" y2="610" stroke="#5f6b7a" stroke-opacity=".22" stroke-width="2"/>
<circle cx="44" cy="132" r="11" fill="#2f5fb3"/>
<text x="44" y="136" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="64" y="136" font-size="11.5" fill="#8a5a00" font-weight="600">0초</text>
<rect x="172" y="119" width="318" height="26" rx="8" fill="#ffffff" stroke="#2f5fb3" stroke-width="1.4"/>
<text x="331" y="136" font-size="12" fill="#1b2a41" text-anchor="middle">「요약」 칸에 글자를 친다 — 내 화면엔 바로</text>
<circle cx="44" cy="186" r="11" fill="#2f5fb3"/>
<text x="44" y="190" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="64" y="190" font-size="11.5" fill="#8a5a00" font-weight="600">바로</text>
<line x1="328" y1="192" x2="530" y2="192" stroke="#2f5fb3" stroke-width="2" marker-end="url(#arA)"/>
<text x="430" y="182" font-size="12" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">이 칸을 맡는다(다른 사람은 기다림)</text>
<circle cx="44" cy="240" r="11" fill="#2f5fb3"/>
<text x="44" y="244" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="64" y="244" font-size="11.5" fill="#8a5a00" font-weight="600">0.3초마다</text>
<line x1="328" y1="246" x2="530" y2="246" stroke="#2f5fb3" stroke-width="2" marker-end="url(#arA)"/>
<text x="430" y="236" font-size="12" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">쓰는 동안 바뀐 글자만 0.3초마다 보냄</text>
<circle cx="44" cy="294" r="11" fill="#6b4fb3"/>
<text x="44" y="298" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="64" y="298" font-size="11.5" fill="#8a5a00" font-weight="600">0.01초 안</text>
<rect x="404" y="281" width="271" height="26" rx="8" fill="#ffffff" stroke="#6b4fb3" stroke-width="1.4"/>
<text x="540" y="298" font-size="12" fill="#1b2a41" text-anchor="middle">받은 글을 저장하고 칸 판 번호를 올림</text>
<circle cx="44" cy="348" r="11" fill="#6b4fb3"/>
<text x="44" y="352" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="64" y="352" font-size="11.5" fill="#8a5a00" font-weight="600">바로</text>
<line x1="548" y1="354" x2="750" y2="354" stroke="#6b4fb3" stroke-width="2" marker-end="url(#arS)"/>
<text x="650" y="344" font-size="12" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">「요약」 칸이 바뀌었다고 알림</text>
<circle cx="44" cy="402" r="11" fill="#2e7d4f"/>
<text x="44" y="406" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<text x="64" y="406" font-size="11.5" fill="#8a5a00" font-weight="600">약 0.2초 뒤</text>
<rect x="618" y="382" width="283" height="40" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.4"/>
<text x="760" y="399" font-size="12" fill="#1b2a41" text-anchor="middle">입력이 0.3초 멈추면 그 칸에 넣음 ·</text>
<text x="760" y="414" font-size="12" fill="#1b2a41" text-anchor="middle">「김가람」 이름표</text>
<circle cx="44" cy="456" r="11" fill="#2f5fb3"/>
<text x="44" y="460" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="64" y="460" font-size="11.5" fill="#8a5a00" font-weight="600">0.7초 멈추면</text>
<line x1="328" y1="462" x2="530" y2="462" stroke="#2f5fb3" stroke-width="2" marker-end="url(#arA)"/>
<text x="430" y="452" font-size="12" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">글자 크기·색 같은 서식은 칸째 따로 보냄</text>
<circle cx="44" cy="510" r="11" fill="#6b4fb3"/>
<text x="44" y="514" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="64" y="514" font-size="11.5" fill="#8a5a00" font-weight="600">바로</text>
<line x1="548" y1="516" x2="750" y2="516" stroke="#6b4fb3" stroke-width="2" marker-end="url(#arS)"/>
<text x="650" y="506" font-size="12" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">서식째 그 칸을 바꿔 넣음</text>
<circle cx="44" cy="564" r="11" fill="#6b4fb3"/>
<text x="44" y="568" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
<text x="64" y="568" font-size="11.5" fill="#8a5a00" font-weight="600">3초 멈추면</text>
<line x1="548" y1="570" x2="940" y2="570" stroke="#6b4fb3" stroke-width="2" marker-end="url(#arS)"/>
<text x="745" y="560" font-size="12" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5">그 칸만 한글 파일에 저장(계속 쓰면 20초마다)</text>
<text x="24" y="638" font-size="12" fill="#5b6b82">제목·소제목·표 칸까지 문서 전체가 칸이다. 한 칸은 한 사람씩, 다른 칸은 여럿이 동시에. 어긋난 글은 충돌 사본으로 남긴다.</text>
</svg>
