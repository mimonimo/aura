<svg xmlns="http://www.w3.org/2000/svg" width="720" height="551" viewBox="0 0 720 551" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>① 사람이 편집 영역에 글을 칠 때</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="551" fill="#ffffff"/><defs><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5fb3"/></marker><marker id="arS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fb3"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="arF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">① 사람이 편집 영역에 글을 칠 때</text><text x="14.0" y="59.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">다른 사용자 화면까지 약 0.2초, 한글 파일까지 몇 초 소요</text><rect x="114.0" y="70.0" width="141.0" height="86.0" rx="8" fill="#e8f0fe" stroke="#2f5fb3" stroke-width="1.5"/><text x="184.5" y="98.2" font-size="18" font-weight="700" fill="#2f5fb3" text-anchor="middle">김가람 화면</text><text x="184.5" y="120.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">글을 작성하는</text><text x="184.5" y="141.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사용자</text><rect x="263.0" y="70.0" width="141.0" height="86.0" rx="8" fill="#f1ecfb" stroke="#6b4fb3" stroke-width="1.5"/><text x="333.5" y="98.2" font-size="18" font-weight="700" fill="#6b4fb3" text-anchor="middle">AURA 서버</text><text x="333.5" y="120.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">편집 영역 글을</text><text x="333.5" y="141.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">즉시 저장</text><rect x="412.0" y="70.0" width="141.0" height="86.0" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/><text x="482.5" y="98.2" font-size="18" font-weight="700" fill="#2e7d4f" text-anchor="middle">이나래 화면</text><text x="482.5" y="120.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">같은 문서를 연</text><text x="482.5" y="141.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사용자</text><rect x="561.0" y="70.0" width="141.0" height="86.0" rx="8" fill="#f1f3f5" stroke="#5f6b7a" stroke-width="1.5"/><text x="631.5" y="108.7" font-size="18" font-weight="700" fill="#5f6b7a" text-anchor="middle">한글 파일</text><text x="631.5" y="130.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">hwpx</text><rect x="14.0" y="159.0" width="692.0" height="111.0" rx="8" fill="#f1f4f9" stroke="#dfe5ee" stroke-width="1.5"/><text x="20.0" y="178.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">작성 중</text><rect x="14.0" y="268.0" width="692.0" height="112.0" rx="8" fill="#fafbfd" stroke="#dfe5ee" stroke-width="1.5"/><text x="20.0" y="287.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">다른 화면에</text><text x="20.0" y="308.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">표시</text><rect x="14.0" y="378.0" width="692.0" height="74.0" rx="8" fill="#f1f4f9" stroke="#dfe5ee" stroke-width="1.5"/><text x="20.0" y="397.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">서식 변경</text><rect x="14.0" y="450.0" width="692.0" height="38.0" rx="8" fill="#fafbfd" stroke="#dfe5ee" stroke-width="1.5"/><text x="20.0" y="469.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">파일 저장</text><line x1="184.5" y1="156" x2="184.5" y2="489" stroke="#2f5fb3" stroke-opacity=".3" stroke-width="2"/><line x1="333.5" y1="156" x2="333.5" y2="489" stroke="#6b4fb3" stroke-opacity=".3" stroke-width="2"/><line x1="482.5" y1="156" x2="482.5" y2="489" stroke="#2e7d4f" stroke-opacity=".3" stroke-width="2"/><line x1="631.5" y1="156" x2="631.5" y2="489" stroke="#5f6b7a" stroke-opacity=".3" stroke-width="2"/><rect x="114.0" y="164.0" width="438.7" height="31.0" rx="8" fill="#ffffff" stroke="#2f5fb3" stroke-width="2.2"/><text x="126.0" y="185.0" font-size="16" fill="#1f2937" text-anchor="start">① 「요약」 편집 영역에 글자 입력(내 화면에는 즉시 표시)<tspan font-weight="700" fill="#8a5a00"> · 0초</tspan></text><text x="314.6" y="215.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">② 이 편집 영역의 편집 잠금 획득(다른 사용자는 대기)<tspan font-weight="700" fill="#8a5a00"> · 즉시</tspan></text><line x1="190.5" y1="227.0" x2="324.5" y2="227.0" stroke="#2f5fb3" stroke-width="2.4" marker-end="url(#arA)"/><text x="291.4" y="251.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">③ 작성 중 변경된 글자만 0.3초마다 전송<tspan font-weight="700" fill="#8a5a00"> · 0.3초마다</tspan></text><line x1="190.5" y1="263.0" x2="324.5" y2="263.0" stroke="#2f5fb3" stroke-width="2.4" marker-end="url(#arA)"/><rect x="115.6" y="273.0" width="435.8" height="31.0" rx="8" fill="#ffffff" stroke="#6b4fb3" stroke-width="2.2"/><text x="127.6" y="294.0" font-size="16" fill="#1f2937" text-anchor="start">④ 받은 글을 저장하고 편집 영역 버전 번호 증가<tspan font-weight="700" fill="#8a5a00"> · 0.01초 이내</tspan></text><text x="408.0" y="324.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">⑤ 「요약」 편집 영역의 변경 알림<tspan font-weight="700" fill="#8a5a00"> · 즉시</tspan></text><line x1="339.5" y1="336.0" x2="473.5" y2="336.0" stroke="#6b4fb3" stroke-width="2.4" marker-end="url(#arS)"/><rect x="136.1" y="346.0" width="565.9" height="31.0" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="2.2"/><text x="148.1" y="367.0" font-size="16" fill="#1f2937" text-anchor="start">⑥ 입력이 0.3초 멈추면 편집 영역에 반영하고 「김가람」 이름표 표시<tspan font-weight="700" fill="#8a5a00"> · 약 0.2초 후</tspan></text><text x="344.8" y="397.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">⑦ 글자 크기·색 등 서식은 편집 영역 단위로 별도 전송<tspan font-weight="700" fill="#8a5a00"> · 0.7초 정지 시</tspan></text><line x1="190.5" y1="409.0" x2="324.5" y2="409.0" stroke="#2f5fb3" stroke-width="2.4" marker-end="url(#arA)"/><text x="408.0" y="433.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">⑧ 서식을 포함해 해당 편집 영역 교체<tspan font-weight="700" fill="#8a5a00"> · 즉시</tspan></text><line x1="339.5" y1="445.0" x2="473.5" y2="445.0" stroke="#6b4fb3" stroke-width="2.4" marker-end="url(#arS)"/><text x="447.4" y="469.0" font-size="16" fill="#1f2937" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">⑨ 해당 편집 영역만 한글 파일에 저장(계속 입력하면 20초마다)<tspan font-weight="700" fill="#8a5a00"> · 3초 정지 시</tspan></text><line x1="339.5" y1="481.0" x2="622.5" y2="481.0" stroke="#6b4fb3" stroke-width="2.4" marker-end="url(#arS)"/><text x="14.0" y="511.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">제목·소제목·표 셀까지 문서 전체가 편집 영역으로 구성된다. 한 편집 영역은 한 사람씩 수정하고, 서로</text><text x="14.0" y="532.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">다른 편집 영역은 여러 사람이 동시에 수정할 수 있다. 충돌한 글은 충돌 사본으로 보관한다.</text></svg>
