<svg width="1060" height="630" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 630" role="img" aria-label="① 사람이 칸에 글을 칠 때 — 다른 사람 화면까지 약 0.2초, 한글 파일까지 몇 초" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
<defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a80"/></marker></defs>
<rect width="1060" height="630" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#1b2a41">① 사람이 칸에 글을 칠 때 — 다른 사람 화면까지 약 0.2초, 한글 파일까지 몇 초</text>
<rect x="165" y="40" width="190" height="40" rx="8" fill="#f8fafc" stroke="#c9d3e0"/>
<text x="260" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">김가람 화면</text>
<text x="260" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">글을 쓰는 사람</text>
<line x1="260" y1="80" x2="260" y2="580" stroke="#d8dee8" stroke-dasharray="4 4"/>
<rect x="405" y="40" width="190" height="40" rx="8" fill="#eef3fb" stroke="#c9d3e0"/>
<text x="500" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">AURA 서버</text>
<text x="500" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">칸 글을 DB 에 저장</text>
<line x1="500" y1="80" x2="500" y2="580" stroke="#d8dee8" stroke-dasharray="4 4"/>
<rect x="645" y="40" width="190" height="40" rx="8" fill="#f8fafc" stroke="#c9d3e0"/>
<text x="740" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">이나래 화면</text>
<text x="740" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">같은 문서를 연 사람</text>
<line x1="740" y1="80" x2="740" y2="580" stroke="#d8dee8" stroke-dasharray="4 4"/>
<rect x="855" y="40" width="190" height="40" rx="8" fill="#f8fafc" stroke="#c9d3e0"/>
<text x="950" y="57" font-size="13" font-weight="700" fill="#1b2a41" text-anchor="middle">한글 파일</text>
<text x="950" y="73" font-size="10.5" fill="#6b778a" text-anchor="middle">hwpx</text>
<line x1="950" y1="80" x2="950" y2="580" stroke="#d8dee8" stroke-dasharray="4 4"/>
<text x="20" y="114" font-size="11" fill="#8a5a00" font-weight="600">0초</text>
<rect x="124" y="96" width="337" height="26" rx="6" fill="#fff8ec" stroke="#e8c98a"/>
<text x="292.5" y="114" font-size="11.5" fill="#3b4757" text-anchor="middle">「요약」 칸에 글자를 침 — 내 화면에는 바로 보임</text>
<text x="20" y="166" font-size="11" fill="#8a5a00" font-weight="600">바로</text>
<line x1="266" y1="162" x2="494" y2="162" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="380" y="155" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">이 칸 맡기 — 다른 사람은 이 칸을 기다림</text>
<text x="20" y="218" font-size="11" fill="#8a5a00" font-weight="600">0.3초마다</text>
<line x1="266" y1="214" x2="494" y2="214" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="380" y="207" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">쓰는 동안 0.3초마다 바뀐 부분만 보냄</text>
<text x="20" y="270" font-size="11" fill="#8a5a00" font-weight="600">0.01초 안</text>
<rect x="388" y="252" width="225" height="26" rx="6" fill="#fff8ec" stroke="#e8c98a"/>
<text x="500.0" y="270" font-size="11.5" fill="#3b4757" text-anchor="middle">DB 에 저장, 칸 버전 1 올림</text>
<text x="20" y="322" font-size="11" fill="#8a5a00" font-weight="600">바로</text>
<line x1="506" y1="318" x2="734" y2="318" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="620" y="311" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">알림: 「요약」 칸이 바뀜</text>
<text x="20" y="374" font-size="11" fill="#8a5a00" font-weight="600">약 0.2초 뒤</text>
<rect x="549" y="356" width="382" height="26" rx="6" fill="#fff8ec" stroke="#e8c98a"/>
<text x="740.0" y="374" font-size="11.5" fill="#3b4757" text-anchor="middle">입력이 0.3초 멈추면 그 칸에 반영 · 「김가람」 이름표</text>
<text x="20" y="426" font-size="11" fill="#8a5a00" font-weight="600">0.7초 멈추면</text>
<line x1="266" y1="422" x2="494" y2="422" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="380" y="415" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">서식은 칸째 JSON 블록으로 따로</text>
<text x="20" y="478" font-size="11" fill="#8a5a00" font-weight="600">바로</text>
<line x1="506" y1="474" x2="734" y2="474" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="620" y="467" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">검사해 다시 묶어 전달 → 서식째 바꿔 넣음</text>
<text x="20" y="530" font-size="11" fill="#8a5a00" font-weight="600">3초 뒤</text>
<line x1="506" y1="526" x2="944" y2="526" stroke="#3d5a80" stroke-width="1.6" marker-end="url(#ca)"/>
<text x="725" y="519" font-size="11.5" fill="#1b2a41" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4">입력이 3초 멈추면 그 칸만 파일에 저장(계속 쓰면 20초마다)</text>
<text x="20" y="608" font-size="11.5" fill="#5b6b82">제목·소제목·표 칸까지 문서 전체가 칸이다. 한 칸은 한 사람씩, 다른 칸은 여럿이 동시에. 어긋난 글은 충돌 사본으로 남긴다.</text>
</svg>
