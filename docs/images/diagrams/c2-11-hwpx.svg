<svg xmlns="http://www.w3.org/2000/svg" width="720" height="612" viewBox="0 0 720 612" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>HWPX 파일 구조와 서식 보존 채우기 위치</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="612" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">HWPX 파일 구조와 서식 보존 채우기가 손대는 곳</text><rect x="14.0" y="50.0" width="334.0" height="475.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="72.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">HWPX 파일 = ZIP 묶음 (OWPML)</text><rect x="22.0" y="84.0" width="318.0" height="48.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="32.0" y="103.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">mimetype</text><text x="32.0" y="124.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">첫 항목, 압축 없이 형식 표시</text><text x="330.0" y="103.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="end">그대로</text><rect x="22.0" y="136.0" width="318.0" height="48.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="32.0" y="155.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">version.xml · settings.xml</text><text x="32.0" y="176.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">버전 정보와 설정</text><text x="330.0" y="176.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="end">그대로</text><rect x="22.0" y="188.0" width="318.0" height="48.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="32.0" y="207.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">META-INF/</text><text x="32.0" y="228.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">묶음 목록(container·manifest)</text><text x="330.0" y="207.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="end">그대로</text><rect x="22.0" y="240.0" width="318.0" height="48.0" rx="8" fill="#ffffff" stroke="#7b8797" stroke-width="1.5"/><text x="32.0" y="259.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">Contents/content.hpf</text><text x="32.0" y="280.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">항목 목록</text><text x="330.0" y="280.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="end">그림 넣을 때 등록</text><rect x="22.0" y="292.0" width="318.0" height="69.0" rx="8" fill="#ffffff" stroke="#7b8797" stroke-width="1.5"/><text x="32.0" y="311.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">Contents/header.xml</text><text x="32.0" y="332.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">글꼴·문단·테두리 모양(스타일)</text><text x="32.0" y="353.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="start">필요한 모양만 더함</text><rect x="22.0" y="365.0" width="318.0" height="48.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="32.0" y="384.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">Contents/section0.xml …</text><text x="32.0" y="405.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">본문 구역: 문단·표·누름틀</text><text x="330.0" y="405.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="end">내용을 채움</text><rect x="22.0" y="417.0" width="318.0" height="48.0" rx="8" fill="#ffffff" stroke="#7b8797" stroke-width="1.5"/><text x="32.0" y="436.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">BinData/</text><text x="32.0" y="457.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">그림 바이트</text><text x="330.0" y="436.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="end">넣은 그림 추가</text><rect x="22.0" y="469.0" width="318.0" height="48.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="32.0" y="488.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">Preview/</text><text x="32.0" y="509.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">미리보기 글·그림</text><text x="330.0" y="488.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="end">그대로</text><rect x="378.0" y="50.0" width="328.0" height="475.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">확대</text><text x="390.0" y="78.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">구역 XML 안 (section0.xml)</text><path d="M340.0,389.0 L378.0,389.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="388.0" y="94.0" width="308.0" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="398.0" y="117.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;hp:p&gt;</text><text x="460.0" y="117.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">절 제목 문단</text><text x="686.0" y="117.0" font-size="16" font-weight="400" fill="#7b8797" text-anchor="end">그대로</text><rect x="388.0" y="136.0" width="308.0" height="79.0" rx="6" fill="#ffffff" stroke="#1b3b75" stroke-width="2.2" stroke-dasharray="6 4"/><text x="398.0" y="160.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="start">① 절 제목 뒤에 끼워 넣기</text><text x="398.0" y="181.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">새 문단·표·그림 XML 을 원본 바이트</text><text x="398.0" y="202.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">사이에 넣는다</text><rect x="388.0" y="223.0" width="308.0" height="117.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="398.0" y="247.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;hp:p&gt;</text><text x="460.0" y="247.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">누름틀이 든 문단</text><text x="398.0" y="277.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">fieldBegin</text><rect x="501.6" y="256.0" width="100.3" height="30.0" rx="5" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="551.8" y="277.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">사업명 자리</text><text x="686.0" y="277.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace">fieldEnd</text><text x="398.0" y="310.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">② 누름틀 안 글만 바꾼다 (누름틀 표시와</text><text x="398.0" y="331.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">모양은 그대로)</text><rect x="388.0" y="348.0" width="308.0" height="167.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="398.0" y="372.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start" font-family="'SF Mono', Menlo, Consolas, monospace">&lt;hp:tbl&gt;</text><text x="484.1" y="372.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">표: 행(tr) · 셀(tc)</text><rect x="398.0" y="383.0" width="96.0" height="30.0" rx="0" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="446.0" y="404.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">구분</text><rect x="494.0" y="383.0" width="96.0" height="30.0" rx="0" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="542.0" y="404.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">목표</text><rect x="590.0" y="383.0" width="96.0" height="30.0" rx="0" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="638.0" y="404.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">실적</text><rect x="398.0" y="413.0" width="96.0" height="30.0" rx="0" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="446.0" y="434.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">취업률</text><rect x="494.0" y="413.0" width="96.0" height="30.0" rx="0" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="542.0" y="434.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">셀 안 글</text><rect x="590.0" y="413.0" width="96.0" height="30.0" rx="0" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="638.0" y="434.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">셀 안 글</text><text x="398.0" y="465.0" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="start">③ 표 셀 안 글만 채운다</text><text x="398.0" y="486.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">테두리·셀 폭·글꼴 같은 표 속성은 원본</text><text x="398.0" y="507.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">그대로</text><text x="14.0" y="551.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">구역 XML 을 다시 직렬화하지 않고 원본 바이트를 그대로 둔다. ZIP 항목 순서와 압축 방식을 지키고,</text><text x="14.0" y="572.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">바뀐 항목만 다시 쓴다. 변환기로 새로 만든 한글 파일은 표 테두리·셀 폭·글꼴이 달라져 제출용으로 쓸 수</text><text x="14.0" y="593.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">없어서 이 방식을 쓴다.</text></svg>
