<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="600" viewBox="0 0 1110 600" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>HWPX 파일 구조와 서식 보존 채우기 위치</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1110" height="600" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">HWPX 파일 구조와 서식 보존 채우기가 손대는 곳</text><rect x="28" y="62" width="450" height="470" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="42" y="82" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">HWPX 파일 = ZIP 묶음 (OWPML)</text><rect x="44" y="94" width="418" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="58" y="114" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">mimetype</text><text x="58" y="132" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">첫 항목, 압축 없이 형식 표시</text><text x="450" y="122" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="end">그대로</text><rect x="44" y="148" width="418" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="58" y="168" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">version.xml · settings.xml</text><text x="58" y="186" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">판 정보와 설정</text><text x="450" y="176" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="end">그대로</text><rect x="44" y="202" width="418" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="58" y="222" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">META-INF/</text><text x="58" y="240" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">묶음 목록(container·manifest)</text><text x="450" y="230" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="end">그대로</text><rect x="44" y="256" width="418" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="58" y="276" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">Contents/content.hpf</text><text x="58" y="294" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">항목 목록</text><text x="450" y="284" font-size="11.5" font-weight="600" fill="#1b3b75" text-anchor="end">그림 넣을 때 등록</text><rect x="44" y="310" width="418" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="58" y="330" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">Contents/header.xml</text><text x="58" y="348" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">글꼴·문단·테두리 모양(스타일)</text><text x="450" y="338" font-size="11.5" font-weight="600" fill="#1b3b75" text-anchor="end">필요한 모양만 더함</text><rect x="44" y="364" width="418" height="46" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="58" y="384" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="700" fill="#1b3b75">Contents/section0.xml …</text><text x="58" y="402" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">본문 구역 — 문단·표·누름틀</text><text x="450" y="392" font-size="11.5" font-weight="600" fill="#1b3b75" text-anchor="end">내용을 채움</text><rect x="44" y="418" width="418" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/><text x="58" y="438" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">BinData/</text><text x="58" y="456" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">그림 바이트</text><text x="450" y="446" font-size="11.5" font-weight="600" fill="#1b3b75" text-anchor="end">넣은 그림 추가</text><rect x="44" y="472" width="418" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="58" y="492" font-size="12.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#1f2937">Preview/</text><text x="58" y="510" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">미리보기 글·그림</text><text x="450" y="500" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="end">그대로</text><rect x="530" y="62" width="552" height="470" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="546" y="84" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">확대</text><text x="546" y="106" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">구역 XML 안 (section0.xml)</text><path d="M462,387 L530,387" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="550" y="120" width="512" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="564" y="145" font-size="12" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#64748b">&lt;hp:p&gt;</text><text x="624" y="145" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">절 제목 문단 「1. 사업 개요」</text><text x="1050" y="145" font-size="11.5" font-weight="400" fill="#94a3b8" text-anchor="end">그대로</text><rect x="550" y="168" width="512" height="52" rx="6" fill="#ffffff" stroke="#1b3b75" stroke-width="1.3" stroke-dasharray="5 4"/><text x="564" y="190" font-size="13" font-weight="700" fill="#1b3b75" text-anchor="start">① 절 제목 뒤에 끼워 넣기</text><text x="564" y="209" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">새 문단·표·그림 XML 을 원본 바이트 사이에 넣는다</text><rect x="550" y="236" width="512" height="96" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="564" y="258" font-size="12" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#64748b">&lt;hp:p&gt;</text><text x="624" y="258" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">누름틀이 든 문단</text><text x="564" y="292" font-size="11.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#64748b">fieldBegin</text><rect x="654" y="274" width="250" height="28" rx="5" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="779" y="293" font-size="12.5" font-weight="600" fill="#1b3b75" text-anchor="middle">사업명이 들어갈 칸</text><text x="914" y="292" font-size="11.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#64748b">fieldEnd</text><text x="564" y="322" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">② 누름틀 안 글만 바꾼다 (누름틀 표시와 모양은 그대로)</text><rect x="550" y="348" width="512" height="164" rx="6" fill="#ffffff" stroke="#cbd5e1"/><text x="564" y="370" font-size="12" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="400" fill="#64748b">&lt;hp:tbl&gt;</text><text x="634" y="370" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">표 — 행(tr) · 칸(tc)</text><rect x="564" y="384" width="120" height="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="624.0" y="404" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">구분</text><rect x="684" y="384" width="120" height="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="744.0" y="404" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">목표</text><rect x="804" y="384" width="120" height="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="864.0" y="404" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">실적</text><rect x="564" y="414" width="120" height="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="624.0" y="434" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">취업률</text><rect x="684" y="414" width="120" height="30" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="744.0" y="434" font-size="12" font-weight="600" fill="#1b3b75" text-anchor="middle">칸 안 글</text><rect x="804" y="414" width="120" height="30" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="864.0" y="434" font-size="12" font-weight="600" fill="#1b3b75" text-anchor="middle">칸 안 글</text><text x="564" y="470" font-size="13" font-weight="700" fill="#1b3b75" text-anchor="start">③ 표 칸 안 글만 채운다</text><text x="564" y="490" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">테두리·칸 폭·글꼴 같은 표 속성은 원본 그대로</text><text x="28" y="560" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">구역 XML 을 다시 직렬화하지 않고 원본 바이트를 그대로 둔다. ZIP 항목 순서와 압축 방식을 지키고, 바뀐 항목만 다시 쓴다.</text><text x="28" y="580" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">변환기로 새로 만든 한글 파일은 표 테두리·칸 폭·글꼴이 달라져 제출용으로 쓸 수 없어서 이 방식을 쓴다.</text></svg>
