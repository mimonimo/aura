<svg xmlns="http://www.w3.org/2000/svg" width="720" height="489" viewBox="0 0 720 489" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>27B 질문 읽기와 그래프 범위 검색</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="489" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">질문 해석과 그래프 범위 검색</text><rect x="14.0" y="50.0" width="326.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="328.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">입력</text><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문과 사업 후보 목록</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문과 이름이 겹치는 사업을 후보로 골라</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">번호를 붙여 함께 전달한다</text><rect x="14.0" y="162.0" width="326.0" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="328.0" y="189.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">모델</text><text x="26.0" y="190.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">Writer 27B 질문 해석</text><text x="26.0" y="212.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">정해진 형식(JSON)으로만 답하게 하고, 같은</text><text x="26.0" y="233.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문은 10분 동안 결과를 재사용한다</text><path d="M177.0,136.0 L177.0,162.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="274.0" width="326.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="328.0" y="301.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">모델 출력</text><text x="26.0" y="302.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">해석 결과</text><text x="26.0" y="324.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 번호, 연도, 차수, 문서 종류, 따라갈</text><text x="26.0" y="345.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">관계</text><text x="26.0" y="366.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업은 후보 목록의 번호로만 고른다</text><path d="M177.0,248.0 L177.0,274.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="380.0" y="50.0" width="326.0" height="170.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="694.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">코드</text><text x="392.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">범위 결정</text><text x="392.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이름 일치와 모델 해석으로 사업을 정하고,</text><text x="392.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">대응·평가·앞뒤 단계·편입 관계를 따라 범위를</text><text x="392.0" y="142.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">넓힌다</text><text x="392.0" y="163.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">연도를 물으면 연도를 알 수 없는 문서는 뺀다</text><text x="392.0" y="184.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문이 문서나 절 이름을 가리키면 그 범위로</text><text x="392.0" y="205.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">좁힌다</text><rect x="380.0" y="246.0" width="326.0" height="128.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="694.0" y="273.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">코드</text><text x="392.0" y="274.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">범위 안 하이브리드 검색 (4.3)</text><text x="392.0" y="296.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">관계를 묻는 질문은 양쪽 문서에서 한 청크씩</text><text x="392.0" y="317.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">고른다</text><text x="392.0" y="338.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">절 단위로 찾은 청크도 열람 권한을 다시</text><text x="392.0" y="359.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">확인한다</text><path d="M543.0,220.0 L543.0,246.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="380.0" y="400.0" width="326.0" height="44.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="392.0" y="428.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">근거를 붙인 답변 생성</text><path d="M543.0,374.0 L543.0,400.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M340.0,327.5 L366.7,327.5 L366.7,194.0 L380.0,194.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M340.0,188.0 L353.3,188.0 L353.3,90.0 L380.0,90.0" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="14.0" y="470.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">점선은 모델 해석이 실패했을 때 이름 일치만으로 범위를 정하는 경로다.</text></svg>
