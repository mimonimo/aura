<svg xmlns="http://www.w3.org/2000/svg" width="980" height="790" viewBox="0 0 980 790" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>27B 질문 읽기와 그래프 범위 검색</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="790" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">27B 질문 읽기와 그래프 범위 검색 — 뜻은 모델이 읽고 탐색은 코드가</text><rect x="28" y="62" width="640" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="84" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">입력</text><text x="44" y="106" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">질문 + 사업 후보 목록 + 관계 7종</text><text x="44" y="128" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">사업 후보는 질문과 겹치는 사업, 번호를 붙여 건넴</text><rect x="28" y="180" width="640" height="84" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="202" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">모델</text><text x="44" y="224" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">Writer 27B 질문 읽기</text><text x="44" y="246" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">온도 0 · 출력 120토큰 · JSON 스키마 강제 · 같은 질문 10분 기억</text><rect x="28" y="298" width="640" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="320" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">모델이 낸 값</text><text x="44" y="342" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">{사업 번호, 연도, 차수, 종류, 따라갈 관계}</text><text x="44" y="364" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">종류는 계획 · 실적 · 평가, 사업은 목록 번호로만 받음</text><rect x="28" y="416" width="640" height="124" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="438" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">코드(결정적)</text><text x="44" y="460" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">범위 정하기</text><text x="44" y="482" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">이름 맞추기 + 모델 읽기 보탬 → 관계 따라 넓히기(짝 · 평가 · 앞뒤 단계 · 편입)</text><text x="44" y="501" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 연도를 물으면 연도 모르는 문서 제외</text><text x="44" y="520" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 「」로 묶은 이름이 문서 · 절 이름이면 그것으로 좁힘</text><rect x="28" y="574" width="640" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="596" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">코드</text><text x="44" y="618" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">범위 안 하이브리드 검색 (4.3)</text><text x="44" y="640" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">관계 질문은 양쪽 문서에서 한 조각씩</text><text x="44" y="659" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 절 축 조각도 권한을 다시 거름</text><rect x="28" y="712" width="640" height="52" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="738" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">근거 → 답</text><path d="M348,146 L348,180" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M348,264 L348,298" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M348,382 L348,416" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M348,540 L348,574" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M348,678 L348,712" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M668,222 L740,222 L740,478 L668,478" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="756" y="342" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">모델 읽기가 실패하면</text><text x="756" y="361" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">이름 맞추기로 물러남</text></svg>
