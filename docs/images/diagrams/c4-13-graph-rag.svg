<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>27B 질문 읽기와 그래프 범위 검색</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="450" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">27B 질문 읽기와 그래프 범위 검색: 뜻은 모델이 읽고 탐색은 코드가</text><rect x="14.0" y="50.0" width="326.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="328.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">입력</text><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문 + 사업 후보 목록 + 관계 7종</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 후보는 질문과 겹치는 사업, 번호를 붙여</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">건넴</text><rect x="14.0" y="162.0" width="326.0" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="328.0" y="189.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">모델</text><text x="26.0" y="190.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">Writer 27B 질문 읽기</text><text x="26.0" y="212.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">온도 0 · 출력 120토큰 · JSON 스키마 강제 ·</text><text x="26.0" y="233.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 질문 10분 기억</text><path d="M177.0,136.0 L177.0,162.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="274.0" width="326.0" height="131.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="300.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">모델이 낸 값</text><text x="26.0" y="323.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">{사업 번호, 연도, 차수, 종류, 따라갈</text><text x="26.0" y="347.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">관계}</text><text x="26.0" y="369.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">종류는 계획 · 실적 · 평가, 사업은 목록</text><text x="26.0" y="390.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">번호로만 받음</text><path d="M177.0,248.0 L177.0,274.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="380.0" y="50.0" width="326.0" height="149.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="694.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">코드(결정적)</text><text x="392.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">범위 정하기</text><text x="392.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이름 맞추기 + 모델 읽기 보탬 → 관계 따라</text><text x="392.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">넓히기(짝 · 평가 · 앞뒤 단계 · 편입)</text><text x="392.0" y="142.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 연도를 물으면 연도 모르는 문서 제외</text><text x="392.0" y="163.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 「」로 묶은 이름이 문서 · 절 이름이면</text><text x="392.0" y="184.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">그것으로 좁힘</text><rect x="380.0" y="225.0" width="326.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="694.0" y="252.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">코드</text><text x="392.0" y="253.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">범위 안 하이브리드 검색 (4.3)</text><text x="392.0" y="275.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">관계 질문은 양쪽 문서에서 한 청크씩</text><text x="392.0" y="296.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 절 축 청크도 권한을 다시 거름</text><path d="M543.0,199.0 L543.0,225.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="380.0" y="337.0" width="326.0" height="44.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="392.0" y="365.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">근거 → 답</text><path d="M543.0,311.0 L543.0,337.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M340.0,339.5 L353.3,339.5 L353.3,173.0 L380.0,173.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M340.0,188.0 L366.7,188.0 L366.7,114.5 L380.0,114.5" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="14.0" y="431.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">점선: 모델 읽기가 실패하면 이름 맞추기로 물러남</text></svg>
