<svg xmlns="http://www.w3.org/2000/svg" width="720" height="627" viewBox="0 0 720 627" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>검색의 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="627" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">검색의 흐름: 규정 검색과 사업 문서 검색</text><rect x="14.0" y="50.0" width="110.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="88.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문</text><rect x="150.0" y="50.0" width="200.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="162.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">입력 정리</text><text x="162.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">전각 → 반각</text><path d="M124.0,82.5 L150.0,82.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="376.0" y="50.0" width="330.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="388.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">RAG 공간 · 열람 조건</text><text x="388.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">검색 SQL 의 WHERE</text><path d="M350.0,82.5 L376.0,82.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M541.0,115.0 L541.0,141.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M541.0,128.0 L183.5,128.0 L183.5,141.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="141.0" width="339.0" height="371.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="163.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">규정 검색</text><rect x="367.0" y="141.0" width="339.0" height="371.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="379.0" y="163.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">사업 문서 검색: 그래프 범위 안(4.4)</text><rect x="26.0" y="173.0" width="152.5" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="201.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">어휘</text><text x="38.0" y="223.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Kiwi 명사 + 영문</text><text x="38.0" y="244.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">약칭, IDF</text><rect x="188.5" y="173.0" width="152.5" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="200.5" y="201.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">의미</text><text x="200.5" y="223.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Embed v2(토르</text><text x="200.5" y="244.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">03)</text><rect x="26.0" y="275.0" width="315.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="303.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">RRF 순위 융합</text><text x="38.0" y="325.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">k=60 · 어휘 0.4 · 의미 1.0</text><path d="M102.2,259.0 L102.2,275.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M264.8,259.0 L264.8,275.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="26.0" y="356.0" width="315.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="38.0" y="384.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">리랭커</text><text x="38.0" y="406.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">후보 20 → Rerank v1(토르 03)</text><path d="M183.5,340.0 L183.5,356.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="26.0" y="437.0" width="315.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="465.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">꼬리 버림</text><text x="38.0" y="487.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1위 점수의 0.25배 아래</text><path d="M183.5,421.0 L183.5,437.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="379.0" y="173.0" width="315.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="391.0" y="201.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">그래프 절 축 먼저</text><text x="391.0" y="223.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">묶어 적은 절 제목</text><rect x="379.0" y="275.0" width="152.5" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="391.0" y="303.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">어휘</text><text x="391.0" y="325.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">grant_lex(GIN)</text><rect x="541.5" y="275.0" width="152.5" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="553.5" y="303.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">의미</text><text x="553.5" y="325.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">grant_vec(HNSW)</text><path d="M455.2,259.0 L455.2,275.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M617.8,259.0 L617.8,275.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="379.0" y="356.0" width="315.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="391.0" y="384.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">RRF 순위 융합</text><text x="391.0" y="406.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 가중, 어휘 1위 청크 지킴</text><path d="M455.2,340.0 L455.2,356.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M617.8,340.0 L617.8,356.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="379.0" y="437.0" width="315.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="391.0" y="465.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">고르기</text><text x="391.0" y="487.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">버전 최종본만 · 문서당 2청크 · 상위 5</text><path d="M536.5,421.0 L536.5,437.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="540.0" width="440.0" height="44.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="442.0" y="567.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">규정 묶음 / 사업 문서 묶음</text><text x="26.0" y="568.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">근거 묶기</text><rect x="480.0" y="540.0" width="226.0" height="44.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="567.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">Writer 27B</text><text x="492.0" y="568.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">생성 (4.5)</text><path d="M183.5,512.0 L183.5,540.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M536.5,512.0 L536.5,525.0 L394.0,525.0 L394.0,540.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M454.0,562.0 L480.0,562.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="608.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">어휘 축은 색인과 질의가 같은 낱말 함수(lex_terms)를 쓴다. 리랭커는 규정 검색에만 쓴다.</text></svg>
