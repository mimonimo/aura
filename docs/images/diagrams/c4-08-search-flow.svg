<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>검색의 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="720" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">검색의 흐름 — 규정 검색과 사업 문서 검색</text><rect x="28" y="62" width="150" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">질문</text><rect x="214" y="62" width="250" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="230" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">입력 정리</text><text x="230" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">전각 → 반각</text><rect x="500" y="62" width="452" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="516" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">RAG 공간 · 열람 조건</text><text x="516" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">검색 SQL 의 WHERE</text><path d="M178,92 L214,92" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M464,92 L500,92" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M726,122 L726,160" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M726,140 L254,140 L254,160" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="160" width="452" h