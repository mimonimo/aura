<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>검색의 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="606" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">규정 검색과 사업 문서 검색 흐름</text><rect x="14.0" y="50.0" width="110.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="88.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문</text><rect x="150.0" y="50.0" width="200.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="162.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">입력 정리</text><text x="162.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">전각을 반각으로 통일</text><path d="M124.0,82.5 L150.0,82.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="376.0" y="50.0" width="330.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="388.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">검색 범위와 열람 조건</text><text x="388.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">RAG 공간과 열람 권한을 조건으로</text><path d="M350.0,82.5 L376.0,82.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M541.0,115.0 L541.0,141.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M541.0,128.0 L183.5,128.0 L183.5,141.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="141.0" width="339.0" height="350.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="163.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">규정 검색</text><rect x="367.0" y="141.0" width="339.0" height="350.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="379.0" y="163.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">사업 문서 검색: 그래프 범위 안(4.4)</text><rect x="26.0" y="173.0" width="152.5" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="201.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">어휘</text><text x="38.0" y="223.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">단어 색인 검색</text><rect x="188.5" y="173.0" width="152.5" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="200.5" y="201.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">의미</text><text x="200.5" y="223.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">벡터 색인 검색</text><rect x="26.0" y="254.0" width="315.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="282.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">RRF 순위 융합</text><text x="38.0" y="304.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">어휘 0.4, 의미 1.0 으로 합친다</text><path d="M102.2,238.0 L102.2,254.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M264.8,238.0 L264.8,254.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="26.0" y="335.0" width="315.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="38.0" y="363.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">리랭커</text><text x="38.0" y="385.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">상위 20개를 Rerank v1 로 재정렬</text><path d="M183.5,319.0 L183.5,335.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="26.0" y="416.0" width="315.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="444.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">하위 결과 제외</text><text x="38.0" y="466.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1위 점수의 4분의 1 미만은 뺀다</text><path d="M183.5,400.0 L183.5,416.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="379.0" y="173.0" width="315.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="391.0" y="201.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">그래프 절 우선</text><text x="391.0" y="223.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문이 가리키는 절부터 찾는다</text><rect x="379.0" y="254.0" width="152.5" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="391.0" y="282.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">어휘</text><text x="391.0" y="304.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">단어 색인 검색</text><rect x="541.5" y="254.0" width="152.5" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="553.5" y="282.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">의미</text><text x="553.5" y="304.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">벡터 색인 검색</text><path d="M455.2,238.0 L455.2,254.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M617.8,238.0 L617.8,254.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="379.0" y="335.0" width="315.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="391.0" y="363.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">RRF 순위 융합</text><text x="391.0" y="385.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">어휘 1위 청크는 남기며 합친다</text><path d="M455.2,319.0 L455.2,335.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M617.8,319.0 L617.8,335.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="379.0" y="416.0" width="315.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="391.0" y="444.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">최종 선택</text><text x="391.0" y="466.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">문서당 2개씩 상위 5개를 고른다</text><path d="M536.5,400.0 L536.5,416.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="519.0" width="440.0" height="44.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="442.0" y="546.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">규정 근거 / 사업 문서 근거</text><text x="26.0" y="547.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">근거 구성</text><rect x="480.0" y="519.0" width="226.0" height="44.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="546.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">Writer 27B</text><text x="492.0" y="547.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">생성 (4.5)</text><path d="M183.5,491.0 L183.5,519.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M536.5,491.0 L536.5,504.0 L394.0,504.0 L394.0,519.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M454.0,541.0 L480.0,541.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="587.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">색인할 때와 질문을 처리할 때 같은 방식으로 단어를 뽑으며, 리랭커는 규정 검색에만 적용한다.</text></svg>
