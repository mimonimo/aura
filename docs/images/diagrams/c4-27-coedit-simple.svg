<svg xmlns="http://www.w3.org/2000/svg" width="720" height="584" viewBox="0 0 720 584" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>영역 단위 공동 편집 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="584" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">영역 단위 공동 편집 흐름</text><text x="14.0" y="72.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">사람이 입력할 때</text><rect x="14.0" y="84.0" width="334.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="112.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">입력</text><text x="26.0" y="134.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">내 화면에는 바로 표시된다</text><path d="M181.0,149.0 L181.0,167.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="167.0" width="334.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="195.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">편집 잠금</text><text x="26.0" y="217.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">그 편집 영역을 먼저 잡은 사람만 고친다</text><path d="M181.0,232.0 L181.0,250.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="250.0" width="334.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="278.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">서버 저장</text><text x="26.0" y="300.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">바뀐 글자만 0.3초마다 보낸다</text><path d="M181.0,315.0 L181.0,333.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="333.0" width="334.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="361.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">다른 화면 표시</text><text x="26.0" y="383.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 문서를 연 화면에 약 0.2초 뒤 나타난다</text><path d="M181.0,398.0 L181.0,416.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="416.0" width="334.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="444.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">한글 파일 저장</text><text x="26.0" y="466.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">입력이 3초 멈추면 그 영역만 파일에 쓴다</text><text x="372.0" y="72.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">AURA가 절을 쓸 때</text><rect x="372.0" y="84.0" width="334.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="384.0" y="112.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">작성 요청</text><text x="384.0" y="134.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">담당자가 채팅에서 절 작성을 요청한다</text><path d="M539.0,149.0 L539.0,167.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="372.0" y="167.0" width="334.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="384.0" y="195.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">27B 초안</text><text x="384.0" y="217.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">절마다 근거를 찾아 초안을 쓴다(수 초)</text><path d="M539.0,232.0 L539.0,250.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="372.0" y="250.0" width="334.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="384.0" y="278.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">나누어 전송</text><text x="384.0" y="300.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사람과 같은 편집 영역 경로로 조금씩 보낸다</text><path d="M539.0,315.0 L539.0,333.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="372.0" y="333.0" width="334.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="384.0" y="361.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">다른 화면 표시</text><text x="384.0" y="383.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">열린 화면에 차례로 나타나고 그 위치로</text><text x="384.0" y="404.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이동한다</text><path d="M539.0,419.0 L539.0,437.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="372.0" y="437.0" width="334.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="384.0" y="465.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">파일 기록</text><text x="384.0" y="487.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">작성을 마치면 파일에 쓰고 잠금을 푼다</text><text x="14.0" y="538.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">편집 영역 하나는 한 사람씩 고치고, 서로 다른 영역은 여러 사람이 동시에 고칠 수 있다. 같은 영역에서</text><text x="14.0" y="559.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">겹친 글은 충돌 사본으로 보관한다.</text></svg>
