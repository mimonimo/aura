<svg xmlns="http://www.w3.org/2000/svg" width="720" height="461" viewBox="0 0 720 461" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>추측 디코딩 개념도</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="461" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">추측 디코딩: 예측 층이 짐작하고 본 모델이 검증한다</text><rect x="14.0" y="50.0" width="326.0" height="105.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="328.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">입력</text><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">지금까지의 문맥</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이미 확정된 토큰</text><rect x="26.0" y="113.0" width="64.0" height="30.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="58.0" y="133.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사업</text><rect x="98.0" y="113.0" width="96.0" height="30.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="146.0" y="133.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">계획서의</text><rect x="380.0" y="50.0" width="326.0" height="105.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="694.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">① 짐작</text><text x="392.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">예측 층 (MTP)</text><text x="392.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">작은 층이 다음 토큰 두 개를 미리 짐작</text><rect x="392.0" y="113.0" width="72.0" height="30.0" rx="6" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="428.0" y="133.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">목표</text><rect x="472.0" y="113.0" width="60.0" height="30.0" rx="6" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="502.0" y="133.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">는</text><path d="M340.0,90.0 L380.0,90.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="380.0" y="195.0" width="326.0" height="129.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="222.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">② 검증</text><text x="392.0" y="223.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">본 모델</text><text x="392.0" y="245.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">짐작한 두 자리를 한 번의 계산으로 확인</text><rect x="392.0" y="282.0" width="72.0" height="30.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="428.0" y="302.5" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">목표</text><text x="428.0" y="275.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">맞음</text><rect x="476.0" y="282.0" width="60.0" height="30.0" rx="6" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="506.0" y="302.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">는</text><line x1="482.0" y1="297.0" x2="530.0" y2="297.0" stroke="#4b5563" stroke-width="1.6"/><text x="506.0" y="275.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">틀림</text><rect x="548.0" y="282.0" width="60.0" height="30.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="578.0" y="302.5" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">와</text><text x="548.0" y="275.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">본 모델 토큰</text><path d="M543.0,155.0 L543.0,195.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="553.0" y="180.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">짐작 전달</text><rect x="14.0" y="195.0" width="326.0" height="129.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="328.0" y="222.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">③ 수락</text><text x="26.0" y="223.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">받아들인 결과</text><text x="26.0" y="245.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">한 번에 두 토큰</text><rect x="26.0" y="282.0" width="72.0" height="30.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="62.0" y="302.5" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">목표</text><rect x="106.0" y="282.0" width="60.0" height="30.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="136.0" y="302.5" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">와</text><path d="M380.0,235.0 L340.0,235.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M177.0,195.0 L177.0,155.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="187.0" y="180.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">문맥에 덧붙이고 다시 짐작</text><rect x="14.0" y="342.0" width="692.0" height="105.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="364.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">규칙</text><text x="26.0" y="392.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">맞은 자리는 수락</text><text x="206.0" y="392.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">짐작이 본 모델과 같으면 그대로 받는다</text><text x="26.0" y="413.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">틀린 자리부터는 버림</text><text x="206.0" y="413.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">그 자리는 본 모델 토큰으로 채운다</text><text x="26.0" y="434.0" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">출력 분포는 그대로</text><text x="206.0" y="434.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">검증을 본 모델이 하므로 맞힌 만큼만 빨라진다</text></svg>
