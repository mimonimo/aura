<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>추측 디코딩 개념도</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1040" height="420" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">추측 디코딩 — 예측 층이 짐작하고 본 모델이 검증한다</text><rect x="28" y="76" width="200" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="98" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">입력</text><text x="44" y="120" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">지금까지의 문맥</text><text x="44" y="142" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">이미 확정된 토큰</text><rect x="44" y="176" width="62" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="75.0" y="194.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">사업</text><rect x="112" y="176" width="96" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="160.0" y="194.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">계획서의</text><rect x="280" y="76" width="220" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="296" y="98" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">① 짐작</text><text x="296" y="120" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">예측 층 (MTP)</text><text x="296" y="142" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">작은 층이 다음 토큰</text><text x="296" y="161" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">두 개를 미리 짐작</text><rect x="298" y="196" width="80" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><text x="338.0" y="214.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">목표</text><rect x="386" y="196" width="80" height="28" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/><text x="426.0" y="214.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">는</text><rect x="552" y="76" width="250" height="160" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="568" y="98" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">② 검증</text><text x="568" y="120" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">본 모델</text><text x="568" y="142" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">짐작한 두 자리를</text><text x="568" y="161" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">한 번의 계산으로 확인</text><rect x="568" y="196" width="70" height="28" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="603.0" y="214.5" font-size="12.5" font-weight="600" fill="#1b3b75" text-anchor="middle">목표</text><rect x="646" y="196" width="52" height="28" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/><text x="672.0" y="214.5" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">는</text><line x1="654" y1="210.0" x2="690" y2="210.0" stroke="#64748b" stroke-width="1"/><rect x="706" y="196" width="80" height="28" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="746.0" y="214.5" font-size="12.5" font-weight="600" fill="#1b3b75" text-anchor="middle">와</text><text x="603" y="188" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">맞음</text><text x="672" y="188" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">틀림</text><text x="746" y="188" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">본 모델 토큰</text><rect x="854" y="76" width="158" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="870" y="98" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">③ 수락</text><text x="870" y="120" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">받아들인 결과</text><text x="870" y="142" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">한 번에 두 토큰</text><rect x="870" y="196" width="60" height="28" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="900.0" y="214.5" font-size="12.5" font-weight="600" fill="#1b3b75" text-anchor="middle">목표</text><rect x="936" y="196" width="60" height="28" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="966.0" y="214.5" font-size="12.5" font-weight="600" fill="#1b3b75" text-anchor="middle">와</text><path d="M228,156 L280,156" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M500,156 L552,156" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="526" y="148" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">짐작 전달</text><path d="M802,156 L854,156" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M933,236 L933,272 L128,272 L128,236" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="530" y="264" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">문맥에 덧붙이고 다시 짐작</text><rect x="28" y="296" width="984" height="82" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="42" y="316" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">규칙</text><text x="46" y="342" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">맞은 자리는 수락</text><text x="46" y="363" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">짐작이 본 모델과 같으면 그대로 받는다</text><text x="376" y="342" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">틀린 자리부터는 버림</text><text x="376" y="363" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">그 자리는 본 모델 토큰으로 채운다</text><text x="706" y="342" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="start">출력 분포는 그대로</text><text x="706" y="363" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">검증을 본 모델이 하므로 맞힌 만큼만 빨라진다</text></svg>
