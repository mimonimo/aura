<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>AURA 온톨로지</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="610" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 온톨로지: 노드 여덟 종류와 주요 관계</text><rect x="159.6" y="50.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="214.4" y="88.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">기관</text><text x="214.4" y="110.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">부처·지자체·</text><text x="214.4" y="131.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">전담기관</text><rect x="450.8" y="50.0" width="109.6" height="107.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="505.6" y="78.2" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle">문서</text><text x="505.6" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">같은</text><text x="505.6" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사업·연차의</text><text x="505.6" y="142.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">다른 문서</text><rect x="596.4" y="50.0" width="109.6" height="107.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="651.2" y="88.7" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle">절</text><text x="651.2" y="110.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">짝 문서·다음</text><text x="651.2" y="131.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">연차의 절</text><rect x="14.0" y="232.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="68.8" y="270.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">사업 묶음</text><text x="68.8" y="292.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사업 체계의</text><text x="68.8" y="313.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">큰 갈래</text><rect x="159.6" y="232.0" width="109.6" height="107.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="214.4" y="270.7" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="middle">사업</text><text x="214.4" y="292.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">재정지원</text><text x="214.4" y="313.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사업 하나</text><rect x="305.2" y="232.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="360.0" y="270.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">연차</text><text x="360.0" y="292.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">N차년도·</text><text x="360.0" y="313.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">연도</text><rect x="450.8" y="232.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="505.6" y="260.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">문서</text><text x="505.6" y="282.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">계획서·</text><text x="505.6" y="303.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">실적보고서·</text><text x="505.6" y="324.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">평가 …</text><rect x="596.4" y="232.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="651.2" y="270.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">절</text><text x="651.2" y="292.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">문서의 목차</text><text x="651.2" y="313.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">항목</text><rect x="14.0" y="414.0" width="109.6" height="107.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="68.8" y="452.7" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle">사업</text><text x="68.8" y="474.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">앞·뒤 단계,</text><text x="68.8" y="495.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">다른 사업</text><rect x="305.2" y="414.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="360.0" y="452.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">성과지표</text><text x="360.0" y="474.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">기준·목표·</text><text x="360.0" y="495.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">실적·달성률</text><rect x="596.4" y="414.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="651.2" y="442.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">단위과제</text><text x="651.2" y="464.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">여러 문서에</text><text x="651.2" y="485.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">되풀이되는</text><text x="651.2" y="506.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">과제</text><path d="M123.6,285.5 L159.6,285.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="141.6" y="276.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">포함</text><path d="M269.2,285.5 L305.2,285.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="287.2" y="276.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">포함</text><path d="M414.8,285.5 L450.8,285.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="432.8" y="276.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">포함</text><path d="M560.4,285.5 L596.4,285.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="578.4" y="276.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">포함</text><path d="M173.6,232.0 L173.6,157.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="181.6" y="179.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">주관 부처 ·</text><text x="181.6" y="200.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">전담기관</text><path d="M464.8,232.0 L464.8,157.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="472.8" y="179.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">계획 → 실적 ·</text><text x="472.8" y="200.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">평가</text><path d="M610.4,232.0 L610.4,157.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="618.4" y="179.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">계획↔실적 짝,</text><text x="618.4" y="200.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">연차 이어짐</text><path d="M173.6,339.0 L173.6,467.5 L123.6,467.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="181.6" y="361.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">후속 ·</text><text x="181.6" y="382.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">편입 ·</text><text x="181.6" y="403.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">연관</text><path d="M259.2,339.0 L259.2,436.0 L305.2,436.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="313.2" y="361.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">성과지표 둠</text><path d="M464.8,339.0 L464.8,467.5 L414.8,467.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="472.8" y="361.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">지표 값(측정)</text><path d="M651.2,339.0 L651.2,414.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="643.2" y="361.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">같은</text><text x="643.2" y="382.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">단위과제</text><text x="14.0" y="549.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">점선 상자는 같은 종류의 다른 노드다. 관계마다 기준(구조·분류·식별자 일치·추출·유사도)과 근거(문서·절</text><text x="14.0" y="570.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">위치 또는 외부 출처 URL)를 달고, 근거를 댈 수 없는 관계는 만들지 않는다. 후속·편입·주관</text><text x="14.0" y="591.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">부처·전담기관은 외부 확인 대장에서, 연관은 문서 근거에서 온다.</text></svg>
