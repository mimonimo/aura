<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>AURA 온톨로지</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1080" height="580" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">AURA 온톨로지 — 노드 여덟 종류와 주요 관계</text><rect x="28" y="236" width="150" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="103.0" y="263.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">사업 묶음</text><text x="103.0" y="282.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">사업 체계의 큰 갈래</text><rect x="238" y="236" width="150" height="60" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="313.0" y="263.0" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="middle">사업</text><text x="313.0" y="282.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">재정지원 사업 하나</text><rect x="448" y="236" width="150" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="523.0" y="263.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">연차</text><text x="523.0" y="282.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">N차년도·연도</text><rect x="658" y="236" width="150" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="733.0" y="263.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">문서</text><text x="733.0" y="282.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">계획서·실적보고서·평가 …</text><rect x="868" y="236" width="150" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="943.0" y="263.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">절</text><text x="943.0" y="282.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">문서의 목차 항목</text><path d="M178,266 L238,266" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="208.0" y="258" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">포함</text><path d="M388,266 L448,266" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="418.0" y="258" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">포함</text><path d="M598,266 L658,266" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="628.0" y="258" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">포함</text><path d="M808,266 L868,266" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="838.0" y="258" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">포함</text><rect x="238" y="80" width="150" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="313.0" y="107.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">기관</text><text x="313.0" y="126.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">부처·지자체·전담기관</text><path d="M313,236 L313,140" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="398" y="192" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">주관 부처 · 전담기관</text><rect x="658" y="80" width="150" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/><text x="733.0" y="107.0" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">문서</text><text x="733.0" y="126.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">같은 사업·연차의 다른 문서</text><path d="M733,236 L733,140" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="806" y="192" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">계획 → 실적 · 평가</text><rect x="868" y="80" width="150" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/><text x="943.0" y="107.0" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">절</text><text x="943.0" y="126.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">짝 문서·다음 연차의 절</text><path d="M943,236 L943,140" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="992" y="184" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">계획↔실적 짝</text><text x="992" y="200" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">연차 이어짐</text><rect x="28" y="420" width="150" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/><text x="103.0" y="447.0" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">사업</text><text x="103.0" y="466.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">앞·뒤 단계, 다른 사업</text><path d="M278,296 L278,450 L178,450" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="228" y="442" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">후속 · 편입 · 연관</text><rect x="448" y="420" width="150" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="523.0" y="447.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">성과지표</text><text x="523.0" y="466.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">기준·목표·실적·달성률</text><path d="M348,296 L348,440 L448,440" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="408" y="432" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">성과지표 둠</text><path d="M733,296 L733,450 L598,450" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="678" y="442" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">지표 값(측정)</text><rect x="868" y="420" width="150" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="943.0" y="447.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">단위과제</text><text x="943.0" y="466.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">여러 문서에 되풀이되는 과제</text><path d="M943,296 L943,420" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="996" y="364" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">같은 단위과제</text><text x="28" y="530" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">점선 상자는 같은 종류의 다른 노드다. 관계마다 기준(구조·분류·식별자 일치·추출·유사도)과 근거(문서·절 위치 또는 외부 출처 URL)를 달고,</text><text x="28" y="550" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">근거를 댈 수 없는 관계는 만들지 않는다. 후속·편입·주관 부처·전담기관은 외부 확인 장부에서, 연관은 문서 근거에서 온다.</text></svg>
