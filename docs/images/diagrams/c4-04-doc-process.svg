<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>문서 한 건의 처리 순서</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="630" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">문서 한 건의 처리 순서: 형식별 읽기 뒤에는 모두 같은 길</text><rect x="14.0" y="50.0" width="692.0" height="65.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">원본 파일</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">실제 형식 확인(확장자가 없거나 틀리면 파일 머리로)</text><rect x="52.0" y="127.0" width="654.0" height="71.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="168.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">디지털 PDF</text><text x="214.0" y="147.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">표본 6쪽 글자 충분 · 깨진 글자 비율 &lt; 0.15</text><text x="214.0" y="168.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">pdfium 글자 좌표 텍스트 레이어 추출 + MinerU 구조(표 · 2단 · 읽기</text><text x="214.0" y="189.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">순서) 위에 원본 글자 덮어쓰기</text><path d="M32.0,162.5 L52.0,162.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="203.0" width="654.0" height="50.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="233.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">스캔 PDF</text><text x="214.0" y="223.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">쪽당 200자 미만 또는 깨진 글자 ≥ 0.15</text><text x="214.0" y="244.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">기본 MinerU, 짧으면 27B 이미지 판독(최대 30쪽)</text><path d="M32.0,228.0 L52.0,228.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="258.0" width="654.0" height="29.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="278.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">사진</text><text x="214.0" y="278.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">27B 이미지 판독 → MinerU OCR → tesseract</text><path d="M32.0,272.5 L52.0,272.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="292.0" width="654.0" height="29.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="312.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">hwp</text><text x="214.0" y="312.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">kordoc(버전 고정) → 실패 시 pyhwp</text><path d="M32.0,306.5 L52.0,306.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="326.0" width="654.0" height="29.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="346.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">hwpx</text><text x="214.0" y="346.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">자체 OWPML 파서(표 · 글상자 · 머리말)</text><path d="M32.0,340.5 L52.0,340.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="360.0" width="654.0" height="50.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="379.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">docx · xlsx ·</text><text x="64.0" y="401.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">pptx</text><text x="214.0" y="380.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">쪽당 60자 미만이면 MinerU 로 다시</text><text x="214.0" y="401.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">kordoc → python-docx · openpyxl · python-pptx</text><path d="M32.0,385.0 L52.0,385.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="415.0" width="654.0" height="50.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="445.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">옛 형식</text><text x="214.0" y="435.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">xls · doc · ppt · hwp3</text><text x="214.0" y="456.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">LibreOffice 로 새 형식 변환 뒤 위의 길</text><path d="M32.0,440.0 L52.0,440.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M32.0,115.0 L32.0,440.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><rect x="14.0" y="488.0" width="692.0" height="128.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="510.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">형식별 읽기 다음</text><path d="M360.0,465.0 L360.0,488.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="26.0" y="520.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="101.2" y="541.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">표 정리</text><path d="M176.5,536.0 L198.5,536.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="198.5" y="520.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="273.8" y="541.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">개인정보(4.2)</text><path d="M349.0,536.0 L371.0,536.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="371.0" y="520.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="446.2" y="541.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">청크 나누기</text><path d="M521.5,536.0 L543.5,536.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="543.5" y="520.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="618.8" y="541.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">서류 종류(27B)</text><path d="M618.8,552.0 L618.8,563.0 L101.2,563.0 L101.2,574.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="26.0" y="574.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="101.2" y="595.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사업 분류</text><path d="M176.5,590.0 L198.5,590.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="198.5" y="574.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="273.8" y="595.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">버전 묶기</text><path d="M349.0,590.0 L371.0,590.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="371.0" y="574.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="446.2" y="595.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">문서 이름</text><path d="M521.5,590.0 L543.5,590.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="543.5" y="574.0" width="150.5" height="32.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="618.8" y="595.5" font-size="16" font-weight="400" fill="#1b3b75" text-anchor="middle">색인(4.3) · 그래프(4.4)</text></svg>
