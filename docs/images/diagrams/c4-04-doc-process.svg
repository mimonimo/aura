<svg xmlns="http://www.w3.org/2000/svg" width="720" height="630" viewBox="0 0 720 630" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>문서 한 건의 처리 순서</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="630" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">문서 한 건의 처리 순서</text><rect x="14.0" y="50.0" width="692.0" height="65.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">원본 파일</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">확장자가 없거나 틀려도 파일 첫머리를 읽어 실제 형식을 판별한다</text><rect x="52.0" y="127.0" width="654.0" height="71.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="168.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">디지털 PDF</text><text x="214.0" y="147.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">앞 6쪽에 글자가 충분하고 깨진 글자가 15% 미만일 때</text><text x="214.0" y="168.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">텍스트 레이어에서 글자를 그대로 꺼내고, MinerU 가 찾은 표와 읽기</text><text x="214.0" y="189.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">순서에 그 글자를 채운다</text><path d="M32.0,162.5 L52.0,162.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="203.0" width="654.0" height="50.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="233.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">스캔 PDF</text><text x="214.0" y="223.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">쪽당 글자가 200자 미만이거나 깨진 글자가 15% 이상일 때</text><text x="214.0" y="244.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">MinerU 로 OCR 하고, 30쪽 이하의 짧은 문서는 27B 가 이미지를 읽는다</text><path d="M32.0,228.0 L52.0,228.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="258.0" width="654.0" height="29.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="278.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">사진</text><text x="214.0" y="278.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">27B 가 이미지를 읽고, 실패하면 OCR 도구로 넘긴다</text><path d="M32.0,272.5 L52.0,272.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="292.0" width="654.0" height="29.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="312.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">한글(hwp)</text><text x="214.0" y="312.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">한글 문서 변환기로 읽고, 실패하면 예비 변환기를 쓴다</text><path d="M32.0,306.5 L52.0,306.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="326.0" width="654.0" height="29.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="346.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">한글(hwpx)</text><text x="214.0" y="346.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">자체 변환기로 표와 글상자, 머리말까지 읽는다</text><path d="M32.0,340.5 L52.0,340.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="360.0" width="654.0" height="50.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="390.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">오피스 문서</text><text x="214.0" y="380.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">워드·엑셀·파워포인트</text><text x="214.0" y="401.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">문서 변환기로 읽고, 쪽당 60자 미만이면 MinerU 로 다시 읽는다</text><path d="M32.0,385.0 L52.0,385.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="52.0" y="415.0" width="654.0" height="50.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="64.0" y="445.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">옛 형식</text><text x="214.0" y="435.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">xls·doc·ppt 와 옛 한글 파일</text><text x="214.0" y="456.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">LibreOffice 로 새 형식으로 바꾼 뒤 위 경로로 처리한다</text><path d="M32.0,440.0 L52.0,440.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M32.0,115.0 L32.0,440.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><rect x="14.0" y="488.0" width="692.0" height="128.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="510.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">형식별 읽기 이후 단계</text><path d="M360.0,465.0 L360.0,488.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="26.0" y="520.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="101.2" y="541.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">표 정리</text><path d="M176.5,536.0 L198.5,536.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="198.5" y="520.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="273.8" y="541.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">개인정보 마스킹</text><path d="M349.0,536.0 L371.0,536.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="371.0" y="520.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="446.2" y="541.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">청크 분할</text><path d="M521.5,536.0 L543.5,536.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="543.5" y="520.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="618.8" y="541.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">서류 종류 판정</text><path d="M618.8,552.0 L618.8,563.0 L101.2,563.0 L101.2,574.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="26.0" y="574.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="101.2" y="595.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사업 분류</text><path d="M176.5,590.0 L198.5,590.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="198.5" y="574.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="273.8" y="595.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">버전 그룹화</text><path d="M349.0,590.0 L371.0,590.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="371.0" y="574.0" width="150.5" height="32.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="446.2" y="595.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">문서 이름 결정</text><path d="M521.5,590.0 L543.5,590.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="543.5" y="574.0" width="150.5" height="32.0" rx="6" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="618.8" y="595.5" font-size="16" font-weight="700" fill="#1b3b75" text-anchor="middle">색인과 그래프 등록</text></svg>
