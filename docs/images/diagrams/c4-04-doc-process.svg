<svg xmlns="http://www.w3.org/2000/svg" width="980" height="740" viewBox="0 0 980 740" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>문서 한 건의 처리 순서</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="740" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">문서 한 건의 처리 순서 — 형식별 읽기 뒤에는 모두 같은 길</text><rect x="28" y="62" width="420" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">원본 파일</text><text x="44" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">실제 형식 확인(확장자가 없거나 틀리면 파일 머리로)</text><line x1="48" y1="126" x2="48" y2="497" stroke="#94a3b8" stroke-width="1.3"/><path d="M48,173 L70,173" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="150" width="882" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="86" y="178" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">디지털 PDF</text><text x="250" y="169" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">표본 6쪽 글자 충분 · 깨진 글자 비율 &lt; 0.15</text><text x="250" y="187" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">pdfium 글자 좌표 직독 + MinerU 구조(표 · 2단 · 읽기 순서) 위에 원본 글자 덮어쓰기</text><path d="M48,227 L70,227" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="204" width="882" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="86" y="232" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">스캔 PDF</text><text x="250" y="223" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">쪽당 200자 미만 또는 깨진 글자 ≥ 0.15</text><text x="250" y="241" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">기본 MinerU, 짧으면 27B 이미지 판독(최대 30쪽)</text><path d="M48,281 L70,281" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="258" width="882" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="86" y="286" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">사진</text><text x="250" y="286" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">27B 이미지 판독 → MinerU OCR → tesseract</text><path d="M48,335 L70,335" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="312" width="882" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="86" y="340" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">hwp</text><text x="250" y="340" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">kordoc(판 고정) → 실패 시 pyhwp</text><path d="M48,389 L70,389" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="366" width="882" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="86" y="394" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">hwpx</text><text x="250" y="394" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">자체 OWPML 파서(표 · 글상자 · 머리말)</text><path d="M48,443 L70,443" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="420" width="882" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="86" y="448" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">docx · xlsx · pptx</text><text x="250" y="439" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">쪽당 60자 미만이면 MinerU 로 다시</text><text x="250" y="457" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">kordoc → python-docx · openpyxl · python-pptx</text><path d="M48,497 L70,497" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="70" y="474" width="882" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/><text x="86" y="502" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">옛 형식</text><text x="250" y="493" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">xls · doc · ppt · hwp3</text><text x="250" y="511" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">LibreOffice 로 새 형식 변환 뒤 위의 길</text><rect x="28" y="558" width="924" height="152" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="42" y="578" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">형식별 읽기 다음</text><path d="M490,520 L490,558" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="56" y="590" width="190" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="151.0" y="611.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">표 정리</text><path d="M246,607 L288,607" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="288" y="590" width="190" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="383.0" y="611.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">개인정보(4.2)</text><path d="M478,607 L520,607" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="520" y="590" width="190" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="615.0" y="611.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">조각 나누기</text><path d="M710,607 L752,607" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="752" y="590" width="190" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="847.0" y="611.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">서류 종류(27B)</text><path d="M847.0,624 L847.0,636 L151.0,636 L151.0,652" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="56" y="652" width="190" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="151.0" y="673.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">사업 분류</text><path d="M246,669 L288,669" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="288" y="652" width="190" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="383.0" y="673.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">판본 묶기</text><path d="M478,669 L520,669" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="520" y="652" width="190" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="615.0" y="673.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">문서 이름</text><path d="M710,669 L752,669" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="752" y="652" width="190" height="34" rx="7" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.3"/><text x="847.0" y="673.5" font-size="12.5" font-weight="600" fill="#1b3b75" text-anchor="middle">색인(4.3) · 그래프(4.4)</text></svg>
