<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" viewBox="0 0 1180 440" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>RRF 하이브리드 검색 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1180" height="440" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">RRF 하이브리드 검색 — 두 축의 순위를 섞고 다시 줄 세운다</text><rect x="28" y="166" width="132" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="192" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">질문</text><text x="44" y="214" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">사업 약칭·규정 이름</text><text x="44" y="233" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">+ 뜻으로 찾을 말</text><rect x="184" y="62" width="412" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="198" y="82" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">어휘 축</text><rect x="184" y="226" width="412" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="198" y="246" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">의미 축</text><rect x="200" y="92" width="176" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="216" y="118" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">낱말 뽑기</text><text x="216" y="140" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">형태소 분석(Kiwi)</text><text x="216" y="159" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">명사·영문 약칭</text><rect x="404" y="92" width="176" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="420" y="118" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">전문 색인 검색</text><text x="420" y="140" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">GIN 색인</text><text x="420" y="159" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">드문 낱말에 무게(IDF)</text><rect x="200" y="256" width="176" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="216" y="282" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">임베딩</text><text x="216" y="304" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">문장 → 1,024차원</text><text x="216" y="323" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">벡터(KURE 기반)</text><rect x="404" y="256" width="176" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="420" y="282" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">벡터 색인 검색</text><text x="420" y="304" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">pgvector HNSW</text><text x="420" y="323" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">가까운 이웃 찾기</text><path d="M160,200 L180,200 L180,140 L200,140" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M160,228 L180,228 L180,304 L200,304" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M376,140 L404,140" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M376,304 L404,304" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="632" y="150" width="200" height="128" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="648" y="176" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">순위 융합 (RRF)</text><text x="648" y="198" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">어휘 순위 + 의미 순위</text><text x="648" y="217" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Σ 가중 / (k + 순위)</text><text x="648" y="236" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">k=60 · 어휘 0.4 · 의미 1.0</text><path d="M580,140 L606,140 L606,196 L632,196" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M580,304 L606,304 L606,232 L632,232" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="856" y="150" width="168" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="872" y="176" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">리랭커</text><text x="872" y="198" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">질문과 조각을</text><text x="872" y="217" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">함께 읽어 다시</text><text x="872" y="236" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">줄 세움(교차 인코더)</text><rect x="1054" y="150" width="100" height="128" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="1070" y="176" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">상위 근거</text><text x="1070" y="198" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">답의</text><text x="1070" y="217" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">재료</text><path d="M832,214 L856,214" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M1024,214 L1054,214" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="940" y="300" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">규정 검색에서 씀</text><text x="28" y="410" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">두 검색의 점수는 척도가 달라 그대로 더하지 않고 순위로 섞는다. 사업 문서 쪽은 어휘 1위 조각이 섞은 순위에서 밀리지 않게 지킨다.</text></svg>
