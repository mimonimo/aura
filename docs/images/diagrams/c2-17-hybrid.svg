<svg xmlns="http://www.w3.org/2000/svg" width="720" height="549" viewBox="0 0 720 549" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>RRF 하이브리드 검색 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="549" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">RRF 하이브리드 검색: 두 축의 순위를 섞고 다시 줄 세운다</text><rect x="208.0" y="50.0" width="498.0" height="128.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="220.0" y="72.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">어휘 축</text><rect x="220.0" y="82.0" width="215.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="232.0" y="110.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">낱말 뽑기</text><text x="232.0" y="132.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">형태소 분석(Kiwi)</text><text x="232.0" y="153.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">명사·영문 약칭</text><rect x="465.0" y="82.0" width="215.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="477.0" y="110.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">전문 색인 검색</text><text x="477.0" y="132.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">GIN 색인</text><text x="477.0" y="153.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">드문 낱말에 무게(IDF)</text><path d="M435.0,125.0 L465.0,125.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="208.0" y="190.0" width="498.0" height="128.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="220.0" y="212.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">의미 축</text><rect x="220.0" y="222.0" width="215.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="232.0" y="250.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">임베딩</text><text x="232.0" y="272.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">문장 → 1,024차원</text><text x="232.0" y="293.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">벡터(KURE 기반)</text><rect x="465.0" y="222.0" width="215.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="477.0" y="250.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">벡터 색인 검색</text><text x="477.0" y="272.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">pgvector HNSW</text><text x="477.0" y="293.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">가까운 이웃 찾기</text><path d="M435.0,265.0 L465.0,265.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="141.0" width="160.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="169.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문</text><text x="26.0" y="191.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 약칭·규정 이름</text><text x="26.0" y="212.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">+ 뜻으로 찾을 말</text><path d="M174.0,184.0 L190.0,184.0 L190.0,125.0 L220.0,125.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M174.0,184.0 L190.0,184.0 L190.0,265.0 L220.0,265.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="352.0" width="250.0" height="107.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="380.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">순위 융합 (RRF)</text><text x="26.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">어휘 순위 + 의미 순위</text><text x="26.0" y="423.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Σ 가중 / (k + 순위)</text><text x="26.0" y="444.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">k=60 · 어휘 0.4 · 의미 1.0</text><rect x="294.0" y="352.0" width="220.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="306.0" y="380.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">리랭커</text><text x="306.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문과 청크를 함께 읽어 다시</text><text x="306.0" y="423.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">줄 세움(교차 인코더)</text><rect x="544.0" y="352.0" width="162.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="556.0" y="380.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">상위 근거</text><text x="556.0" y="402.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">답의 재료</text><path d="M264.0,405.5 L294.0,405.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M514.0,405.5 L544.0,405.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M680.0,125.0 L698.0,125.0 L698.0,265.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M680.0,265.0 L698.0,265.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M698.0,265.0 L698.0,336.0 L139.0,336.0 L139.0,352.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="404.0" y="481.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">규정 검색에서 씀</text><text x="14.0" y="509.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">두 검색의 점수는 척도가 달라 그대로 더하지 않고 순위로 섞는다. 사업 문서 쪽은 어휘 1위 청크가 섞은</text><text x="14.0" y="530.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">순위에서 밀리지 않게 지킨다.</text></svg>
