<svg xmlns="http://www.w3.org/2000/svg" width="720" height="591" viewBox="0 0 720 591" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>RRF 하이브리드 검색 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="591" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">RRF 하이브리드 검색 과정</text><rect x="208.0" y="50.0" width="498.0" height="149.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="220.0" y="72.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">어휘 축</text><rect x="220.0" y="82.0" width="215.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="232.0" y="110.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">단어 추출</text><text x="232.0" y="132.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">형태소 분석기(Kiwi)로</text><text x="232.0" y="153.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">명사와 영문 약칭을 뽑는다</text><rect x="465.0" y="82.0" width="215.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="477.0" y="110.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">단어 색인 검색</text><text x="477.0" y="132.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 단어가 든 청크를 찾고,</text><text x="477.0" y="153.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">드문 단어일수록 높은 점수를</text><text x="477.0" y="174.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">준다</text><path d="M435.0,135.5 L465.0,135.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="208.0" y="211.0" width="498.0" height="149.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="220.0" y="233.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">의미 축</text><rect x="220.0" y="243.0" width="215.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="232.0" y="271.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">임베딩</text><text x="232.0" y="293.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문을 1,024차원 벡터로</text><text x="232.0" y="314.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">바꾼다(KURE 기반)</text><rect x="465.0" y="243.0" width="215.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="477.0" y="271.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">벡터 색인 검색</text><text x="477.0" y="293.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">pgvector 색인에서 의미가</text><text x="477.0" y="314.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">가장 가까운 청크를 찾는다</text><path d="M435.0,296.5 L465.0,296.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="151.5" width="160.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="179.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문</text><text x="26.0" y="201.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 약칭이나 규정</text><text x="26.0" y="222.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이름과 의미로 찾을</text><text x="26.0" y="243.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">표현이 섞인 질문</text><path d="M174.0,205.0 L190.0,205.0 L190.0,135.5 L220.0,135.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M174.0,205.0 L190.0,205.0 L190.0,296.5 L220.0,296.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="394.0" width="250.0" height="107.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="422.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">순위 융합 (RRF)</text><text x="26.0" y="444.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">두 검색의 순위를 점수로 바꾸어</text><text x="26.0" y="465.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">가중 합산한다(어휘 0.4, 의미</text><text x="26.0" y="486.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1.0)</text><rect x="294.0" y="394.0" width="220.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="306.0" y="422.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">리랭커</text><text x="306.0" y="444.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">질문과 청크를 함께 읽어</text><text x="306.0" y="465.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">순위를 다시 매긴다</text><rect x="544.0" y="394.0" width="162.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="556.0" y="422.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">상위 근거</text><text x="556.0" y="444.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">답변 생성에 사용할</text><text x="556.0" y="465.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">상위 청크</text><path d="M264.0,447.5 L294.0,447.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M514.0,447.5 L544.0,447.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M680.0,135.5 L698.0,135.5 L698.0,296.5" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M680.0,296.5 L698.0,296.5" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M698.0,296.5 L698.0,378.0 L139.0,378.0 L139.0,394.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="404.0" y="523.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">규정 검색에만 적용</text><text x="14.0" y="551.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">두 검색의 점수는 척도가 달라 그대로 더하지 않고 순위로 융합한다. 사업 문서 검색에서는 어휘 검색 1위</text><text x="14.0" y="572.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">청크가 융합 순위에서 밀려나지 않도록 보장한다.</text></svg>
