<svg xmlns="http://www.w3.org/2000/svg" width="720" height="612" viewBox="0 0 720 612" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>온톨로지의 노드와 관계</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="612" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">온톨로지의 노드와 관계</text><rect x="14.0" y="234.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="68.8" y="293.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">사업군</text><rect x="159.6" y="234.0" width="109.6" height="107.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="214.4" y="293.7" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="middle">사업</text><rect x="305.2" y="234.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="360.0" y="293.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">연차</text><rect x="450.8" y="234.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="505.6" y="272.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">문서</text><text x="505.6" y="294.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">서류 종류가</text><text x="505.6" y="315.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">하위 분류</text><rect x="596.4" y="234.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="651.2" y="293.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">절</text><path d="M123.6,287.5 L159.6,287.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M269.2,287.5 L305.2,287.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M414.8,287.5 L450.8,287.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M560.4,287.5 L596.4,287.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="159.6" y="50.0" width="109.6" height="107.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="214.4" y="88.7" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle">사업</text><text x="214.4" y="110.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">앞 · 뒤 단계</text><text x="214.4" y="131.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">사업</text><path d="M214.4,234.0 L214.4,157.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="206.4" y="179.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">succeeded_by ·</text><text x="206.4" y="200.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">integrated_into (외부 확인</text><text x="206.4" y="221.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">대장)</text><rect x="305.2" y="50.0" width="109.6" height="107.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="360.0" y="88.7" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle">문서</text><text x="360.0" y="110.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">계획서 ↔</text><text x="360.0" y="131.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">실적보고서</text><path d="M472.8,234.0 L472.8,195.5 L360.0,195.5 L360.0,157.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)" marker-start="url(#tail)"/><text x="368.0" y="177.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">plans_reports</text><text x="368.0" y="215.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">(계획↔실적)</text><rect x="450.8" y="50.0" width="109.6" height="107.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="505.6" y="99.2" font-size="18" font-weight="700" fill="#4b5563" text-anchor="middle">문서(평가)</text><text x="505.6" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">평가 문서</text><path d="M538.4,157.0 L538.4,234.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="546.4" y="179.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">evaluates</text><rect x="159.6" y="418.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="214.4" y="456.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">기관</text><text x="214.4" y="478.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">부처 ·</text><text x="214.4" y="499.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">전담기관</text><path d="M214.4,341.0 L214.4,418.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="206.4" y="363.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">supervised_by · managed_by</text><rect x="450.8" y="418.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="505.6" y="446.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">성과지표</text><text x="505.6" y="468.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">기준 · 목표 ·</text><text x="505.6" y="489.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">실적 ·</text><text x="505.6" y="510.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">달성률</text><path d="M505.6,341.0 L505.6,418.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="497.6" y="363.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">측정(표 셀에서 읽은 값)</text><rect x="596.4" y="418.0" width="109.6" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="651.2" y="477.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">단위과제</text><path d="M651.2,341.0 L651.2,418.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="643.2" y="363.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">같은</text><text x="643.2" y="384.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">사업에서</text><text x="643.2" y="405.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">되풀이</text><text x="14.0" y="551.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">가로 화살표는 contains. 관계마다 기준(구조 · 분류 · 식별자 일치 · 추출 · 유사도 가운데 하나)과</text><text x="14.0" y="572.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">근거(문서 · 절 위치 또는 외부 출처 URL)를 단다. 점선 상자는 같은 종류의 다른 노드다. 그래프를 다시</text><text x="14.0" y="593.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">지을 때마다 SHACL 규칙(graph/shapes.ttl)으로 검사한다.</text></svg>
