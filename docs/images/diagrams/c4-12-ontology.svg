<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>온톨로지의 노드와 관계</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="560" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">온톨로지의 노드와 관계</text><rect x="28" y="236" width="140" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="98.0" y="271.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">사업 묶음</text><rect x="223" y="236" width="140" height="60" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="293.0" y="271.0" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="middle">사업</text><rect x="418" y="236" width="140" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="488.0" y="271.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">연차</text><rect x="613" y="236" width="140" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="683.0" y="263.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">문서</text><text x="683.0" y="282.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">서류 종류가 하위 분류</text><rect x="808" y="236" width="140" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="878.0" y="271.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">절</text><path d="M168,266 L223,266" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="195.5" y="258" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">contains</text><path d="M363,266 L418,266" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="390.5" y="258" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">contains</text><path d="M558,266 L613,266" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="585.5" y="258" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">contains</text><path d="M753,266 L808,266" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="780.5" y="258" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">contains</text><rect x="223" y="76" width="140" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/><text x="293.0" y="103.0" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">사업</text><text x="293.0" y="122.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">앞 · 뒤 단계 사업</text><path d="M293,236 L293,136" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="215" y="182" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="end">succeeded_by · integrated_into</text><text x="215" y="200" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="end">(외부 확인 장부)</text><rect x="418" y="76" width="140" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/><text x="488.0" y="103.0" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">문서</text><text x="488.0" y="122.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">계획서 ↔ 실적보고서</text><path d="M653,236 L653,176 L488,176 L488,136" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)" marker-start="url(#tail)"/><text x="570.5" y="168" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">plans_reports (계획↔실적)</text><rect x="613" y="76" width="140" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/><text x="683.0" y="103.0" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">문서(평가)</text><text x="683.0" y="122.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">평가 문서</text><path d="M718,136 L718,236" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="726" y="196" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">evaluates</text><rect x="223" y="396" width="140" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="293.0" y="423.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">기관</text><text x="293.0" y="442.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">부처 · 전담기관</text><path d="M293,296 L293,396" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="215" y="338" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="end">supervised_by · managed_by</text><rect x="613" y="396" width="140" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="683.0" y="423.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">성과지표</text><text x="683.0" y="442.0" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">기준 · 목표 · 실적 · 달성률</text><path d="M683,296 L683,396" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="691" y="338" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">측정(표 칸에서 읽은 값)</text><rect x="808" y="396" width="140" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="878.0" y="431.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">단위과제</text><path d="M878,296 L878,396" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="886" y="330" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">같은 사업에서</text><text x="886" y="348" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">되풀이</text><text x="28" y="504" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">관계마다 기준(구조 · 분류 · 식별자 일치 · 추출 · 유사도 가운데 하나)과 근거(문서 · 절 위치 또는 외부 출처 URL)를 단다.</text><text x="28" y="524" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">점선 상자는 같은 종류의 다른 노드다. 그래프를 다시 지을 때마다 SHACL 규칙(graph/shapes.ttl)으로 검사한다.</text></svg>
