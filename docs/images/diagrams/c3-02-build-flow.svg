<svg xmlns="http://www.w3.org/2000/svg" width="720" height="626" viewBox="0 0 720 626" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>구축 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="626" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">구축 흐름: 수집에서 색인 · 그래프까지</text><rect x="14.0" y="50.0" width="200.0" height="107.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">학교 원본</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">학습 장비 · 읽기 전용 연결</text><rect x="240.0" y="50.0" width="274.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="252.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">원본 대장</text><text x="252.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">archive_files · 원본 하나가 한 줄</text><text x="252.0" y="121.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 10분 주기 목록 비교: 새로 · 바뀜 ·</text><text x="252.0" y="142.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">옮김 · 없어짐</text><rect x="540.0" y="50.0" width="166.0" height="107.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="552.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">업로드 · 채팅 첨부</text><text x="552.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">구글 드라이브</text><text x="552.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">가져오기</text><path d="M214.0,103.5 L240.0,103.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="179.0" width="692.0" height="281.0" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="203.0" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">하나의 처리기</text><text x="140.6" y="203.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">DocumentProcessor: 모든 길이 거침</text><path d="M377.0,157.0 L377.0,179.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M623.0,157.0 L623.0,179.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="26.0" y="213.0" width="668.0" height="52.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="213.0" width="136.0" height="52.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="244.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">① 형식별 읽기</text><text x="174.0" y="234.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">디지털 PDF 텍스트 레이어 · MinerU · 27B 이미지 판독 · kordoc · hwpx</text><text x="174.0" y="255.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">파서 · 오피스</text><rect x="26.0" y="271.0" width="668.0" height="31.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="271.0" width="136.0" height="31.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="292.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">② 표 정리</text><text x="174.0" y="292.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">셀 격자 [행, 열, 병합, 머리 셀, 글] → 화면용 HTML 표 / 검색용 평문</text><rect x="26.0" y="308.0" width="668.0" height="31.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="308.0" width="136.0" height="31.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="329.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">③ 개인정보</text><text x="174.0" y="329.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Presidio + 한국형 인식기 8종, 「내부 마스킹 설정」은 항목별(기본 꺼짐)</text><rect x="26.0" y="345.0" width="668.0" height="31.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="345.0" width="136.0" height="31.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="366.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">④ 청크 나누기</text><text x="174.0" y="366.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">블록 단위(최대 2,000자), 규정은 조문 단위, 쪽 번호 · 절 제목 경로</text><rect x="26.0" y="382.0" width="668.0" height="31.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="382.0" width="136.0" height="31.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="403.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">⑤ 판정</text><text x="174.0" y="403.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서류 종류(27B, 토르 03) · 사업 분류(대장 + 27B) · 문서 이름(본문 제목)</text><rect x="26.0" y="419.0" width="668.0" height="31.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="419.0" width="136.0" height="31.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="440.0" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">⑥ 버전 묶기</text><text x="174.0" y="440.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">제목 열쇠 + 8자 단위 문자열 겹침(0.95 이상 같은 내용, 그 아래 버전)</text><rect x="14.0" y="484.0" width="213.3" height="128.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="512.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">어휘 색인</text><text x="26.0" y="534.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Kiwi 명사 · IDF</text><text x="26.0" y="555.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">규정 / 사업 문서(GIN) 따로</text><path d="M360.0,460.0 L360.0,472.0 L120.7,472.0 L120.7,484.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="253.3" y="484.0" width="213.3" height="128.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="265.3" y="512.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">의미 색인</text><text x="265.3" y="534.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">Embed v2 → pgvector</text><text x="265.3" y="555.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">HNSW</text><text x="265.3" y="576.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">1분 주기</text><path d="M360.0,460.0 L360.0,472.0 L360.0,472.0 L360.0,484.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="492.7" y="484.0" width="213.3" height="128.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="504.7" y="512.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">지식 그래프</text><text x="504.7" y="534.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 &gt; 연차 &gt; 문서 &gt; 절</text><text x="504.7" y="555.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">계획↔실적 · 앞뒤 단계 ·</text><text x="504.7" y="576.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">SHACL 검사</text><text x="504.7" y="597.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 15분 안 다시 지음</text><path d="M360.0,460.0 L360.0,472.0 L599.3,472.0 L599.3,484.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/></svg>
