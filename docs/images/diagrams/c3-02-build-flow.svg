<svg xmlns="http://www.w3.org/2000/svg" width="720" height="546" viewBox="0 0 720 546" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>문서 구축 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="546" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">문서 구축 흐름</text><text x="14.0" y="65.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">문서가 들어오는 경로</text><rect x="14.0" y="74.0" width="165.5" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="96.8" y="96.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">학교 원본 폴더 동기화</text><rect x="189.5" y="74.0" width="165.5" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="272.2" y="96.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">문서함 업로드</text><rect x="365.0" y="74.0" width="165.5" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="447.8" y="96.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">채팅 첨부</text><rect x="540.5" y="74.0" width="165.5" height="34.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="623.2" y="96.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">구글 드라이브 가져오기</text><path d="M96.8,108.0 L96.8,121.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M272.2,108.0 L272.2,121.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M447.8,108.0 L447.8,121.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M623.2,108.0 L623.2,121.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M96.8,121.0 L623.2,121.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M360.0,121.0 L360.0,134.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="134.0" width="692.0" height="272.0" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="159.0" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">하나의 처리기</text><text x="140.6" y="159.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">모든 경로의 문서가 같은 순서로 처리된다</text><rect x="26.0" y="172.0" width="668.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="172.0" width="176.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="193.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">① 읽기</text><text x="214.0" y="193.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">파일 형식에 맞는 방법으로 글과 표를 읽어 낸다(스캔 문서는 OCR).</text><rect x="26.0" y="210.0" width="668.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="210.0" width="176.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="231.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">② 표 정리</text><text x="214.0" y="231.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">병합된 셀을 풀어 화면용 표와 검색용 평문을 만든다.</text><rect x="26.0" y="248.0" width="668.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="248.0" width="176.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="269.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">③ 개인정보 마스킹</text><text x="214.0" y="269.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">이름·연락처 같은 개인정보를 찾아 설정에 따라 마스킹한다.</text><rect x="26.0" y="286.0" width="668.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="286.0" width="176.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="307.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">④ 청크 나누기</text><text x="214.0" y="307.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">검색 단위로 나누고 쪽 번호와 절 제목을 함께 기록한다.</text><rect x="26.0" y="324.0" width="668.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="324.0" width="176.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="345.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">⑤ 분류</text><text x="214.0" y="345.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">서류 종류와 사업을 판정하고 본문 제목을 문서 이름으로 정한다.</text><rect x="26.0" y="362.0" width="668.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="26.0" y="362.0" width="176.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="38.0" y="383.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">⑥ 버전 묶기</text><text x="214.0" y="383.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">내용이 같은 문서와 고쳐 쓴 문서를 한 버전 그룹으로 묶는다.</text><path d="M360.0,406.0 L360.0,422.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><path d="M123.3,422.0 L596.7,422.0" fill="none" stroke="#7b8797" stroke-width="2.0"/><rect x="14.0" y="436.0" width="218.7" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="464.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">어휘 색인</text><text x="26.0" y="486.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">낱말이 겹치는 글을 찾는 색인</text><path d="M123.3,422.0 L123.3,436.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="250.7" y="436.0" width="218.7" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="262.7" y="464.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">의미 색인</text><text x="262.7" y="486.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">뜻이 비슷한 글을 찾는 색인</text><path d="M360.0,422.0 L360.0,436.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="487.3" y="436.0" width="218.7" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="499.3" y="464.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">지식 그래프</text><text x="499.3" y="486.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업·연차·문서·절의 관계</text><path d="M596.7,422.0 L596.7,436.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="527.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">원본 폴더에서 문서가 추가되거나 바뀌면 그 문서만 다시 처리하고, 색인과 그래프도 함께 갱신한다.</text></svg>
