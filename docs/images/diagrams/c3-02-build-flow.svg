<svg xmlns="http://www.w3.org/2000/svg" width="980" height="790" viewBox="0 0 980 790" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>구축 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="790" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">구축 흐름 — 반입에서 색인 · 그래프까지</text><rect x="28" y="62" width="320" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">학교 원본</text><text x="44" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">학습 장비 · 읽기 전용 연결</text><rect x="632" y="62" width="320" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="648" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">업로드 · 채팅 첨부</text><text x="648" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">구글 드라이브 가져오기</text><rect x="28" y="196" width="320" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="222" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">원본 장부</text><text x="44" y="244" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">archive_files · 원본 하나가 한 줄</text><path d="M188,134 L188,196" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="200" y="162" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">10분 주기 목록 비교</text><text x="200" y="180" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">새로 · 바뀜 · 옮김 · 없어짐</text><rect x="632" y="196" width="320" height="72" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="648" y="222" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">하나의 처리기</text><text x="648" y="244" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">DocumentProcessor — 모든 길이 거침</text><path d="M348,232 L632,232" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M792,134 L792,196" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="296" width="924" height="344" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="42" y="316" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">처리기 안의 단계</text><path d="M792,268 L792,296" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="46" y="328" width="888" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="46" y="328" width="150" height="40" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="353.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">① 형식별 읽기</text><text x="212" y="352.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">디지털 PDF 글자층 · MinerU · 27B 이미지 판독 · kordoc · hwpx 파서 · 오피스</text><path d="M121,368 L121,380" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="46" y="380" width="888" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="46" y="380" width="150" height="40" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="405.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">② 표 정리</text><text x="212" y="404.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">칸 격자 [행, 열, 병합, 머리칸, 글] → 화면용 HTML 표 / 검색용 평문</text><path d="M121,420 L121,432" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="46" y="432" width="888" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="46" y="432" width="150" height="40" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="457.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">③ 개인정보</text><text x="212" y="456.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Presidio + 한국형 인식기 8종, 「내부 마스킹 설정」은 항목별(기본 꺼짐)</text><path d="M121,472 L121,484" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="46" y="484" width="888" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="46" y="484" width="150" height="40" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="509.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">④ 조각 나누기</text><text x="212" y="508.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">블록 단위(최대 2,000자), 규정은 조문 단위, 쪽 번호 · 절 제목 경로</text><path d="M121,524 L121,536" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="46" y="536" width="888" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="46" y="536" width="150" height="40" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="561.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">⑤ 판정</text><text x="212" y="560.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">서류 종류(27B, 토르 03) · 사업 분류(장부 + 27B) · 문서 이름(본문 제목)</text><path d="M121,576 L121,588" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="46" y="588" width="888" height="40" rx="9" fill="#ffffff" stroke="#cbd5e1"/><rect x="46" y="588" width="150" height="40" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="60" y="613.0" font-size="13.5" font-weight="700" fill="#1b3b75" text-anchor="start">⑥ 판본 묶기</text><text x="212" y="612.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">제목 열쇠 + 8자 조각 겹침(0.95 이상 같은 내용, 그 아래 판본)</text><rect x="28" y="676" width="296" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="702" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">어휘 색인</text><text x="44" y="724" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Kiwi 명사 · IDF</text><text x="44" y="743" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">규정 / 사업 문서(GIN) 따로</text><path d="M490,640 L490,658 L176.0,658 L176.0,676" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="342" y="676" width="296" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="358" y="702" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">의미 색인</text><text x="358" y="724" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Embed v2 → pgvector HNSW</text><text x="358" y="743" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">1분 주기</text><path d="M490,640 L490,658 L490.0,658 L490.0,676" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="656" y="676" width="296" height="100" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="672" y="702" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">지식 그래프</text><text x="672" y="724" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">사업 &gt; 연차 &gt; 문서 &gt; 절</text><text x="672" y="743" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">계획↔실적 · 앞뒤 단계 · SHACL 검사</text><text x="672" y="762" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 15분 안 다시 지음</text><path d="M490,640 L490,658 L804.0,658 L804.0,676" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/></svg>
