<svg xmlns="http://www.w3.org/2000/svg" width="720" height="516" viewBox="0 0 720 516" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>질의응답 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="516" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">질의응답 흐름</text><rect x="14.0" y="50.0" width="488.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="50.0" width="186.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="71.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">① 질문</text><text x="212.0" y="71.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">대화 화면에 입력한 질문</text><rect x="14.0" y="96.0" width="488.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="96.0" width="186.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="117.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">② 권한 확인</text><text x="212.0" y="117.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">볼 수 있는 문서 범위 결정</text><path d="M107.0,82.0 L107.0,96.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="142.0" width="488.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="142.0" width="186.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="163.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">③ 질문 해석(27B)</text><text x="212.0" y="163.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업·연도·서류 종류 파악</text><path d="M107.0,128.0 L107.0,142.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="188.0" width="488.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="188.0" width="186.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="209.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">④ 범위 정하기</text><text x="212.0" y="209.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">지식 그래프로 관련 사업·문서 선택</text><path d="M107.0,174.0 L107.0,188.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="234.0" width="488.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="234.0" width="186.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="255.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">⑤ 문서 검색</text><text x="212.0" y="255.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">규정과 사업 문서를 함께 검색</text><path d="M107.0,220.0 L107.0,234.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="280.0" width="488.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="280.0" width="186.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="301.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">⑥ 근거 구성</text><text x="212.0" y="301.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">찾은 청크를 입력 길이에 맞춰 정리</text><path d="M107.0,266.0 L107.0,280.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="326.0" width="488.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="326.0" width="186.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="347.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">⑦ 답변 생성(27B)</text><text x="212.0" y="347.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거만으로 답변 작성</text><path d="M107.0,312.0 L107.0,326.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="372.0" width="488.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="372.0" width="186.0" height="32.0" rx="8" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="393.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">⑧ 수치 검증</text><text x="212.0" y="393.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거에 없는 수치를 찾아 표시</text><path d="M107.0,358.0 L107.0,372.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="418.0" width="488.0" height="32.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><rect x="14.0" y="418.0" width="186.0" height="32.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="439.5" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">⑨ 출처가 달린 답변</text><text x="212.0" y="439.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">답변과 근거 문서 목록 표시</text><path d="M107.0,404.0 L107.0,418.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="536.0" y="232.0" width="170.0" height="107.0" rx="8" fill="#f6f8fb" stroke="#7b8797" stroke-width="1.5" stroke-dasharray="6 4"/><text x="548.0" y="260.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">문서 작성 요청</text><text x="548.0" y="282.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">같은 검색을 거쳐 문서</text><text x="548.0" y="303.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">작업 에이전트가</text><text x="548.0" y="324.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">처리한다(4.6절).</text><path d="M502.0,250.0 L536.0,250.0" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="14.0" y="476.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">권한은 검색 단계에서 적용하므로 볼 수 없는 문서는 처음부터 근거에 들어가지 않는다. 화면의 출처는</text><text x="14.0" y="497.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">모델에 실제로 전달한 근거 목록에서만 만든다.</text></svg>
