<svg xmlns="http://www.w3.org/2000/svg" width="720" height="629" viewBox="0 0 720 629" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>질의 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="629" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">질의 흐름: 검색 → 생성 → 검증</text><rect x="14.0" y="50.0" width="120.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="88.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문 · 요청</text><rect x="160.0" y="50.0" width="120.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="172.0" y="88.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">입력 정리</text><path d="M134.0,82.5 L160.0,82.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="306.0" y="50.0" width="400.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="318.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">권한 점검</text><text x="318.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">개인정보 요청 차단 · RAG 공간 결정 · 감사 기록</text><path d="M280.0,82.5 L306.0,82.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="133.0" width="692.0" height="44.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="694.0" y="160.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">Writer 27B 가 단계마다 도구를 고름</text><text x="26.0" y="161.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">문서 작업 에이전트</text><path d="M506.0,115.0 L506.0,133.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="199.0" width="221.3" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="227.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">질문 읽기(27B)</text><text x="26.0" y="249.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">사업 · 연도 · 종류 · 관계</text><rect x="249.3" y="199.0" width="221.3" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="261.3" y="237.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">근거 찾기 · 이어 읽기</text><rect x="484.7" y="199.0" width="221.3" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="496.7" y="227.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">양식 고르기 · 설계</text><text x="496.7" y="249.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">절 쓰기</text><path d="M124.7,177.0 L124.7,199.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M360.0,177.0 L360.0,199.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M595.3,177.0 L595.3,199.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="277.0" width="221.3" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="315.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">그래프 범위 정하기</text><rect x="249.3" y="277.0" width="416.7" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="261.3" y="305.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">규정 검색 ∥ 사업 문서 검색</text><text x="261.3" y="327.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">어휘 + 의미 RRF, 규정은 리랭커까지</text><path d="M124.7,264.0 L124.7,277.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M360.0,264.0 L360.0,277.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M235.3,309.5 L249.3,309.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="355.0" width="456.7" height="44.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="26.0" y="383.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">근거 묶기 · 문맥 한도 맞추기</text><rect x="484.7" y="355.0" width="221.3" height="44.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="496.7" y="383.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">Writer 27B 생성</text><path d="M360.0,342.0 L360.0,355.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M470.7,377.0 L484.7,377.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M684.0,264.0 L684.0,355.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="412.0" width="692.0" height="72.0" rx="10" fill="#f6f8fb" stroke="#aab4c3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="26.0" y="434.0" font-size="16" font-weight="700" fill="#4b5563" text-anchor="start">검증</text><rect x="26.0" y="444.0" width="308.8" height="30.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="180.4" y="464.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">수치 검증: 근거 밖 숫자 표시 · 「○○」 마스킹</text><rect x="344.8" y="444.0" width="111.1" height="30.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="400.4" y="464.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">양식 검증 단계</text><rect x="466.0" y="444.0" width="78.5" height="30.0" rx="6" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="505.2" y="464.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">자가 점검</text><path d="M595.3,399.0 L595.3,412.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="14.0" y="500.0" width="339.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="26.0" y="528.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">출처 달린 답</text><text x="26.0" y="550.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">채팅 화면</text><rect x="367.0" y="500.0" width="339.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="379.0" y="528.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">한글 작업본(기안기) · 독스 작업본</text><text x="379.0" y="550.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">→ 원본 서식 완성본</text><path d="M183.5,484.0 L183.5,500.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M536.5,484.0 L536.5,500.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="14.0" y="589.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">권한은 답을 만든 뒤가 아니라 검색 단계의 SQL 조건으로 건다. 화면 출처는 모델에 실제로 건넨 근거</text><text x="14.0" y="610.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">목록에서만 만든다.</text></svg>
