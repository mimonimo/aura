<svg xmlns="http://www.w3.org/2000/svg" width="980" height="850" viewBox="0 0 980 850" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>질의 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="980" height="850" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">질의 흐름 — 검색 → 생성 → 검증</text><rect x="28" y="62" width="150" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">질문 · 요청</text><rect x="214" y="62" width="150" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="230" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">입력 정리</text><rect x="400" y="62" width="552" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="416" y="88" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">권한 점검</text><text x="416" y="110" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">개인정보 요청 차단 · RAG 공간 결정 · 감사 기록</text><path d="M178,94 L214,94" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M364,94 L400,94" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="250" y="162" width="480" height="64" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="266" y="188" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">문서 작업 에이전트</text><text x="266" y="210" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">Writer 27B 가 단계마다 도구를 고름</text><path d="M676,126 L676,144 L490,144 L490,162" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="262" width="296" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="288" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">질문 읽기(27B)</text><text x="44" y="310" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">사업 · 연도 · 종류 · 관계</text><path d="M490,226 L490,244 L176.0,244 L176.0,262" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="342" y="262" width="296" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="358" y="288" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">근거 찾기 · 이어 읽기</text><path d="M490,226 L490,244 L490.0,244 L490.0,262" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="656" y="262" width="296" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="672" y="288" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">양식 고르기 · 설계</text><text x="672" y="310" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">절 쓰기</text><path d="M490,226 L490,244 L804.0,244 L804.0,262" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="364" width="296" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="390" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">그래프 범위 정하기</text><path d="M176,334 L176,364" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="446" width="610" height="72" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="472" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">규정 검색 ∥ 사업 문서 검색</text><text x="44" y="494" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">어휘 + 의미 RRF, 규정은 리랭커까지</text><path d="M176,416 L176,446" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M490,334 L490,446" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="548" width="610" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="574" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">근거 묶기 · 문맥 한도 맞추기</text><path d="M333,518 L333,548" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="656" y="548" width="296" height="56" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="672" y="574" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">Writer 27B 생성</text><path d="M638,576 L656,576" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M804,334 L804,548" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="634" width="924" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="42" y="654" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="start">검증</text><rect x="46" y="664" width="400" height="30" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="246.0" y="683.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">수치 검증 — 근거 밖 숫자 표시 · 「○○」 가림</text><rect x="470" y="664" width="150" height="30" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="545.0" y="683.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">양식 관문</text><rect x="640" y="664" width="150" height="30" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="715.0" y="683.5" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="middle">자가 점검</text><path d="M804,604 L804,634" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><rect x="28" y="742" width="430" height="64" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="768" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">출처 달린 답</text><text x="44" y="790" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">채팅 화면</text><rect x="498" y="742" width="454" height="64" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="514" y="768" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">한글 작업본(기안기) · 독스 작업본</text><text x="514" y="790" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">→ 원본 서식 완성본</text><path d="M243,710 L243,742" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M725,710 L725,742" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="28" y="832" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">권한은 답을 만든 뒤가 아니라 검색 단계의 SQL 조건으로 건다. 화면 출처는 모델에 실제로 건넨 근거 목록에서만 만든다.</text></svg>
