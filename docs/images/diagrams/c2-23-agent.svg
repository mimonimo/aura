<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>에이전트 실행 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="1000" height="600" fill="#ffffff"/><text x="28" y="38" font-size="17" font-weight="700" fill="#1b3b75" text-anchor="start">에이전트 실행 흐름 — 모델이 고르고 코드가 지킨다</text><rect x="28" y="62" width="470" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="84" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">① 매 단계 다시 봄</text><text x="44" y="106" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">상태</text><text x="44" y="128" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">요청 · 작업 메모 · 최근 대화 · 프로젝트 문서 목록</text><text x="44" y="147" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">작업본의 절 목록과 빈 절 · 받지 못한 값</text><text x="44" y="166" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start">· 지금까지 한 단계</text><rect x="28" y="204" width="470" height="84" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="44" y="226" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">② 판단</text><text x="44" y="248" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">모델이 다음 행동 고르기</text><text x="44" y="270" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">{생각, 도구, 인자} 를 JSON 으로 (구조화 출력)</text><rect x="28" y="318" width="470" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="340" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">③ 검사</text><text x="44" y="362" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">코드 관문</text><text x="44" y="384" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">단계 수 상한 · 되돌리기 어려운 도구는 요청 글에 뜻이 있을 때만</text><text x="44" y="403" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">자료 울타리 · 열람 범위 · 수치 근거 대조</text><rect x="28" y="452" width="470" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="44" y="474" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">④ 실행</text><text x="44" y="496" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">도구 실행</text><text x="44" y="518" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">근거 찾기 · 문서 읽기 · 절 쓰기 · 검토 · 내보내기 · 묻기 …</text><path d="M263,182 L263,204" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M263,288 L263,318" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M263,422 L263,452" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="290" y="442" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">통과</text><rect x="590" y="452" width="240" height="84" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="606" y="474" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">⑤ 기록</text><text x="606" y="496" font-size="15" font-weight="700" fill="#1f2937" text-anchor="start">결과 기록</text><text x="606" y="518" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">결과는 자료로 돌려주고 남김</text><path d="M498,494 L590,494" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><path d="M498,370 L710,370 L710,452" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#head)"/><text x="604" y="362" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">막으면 까닭을 남김</text><path d="M830,494 L900,494 L900,122 L498,122" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="820" y="114" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">다음 단계 (되풀이)</text><rect x="590" y="204" width="240" height="84" rx="10" fill="#eef2f9" stroke="#1b3b75" stroke-width="1.4"/><text x="606" y="226" font-size="11" font-weight="400" fill="#64748b" text-anchor="start">끝</text><text x="606" y="248" font-size="15" font-weight="700" fill="#1b3b75" text-anchor="start">마무리</text><text x="606" y="270" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">답 · 작업본 · 한글 파일</text><path d="M498,246 L590,246" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#head)"/><text x="544.0" y="238" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="middle">마무리 고름</text><text x="28" y="570" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">무엇을 할지는 모델이 판단하고, 코드는 그 판단을 안전하게 실행한다. 출력 형식은 구조화 출력으로 강제한다.</text></svg>
