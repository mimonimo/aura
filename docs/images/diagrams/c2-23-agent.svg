<svg xmlns="http://www.w3.org/2000/svg" width="720" height="534" viewBox="0 0 720 534" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><title>에이전트 실행 흐름</title><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker><marker id="tail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8797"/></marker></defs><rect width="720" height="534" fill="#ffffff"/><text x="14.0" y="33.8" font-size="20" font-weight="700" fill="#1b3b75" text-anchor="start">에이전트 실행 흐름: 모델이 고르고 코드가 지킨다</text><rect x="14.0" y="50.0" width="440.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="442.0" y="77.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">① 매 단계 다시 봄</text><text x="26.0" y="78.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">상태</text><text x="26.0" y="100.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">요청 · 작업 메모 · 최근 대화 · 프로젝트 문서 목록</text><text x="26.0" y="121.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">작업본의 절 목록과 빈 절 · 받지 못한 값</text><text x="26.0" y="142.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">· 지금까지 한 단계</text><rect x="14.0" y="181.0" width="440.0" height="65.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="442.0" y="208.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">② 판단</text><text x="26.0" y="209.2" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">모델이 다음 행동 고르기</text><text x="26.0" y="231.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">{생각, 도구, 인자} 를 JSON 으로 (구조화 출력)</text><rect x="14.0" y="270.0" width="440.0" height="107.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="442.0" y="297.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">③ 검사</text><text x="26.0" y="298.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">코드 검증 단계</text><text x="26.0" y="320.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">단계 수 상한 · 되돌리기 어려운 도구는 요청 글에 뜻이 있을</text><text x="26.0" y="341.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">때만</text><text x="26.0" y="362.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">자료 울타리 · 열람 범위 · 수치 근거 대조</text><rect x="14.0" y="401.0" width="440.0" height="65.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="442.0" y="428.8" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">④ 실행</text><text x="26.0" y="429.2" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">도구 실행</text><text x="26.0" y="451.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">근거 찾기 · 문서 읽기 · 절 쓰기 · 검토 · 내보내기 · 묻기 …</text><path d="M234.0,157.0 L234.0,181.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M234.0,246.0 L234.0,270.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M234.0,377.0 L234.0,401.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="244.0" y="395.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">통과</text><rect x="510.0" y="170.5" width="170.0" height="86.0" rx="8" fill="#eef2f9" stroke="#1b3b75" stroke-width="2.2"/><text x="668.0" y="198.3" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">끝</text><text x="522.0" y="198.7" font-size="18" font-weight="700" fill="#1b3b75" text-anchor="start">마무리</text><text x="522.0" y="220.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">답 · 작업본 · 한글</text><text x="522.0" y="241.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">파일</text><path d="M454.0,213.5 L510.0,213.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><rect x="510.0" y="390.5" width="170.0" height="86.0" rx="8" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/><text x="668.0" y="418.3" font-size="16" font-weight="400" fill="#4b5563" text-anchor="end">⑤ 기록</text><text x="522.0" y="418.7" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">결과 기록</text><text x="522.0" y="440.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">결과는 자료로</text><text x="522.0" y="461.5" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">돌려주고 남김</text><path d="M454.0,433.5 L510.0,433.5" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><path d="M454.0,323.5 L595.0,323.5 L595.0,390.5" fill="none" stroke="#7b8797" stroke-width="2.0" stroke-dasharray="6 4" marker-end="url(#head)"/><text x="603.0" y="345.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">막으면 까닭을</text><text x="603.0" y="366.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">남김</text><path d="M680.0,433.5 L698.0,433.5 L698.0,80.0 L454.0,80.0" fill="none" stroke="#7b8797" stroke-width="2.0" marker-end="url(#head)"/><text x="462.0" y="104.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">다음 단계 (되풀이)</text><text x="595.0" y="162.5" font-size="16" font-weight="400" fill="#4b5563" text-anchor="middle">마무리 고름</text><text x="14.0" y="494.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">무엇을 할지는 모델이 판단하고, 코드는 그 판단을 안전하게 실행한다. 출력 형식은 구조화 출력으로</text><text x="14.0" y="515.0" font-size="16" font-weight="400" fill="#4b5563" text-anchor="start">강제한다.</text></svg>
