{# 시스템 구성 — 장비·역할·연결은 app/process_flow 의 HOSTS·LINKS 한 곳에서 읽는다(처리 흐름 화면과 같은 원본) #}
<section class="system-overview" id="system" aria-labelledby="systemHeading">
  <header class="system-heading">
    <div><h3 id="systemHeading">시스템 구성</h3></div>
    <span class="system-links"><a href="/dev/flow">상세 구성도 · 처리 흐름</a> · <a href="/dev/flow#coedit">공동 편집 처리 방식</a></span>
  </header>
  <div class="system-roles">
    {% for h in system_hosts %}
    <article class="system-role{% if h.name == '운영 VM' %} system-role-main{% endif %}">
      <h4>{{ h.name }}</h4>
      <ul><li>{{ h.role }}</li><li class="muted">{{ h.spec }}</li></ul>
    </article>
    {% endfor %}
  </div>
  <div class="table-scroll" style="margin-top:10px;"><table class="system-links-table">
    <tr><th>보내는 곳</th><th></th><th>받는 곳</th><th>무엇을</th></tr>
    {% for a, b, what in system_links %}<tr><td>{{ a }}</td><td class="muted">→</td><td>{{ b }}</td><td>{{ what }}</td></tr>{% endfor %}
  </table></div>
</section>
