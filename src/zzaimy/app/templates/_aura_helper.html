{# 업무 도우미 — 넓은 화면은 오른쪽 옆 패널(열면 본문이 그 폭만큼 좁아진다), 좁은 폭은 아래 시트.
   모양·동작은 static/aura-helper.css·aura-helper.js. 여기는 틀(여는 단추·패널·글 선택 메뉴)만 둔다 #}
<link rel="stylesheet" href="/static/aura-helper.css?v={{ asset_v }}">
<button type="button" class="ag-fab" id="agFab" title="업무 도우미" aria-label="업무 도우미" aria-controls="agPanel" aria-expanded="false">
  <iconify-icon icon="solar:chat-round-line-linear"></iconify-icon></button>

<section class="ag-panel" id="agPanel" role="complementary" aria-labelledby="agTitle" aria-hidden="true" inert
         data-project="{{ project.id if project is defined and project else '' }}">
  <div class="ag-rz" data-rz title="끌어서 폭 조절" aria-hidden="true"></div>
  <header class="ag-head">
    <button type="button" class="ag-hb" id="agBack" data-tip="대화로" aria-label="대화로 돌아가기" hidden>
      <iconify-icon icon="solar:alt-arrow-left-linear"></iconify-icon></button>
    <div class="ag-ttl">
      <b id="agTitle">업무 도우미</b>
      <span id="agSub" hidden></span>
    </div>
    <button type="button" class="ag-hb" id="agHist" data-tip="지난 대화" aria-label="지난 대화">
      <iconify-icon icon="solar:history-linear"></iconify-icon></button>
    <button type="button" class="ag-hb" id="agNew" data-tip="새 대화" aria-label="새 대화">
      <iconify-icon icon="solar:pen-new-square-linear"></iconify-icon></button>
    <button type="button" class="ag-hb" id="agClose" data-tip="닫기 (Esc)" aria-label="닫기">
      <iconify-icon icon="solar:close-circle-linear"></iconify-icon></button>
  </header>

  <div class="ag-view" id="agChatView">
    <div class="ag-body" id="agBody" aria-live="polite"></div>
    <button type="button" class="ag-jump" id="agJump" hidden aria-label="맨 아래로">
      <iconify-icon icon="solar:alt-arrow-down-linear"></iconify-icon></button>
    <div class="ag-foot">
      <div class="ag-quote" id="agQuote" hidden>
        <iconify-icon icon="solar:quote-square-linear"></iconify-icon>
        <span id="agQuoteText"></span>
        <button type="button" id="agQuoteClear" title="선택한 글 빼기" aria-label="선택한 글 빼기">
          <iconify-icon icon="solar:close-circle-linear"></iconify-icon></button>
      </div>
      <div class="ag-row">
        <textarea id="agInput" rows="1" placeholder="무엇이든 물어보세요" aria-label="도우미에게 보낼 말"></textarea>
        <button type="button" class="ag-send" id="agSend" title="보내기 (Enter)" aria-label="보내기" disabled>
          <iconify-icon icon="solar:arrow-up-linear"></iconify-icon></button>
      </div>
    </div>
  </div>

  <div class="ag-view" id="agHistView" hidden>
    <div class="ag-hfind">
      <iconify-icon icon="solar:magnifer-linear"></iconify-icon>
      <input type="search" id="agHistFind" placeholder="지난 대화 찾기" aria-label="지난 대화 찾기" autocomplete="off">
    </div>
    <div class="ag-hlist" id="agHistList" role="list"></div>
  </div>
</section>

<div class="ag-menu" id="agMenu">
  <button type="button" class="ag-menu-go" data-q="선택한 부분을 쉽게 설명해 주세요.">
    <iconify-icon icon="solar:lightbulb-linear"></iconify-icon>쉽게 설명</button>
  <button type="button" class="ag-menu-go" data-q="선택한 부분을 짧게 간추려 주세요.">
    <iconify-icon icon="solar:list-down-linear"></iconify-icon>간추리기</button>
  <button type="button" class="ag-menu-go" data-q="선택한 부분과 관련된 교내 규정을 찾아 주세요.">
    <iconify-icon icon="solar:library-linear"></iconify-icon>관련 규정 찾기</button>
  <button type="button" id="agMenuAsk">
    <iconify-icon icon="solar:chat-round-line-linear"></iconify-icon>직접 묻기</button>
</div>
<script src="/static/aura-helper.js?v={{ asset_v }}" defer></script>
