{# 부서 드라이브 카드 — 부서가 함께 쓸 구글 계정을 연결한다(dept_drive_routes). 필요한 값: dept(부서 이름), asset_v.
   상태·버튼은 static/dept-drive.js 가 GET /team/drive?dept= 로 받아 그린다(권한은 서버가 매번 다시 본다). #}
<link rel="stylesheet" href="/static/aura-finder.css?v={{ asset_v }}">
<style>
  .dd-card { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:0 0 14px; font-size:13px; }
  .dd-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .dd-head iconify-icon { font-size:18px; color:#5a7aa4; }
  .dd-body { display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  .dd-line { margin:0; color:var(--muted); font-size:12.5px; }
  .dd-warn { color:#8a5a00; } .dd-bad, .dd-msg.bad { color:var(--red, #b91c1c); }
  .dd-note { font-size:12px; }
  .dd-msg { margin:6px 0 0; font-size:12.5px; } .dd-msg:empty { display:none; }
  .dd-acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .dd-acts button { padding:5px 11px; font-size:12.5px; }
  .dd-acts .dd-danger { background:transparent; border:1px solid var(--line); color:var(--red, #b91c1c); }
  dialog.dd-confirm { border:1px solid var(--line); border-radius:14px; padding:20px; max-width:420px; font-size:14px; line-height:1.6; }
  dialog.dd-confirm::backdrop { background:#15243c4d; }
  .dd-confirm-row { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
</style>
<div class="dd-card" data-dept-drive data-dept="{{ dept }}" aria-live="polite"></div>
<script src="/static/dept-drive.js?v={{ asset_v }}" defer></script>
