{% extends "base.html" %}
{% block title %}설정 — YNC 행정 에이전트{% endblock %}
{% block pagetitle %}설정{% endblock %}
{% block content %}

<div class="card reveal">
  <div class="card-in">
    <h2><iconify-icon icon="solar:user-id-linear"></iconify-icon>담당자 프로필</h2>
    <form action="/settings" method="post">
      <div style="display:grid; grid-template-columns:140px 1fr; gap:14px 16px; align-items:center; max-width:640px;">
        <label class="muted" for="s-name">성명</label>
        <input id="s-name" type="text" name="name" value="{{ s.get('name', '') }}"
               placeholder="예: 홍길동"
               style="border:1.5px solid var(--line); border-radius:12px; padding:9px 14px; font-family:inherit; font-size:14px;">
        <label class="muted" for="s-call">에이전트가 부를 호칭</label>
        <input id="s-call" type="text" name="call_me" value="{{ s.get('call_me', '') }}"
               placeholder="예: 선생님, 담당자님"
               style="border:1.5px solid var(--line); border-radius:12px; padding:9px 14px; font-family:inherit; font-size:14px;">
        <label class="muted" for="s-dept">소속 부서</label>
        <span>
          <input id="s-dept" type="text" name="dept" value="{{ s.get('dept', '') }}"
                 list="deptList" placeholder="예: 산학협력단" style="width:100%;
                 border:1.5px solid var(--line); border-radius:12px; padding:9px 14px; font-family:inherit; font-size:14px;">
          <datalist id="deptList">
            {% for d in departments %}<option value="{{ d.dept }}">{{ d.dept }} · 문서 {{ d.n_docs }}건</option>{% endfor %}
          </datalist>
          {% if departments %}
          <span class="muted" style="font-size:11.5px; display:block; margin-top:5px;">
            부서를 고르면 검색이 그 부서 문서와 공통 규정으로 좁혀집니다.</span>
          {% endif %}
        </span>
      </div>

      <h2 style="margin-top:26px;"><iconify-icon icon="solar:notes-linear"></iconify-icon>에이전트 지침</h2>
      <p class="muted" style="margin:0 0 10px;">채팅과 검토에 항상 적용됩니다.</p>
      <textarea name="instructions" style="min-height:130px; max-width:760px;"
                placeholder="예: 반려 사유에는 근거가 되는 규정 조항을 함께 적는다.">{{ s.get('instructions', '') }}</textarea>
      <div style="margin-top:14px;"><button type="submit">저장</button></div>
    </form>
  </div>
</div>
{% endblock %}
