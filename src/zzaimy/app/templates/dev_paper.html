{% extends "base.html" %}
{% block title %}논문 원재료 — {{ fname }}{% endblock %}
{% block pagetitle %}논문 원재료{% endblock %}
{% block content %}
<p style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
  <a href="/dev" class="btn-ghost">← 개발 현황</a>
  {% for p in papers %}
  <a href="/dev/paper/{{ p }}" class="pill {{ 'reviewed' if p == fname else '' }}"
     style="text-decoration:none;">{{ p }}</a>
  {% endfor %}
</p>
<div class="card reveal"><div class="card-in">
  <h2><iconify-icon icon="solar:document-text-linear"></iconify-icon>{{ fname }}
    <span style="margin-left:auto; display:flex; gap:8px;">
      <a href="/dev/paper/{{ fname }}/export.hwpx" class="btn-ghost" style="font-weight:600;">.hwpx</a>
      <a href="/dev/paper/{{ fname }}/export.docx" class="btn-ghost" style="font-weight:600;">.docx</a>
    </span></h2>
  <div>{{ content | md_view }}</div>
</div></div>
{% endblock %}
