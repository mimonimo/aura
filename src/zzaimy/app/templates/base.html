<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}YNC 행정문서 검토 플랫폼{% endblock %}</title>
{% block head %}{% endblock %}
<style>
  :root {
    --topbar: #16223A;      /* 최상단 유틸바 */
    --navy: #1B3B75;        /* 주 색 */
    --blue: #497BFB;        /* 포인트 블루 */
    --ink: #26303C;         /* 본문 텍스트 */
    --muted: #5A7099;
    --bg: #F2F6F9;
    --line: #D3DAE3;
    --green: #1E6B4F;
    --orange: #FFA943;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-size: 15px;
         font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }

  .topbar { background: var(--topbar); color: #D3DAE3; font-size: 12.5px;
            padding: 8px 32px; display: flex; gap: 18px; }
  .topbar a { color: #D3DAE3; text-decoration: none; }

  .sitehead { background: #fff; border-bottom: 1px solid var(--line);
              padding: 16px 32px; display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; flex-direction: column; text-decoration: none; }
  .brand b { color: var(--ink); font-size: 19px; letter-spacing: -0.3px; }
  .brand span { color: var(--muted); font-size: 12px; }
  .sitehead nav { margin-left: auto; display: flex; gap: 26px; font-size: 15px; }
  .sitehead nav a { color: var(--ink); text-decoration: none; font-weight: 500; }
  .sitehead .user-pill { background: var(--navy); color: #fff; border-radius: 22px;
              padding: 9px 20px; font-size: 14px; font-weight: 600; margin-left: 26px; }

  main { max-width: 1040px; margin: 30px auto 60px; padding: 0 24px; }

  .card { background: #fff; border-radius: 16px; padding: 26px 28px; margin-bottom: 22px;
          box-shadow: 0 2px 10px rgba(22, 34, 58, 0.05); }
  .card h2 { font-size: 17px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
  .card h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%;
                     background: var(--navy); }
  .card.accent h2::before { background: var(--orange); }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
  .tile { background: #fff; border-radius: 16px; padding: 20px; text-align: center;
          box-shadow: 0 2px 10px rgba(22, 34, 58, 0.05); }
  .tile .ico { width: 46px; height: 46px; border-radius: 13px; margin: 0 auto 10px;
               display: flex; align-items: center; justify-content: center;
               color: #fff; font-size: 21px; }
  .tile b { display: block; font-size: 15px; }
  .tile span { color: var(--muted); font-size: 12.5px; }
  .ico.blue { background: var(--blue); } .ico.navy { background: var(--navy); }
  .ico.orange { background: var(--orange); } .ico.green { background: #2E9E6B; }

  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid #E9EDF2; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  tr:hover td { background: #F7FAFC; }
  a { color: var(--navy); }

  .pill { display: inline-block; border-radius: 20px; padding: 3px 12px;
          font-size: 12.5px; background: #EEF1F5; color: var(--muted); }
  .pill.reviewed { background: #E3F2E9; color: var(--green); }
  .pill.processing { background: #FFF4E6; color: #B26B00; }
  .pill.failed { background: #FDEAEA; color: #B3312F; }
  .pill.type { background: #E9F0FE; color: var(--navy); }

  button, .btn { background: var(--navy); color: #fff; border: 0; border-radius: 22px;
           padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
           text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: var(--blue); }
  button.secondary { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }

  select, input[type=file], textarea { font-size: 14px; }
  select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
           background: #fff; color: var(--ink); }
  textarea { border: 1px solid var(--line); border-radius: 12px; padding: 12px;
             width: 100%; min-height: 90px; resize: vertical; }
  pre.doc-text { white-space: pre-wrap; font-family: inherit; font-size: 14.5px;
                 line-height: 1.75; background: #F7FAFC; border: 1px solid #E9EDF2;
                 border-radius: 12px; padding: 16px 18px; max-height: 460px;
                 overflow-y: auto; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .notice { font-size: 13px; color: var(--muted); background: #F7FAFC;
            border-radius: 10px; padding: 10px 14px; margin-top: 12px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="https://www.ync.ac.kr" target="_blank">영남이공대학교 홈페이지</a>
  <a href="https://yclass.ync.ac.kr" target="_blank">LMS</a>
  <span style="margin-left:auto;">행정업무 자동화 · 캡스톤디자인</span>
</div>
<div class="sitehead">
  <a class="brand" href="/">
    <b>영남이공대학교 행정문서 검토 플랫폼</b>
    <span>Yeungnam University College · 문서 접수 · 자동 검토 · 초안 생성</span>
  </a>
  <nav>
    <a href="/">문서함</a>
  </nav>
  <span class="user-pill">담당자</span>
</div>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
