{# 한글 대상 문서 선택 모달 — project.html·chat.html 공용. data-modal-open="#hwpTargetModal" 로 연다. #}
<div id="hwpTargetModal" class="modal-back">
  <div class="card"><div class="card-in">
    <div class="modal-head">
      <h2><iconify-icon icon="solar:document-text-linear"></iconify-icon>대상 문서</h2>
      <button type="button" data-modal-close class="icon-btn" title="닫기"
              style="width:32px; height:32px; font-size:15px;">
        <iconify-icon icon="solar:close-circle-linear"></iconify-icon></button>
    </div>
    <div id="hwpDrop" style="border:1.5px dashed var(--line); border-radius:12px;
         padding:16px; text-align:center; color:var(--muted); font-size:12.5px;
         margin-bottom:12px; transition:all .2s var(--ease); cursor:pointer;">
      <iconify-icon icon="solar:upload-square-linear" style="font-size:24px; color:var(--navy);"></iconify-icon>
      <div style="margin-top:4px;"><b>파일을 끌어다 놓거나</b> 눌러서 선택 — .hwp / .hwpx</div>
      <div style="font-size:11px; margin-top:2px;">최대 20MB</div>
      <input type="file" id="hwpDropInput" accept=".hwp,.hwpx" hidden>
    </div>

    <div id="hwpTgtStatus" class="muted" style="font-size:12.5px; margin-bottom:10px;"></div>
    <div id="hwpTgtList" style="display:flex; flex-direction:column; gap:8px;
         max-height:280px; overflow:auto;"></div>

    <div style="display:flex; gap:8px; justify-content:space-between; margin-top:16px;">
      <button type="button" id="hwpTgtNew" class="secondary">
        <iconify-icon icon="solar:add-square-linear"></iconify-icon>새 문서로 작성</button>
      <span style="display:flex; gap:8px;">
        <button type="button" id="hwpTgtRefresh" class="secondary">
          <iconify-icon icon="solar:refresh-linear"></iconify-icon>새로고침</button>
        <button type="button" data-modal-close class="secondary">닫기</button>
      </span>
    </div>
  </div></div>
</div>

<script>
  // 한글 대상 문서 선택 — /hwp/docs 목록 · /hwp/target 지정 · /hwp/open-upload 파일 불러오기
  (function () {
    var openBtns = document.querySelectorAll('[data-modal-open="#hwpTargetModal"]');
    if (!openBtns.length) return;
    var listEl = document.getElementById("hwpTgtList");
    var statusEl = document.getElementById("hwpTgtStatus");
    var newBtn = document.getElementById("hwpTgtNew");
    var refreshBtn = document.getElementById("hwpTgtRefresh");
    var drop = document.getElementById("hwpDrop");
    var dropInput = document.getElementById("hwpDropInput");
    var pollTimer = null;

    function row(d) {
      var wrap = document.createElement("div");
      wrap.style.cssText = "display:flex; gap:10px; align-items:center; padding:8px 12px;" +
        "border:1px solid var(--line); border-radius:10px; font-size:12.5px;" +
        (d.bound ? "background:#EAF1FC;" : "");
      var pill = document.createElement("span");
      pill.className = "pill " + (d.bound ? "reviewed" : (d.active ? "type" : ""));
      pill.style.flex = "none";
      pill.textContent = d.bound ? "대상" : (d.active ? "활성" : "열림");
      var name = document.createElement("span");
      name.style.fontWeight = "600";
      name.textContent = d.name || "(제목 없음)";
      var path = document.createElement("span");
      path.className = "muted";
      path.style.cssText = "flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;";
      path.textContent = d.path || "";
      wrap.appendChild(pill); wrap.appendChild(name); wrap.appendChild(path);
      if (d.bound) {
        var cur = document.createElement("span");
        cur.className = "muted"; cur.style.cssText = "flex:none; font-size:11.5px;";
        cur.textContent = "현재 대상"; wrap.appendChild(cur);
      } else {
        var btn = document.createElement("button");
        btn.type = "button"; btn.className = "secondary";
        btn.style.cssText = "flex:none; font-size:11.5px; padding:4px 11px;";
        btn.textContent = "이 문서로";
        btn.addEventListener("click", function () { setTarget("select", d.id); });
        wrap.appendChild(btn);
      }
      return wrap;
    }

    function render(data) {
      listEl.innerHTML = "";
      if (!data.connected) {
        statusEl.textContent = "연결된 한글 에이전트가 없습니다 — PC에서 에이전트를 실행하세요.";
        return;
      }
      if (!data.docs || !data.docs.length) {
        statusEl.textContent = "열린 문서가 없습니다. PC에서 한글 문서를 열고 새로고침하세요.";
        return;
      }
      statusEl.textContent = "PC에서 열린 문서 " + data.docs.length + "개";
      data.docs.forEach(function (d) { listEl.appendChild(row(d)); });
    }

    function fetchDocs(refresh) {
      return fetch("/hwp/docs" + (refresh ? "?refresh=1" : ""), { cache: "no-store" })
        .then(function (r) { return r.json(); });
    }

    function load() {
      statusEl.textContent = "불러오는 중…"; listEl.innerHTML = "";
      fetchDocs(true).then(function (d) {
        render(d);
        clearInterval(pollTimer);
        var tries = 0;
        pollTimer = setInterval(function () {
          tries++;
          fetchDocs(false).then(function (d2) {
            if ((d2.docs && d2.docs.length) || tries >= 5) {
              render(d2); clearInterval(pollTimer);
            }
          });
        }, 1500);
      }).catch(function () { statusEl.textContent = "목록을 불러오지 못했습니다."; });
    }

    function setTarget(mode, id) {
      var fd = new FormData();
      fd.append("mode", mode);
      if (id !== undefined && id !== null) fd.append("id", id);
      statusEl.textContent = "지정하는 중…";
      fetch("/hwp/target", { method: "POST", body: fd })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.ok) { statusEl.textContent = "지정됨 — 목록을 갱신합니다."; load(); }
          else { statusEl.textContent = res.error || "지정 실패"; }
        })
        .catch(function () { statusEl.textContent = "지정 실패"; });
    }

    function upload(file) {
      if (!file) return;
      if (file.size > 20 * 1024 * 1024) { statusEl.textContent = "파일이 너무 큽니다(20MB 초과)."; return; }
      var fd = new FormData();
      fd.append("file", file);
      statusEl.textContent = "‘" + file.name + "’ 불러오는 중…";
      fetch("/hwp/open-upload", { method: "POST", body: fd })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (res.ok) { statusEl.textContent = "‘" + res.name + "’ 열림 — 대상으로 지정됨."; load(); }
          else { statusEl.textContent = res.error || "불러오기 실패"; }
        })
        .catch(function () { statusEl.textContent = "불러오기 실패"; });
    }

    openBtns.forEach(function (b) { b.addEventListener("click", load); });
    refreshBtn.addEventListener("click", load);
    newBtn.addEventListener("click", function () { setTarget("new"); });
    drop.addEventListener("click", function () { dropInput.click(); });
    dropInput.addEventListener("change", function () { if (dropInput.files[0]) upload(dropInput.files[0]); });
    ["dragenter", "dragover"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) {
        e.preventDefault(); drop.style.borderColor = "var(--navy)"; drop.style.background = "#F2F6FD";
      });
    });
    ["dragleave", "drop"].forEach(function (ev) {
      drop.addEventListener(ev, function (e) {
        e.preventDefault(); drop.style.borderColor = "var(--line)"; drop.style.background = "";
      });
    });
    drop.addEventListener("drop", function (e) {
      if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
    });
  })();
</script>
