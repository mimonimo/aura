{# 라이브러리 — 문서를 보는 곳은 여기 하나다. 문서(등록 문서 한 목록, 기준은 쓰임새 칩) / 원본 보관소(학교 원본 파일). ADR-0062 #}
{% set lp = request.url.path %}
<nav class="space-links library-tabs" aria-label="라이브러리" style="margin:0 0 18px;">
  <a href="/?type=all" {% if lp in ('/', '/inbox') %}aria-current="page"{% endif %}>{{ library_tabs.docs }}</a>
  <a href="/archive" {% if lp.startswith('/archive') %}aria-current="page"{% endif %}>{{ library_tabs.archive }}</a>
</nav>
